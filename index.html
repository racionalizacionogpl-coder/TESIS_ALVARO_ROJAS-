<title>Teoría de Colas OGPL</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700;800&family=Lora:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef1f4; --bg-dot:#d7dee3; --card:#ffffff; --card-2:#f4f6f8;
    --ink:#152227; --ink-2:#3d4d54; --muted:#6b7b82; --line:#e1e6ea;
    --navy:#153039; --navy-2:#1f4650; --navy-ink:#0d1f24;
    --pill-active-bg:#c7e8ef; --pill-active-ink:#0d3540;
    --lavender-bg:#e8e5f8; --lavender-ink:#4a3f95;
    --sage-bg:#dcecdf; --sage-ink:#2c5c37;
    --peach-bg:#fbe6d4; --peach-ink:#9a4e1f;
    --mint-bg:#e6f5ea; --mint-ink:#25623a;
    --rose-bg:#fbe3e3; --rose-ink:#9c3232;
    --amber-bg:#fbf0d4; --amber-ink:#8a6412;
    --shadow: 0 1px 2px rgba(15,35,40,.04), 0 8px 24px -12px rgba(15,35,40,.18);
    --radius-lg:20px; --radius-md:14px;
    --font-display:'Baloo 2', ui-rounded, system-ui, sans-serif;
    --font-serif:'Lora', Georgia, serif;
    --font-body:'Inter', system-ui, -apple-system, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1a1e; --bg-dot:#16252a; --card:#152227; --card-2:#1b2c32;
      --ink:#eef3f4; --ink-2:#c3d1d5; --muted:#93a5ac; --line:#26383e;
      --navy:#0a1a1f; --navy-2:#123039; --navy-ink:#eef3f4;
      --pill-active-bg:#1f4650; --pill-active-ink:#c7e8ef;
      --lavender-bg:#2a2650; --lavender-ink:#c7c0f7;
      --sage-bg:#1d3524; --sage-ink:#a6dcb2;
      --peach-bg:#3a2916; --peach-ink:#f0b380;
      --mint-bg:#17301f; --mint-ink:#93d9a8;
      --rose-bg:#3a1c1c; --rose-ink:#f0a3a3;
      --amber-bg:#332a10; --amber-ink:#f0cf6a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1a1e; --bg-dot:#16252a; --card:#152227; --card-2:#1b2c32;
    --ink:#eef3f4; --ink-2:#c3d1d5; --muted:#93a5ac; --line:#26383e;
    --navy:#0a1a1f; --navy-2:#123039; --navy-ink:#eef3f4;
    --pill-active-bg:#1f4650; --pill-active-ink:#c7e8ef;
    --lavender-bg:#2a2650; --lavender-ink:#c7c0f7;
    --sage-bg:#1d3524; --sage-ink:#a6dcb2;
    --peach-bg:#3a2916; --peach-ink:#f0b380;
    --mint-bg:#17301f; --mint-ink:#93d9a8;
    --rose-bg:#3a1c1c; --rose-ink:#f0a3a3;
    --amber-bg:#332a10; --amber-ink:#f0cf6a;
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--font-body); font-size:15px; line-height:1.55;
    background-image:radial-gradient(var(--bg-dot) 1px, transparent 1px);
    background-size:18px 18px;
  }
  img{max-width:100%;}
  [hidden]{display:none!important;}
  h1,h2,h3{font-family:var(--font-display); margin:0; text-wrap:balance;}
  p{margin:0;}
  a{color:inherit;}
  .wrap{max-width:1180px; margin:0 auto; padding-inline:20px;}
  .wrap-wide{max-width:1400px; margin:0 auto; padding-inline:20px;}
  ::selection{background:var(--pill-active-bg); color:var(--pill-active-ink);}

  header.nav{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:50;
    background:color-mix(in srgb, var(--card) 92%, transparent);
    backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
  }
  .nav-row{display:flex; align-items:center; gap:10px; padding-block:12px; flex-wrap:nowrap;}
  .brand{display:flex; align-items:center; gap:8px; margin-right:0; flex:none;}
  .brand-mark{width:30px; height:30px; border-radius:50%; background:var(--navy); display:grid; place-items:center; flex:none;}
  .brand-text b{display:block; font-family:var(--font-display); font-weight:700; font-size:13px; letter-spacing:.1px; white-space:nowrap;}
  .brand-text span{display:block; font-size:10.5px; color:var(--muted); font-weight:600; white-space:nowrap;}
  nav.tabs{display:flex; gap:0; flex:1 1 auto; min-width:0; flex-wrap:nowrap; justify-content:center; overflow-x:auto; scrollbar-width:none; -ms-overflow-style:none;}
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{
    font-family:var(--font-body); font-weight:600; font-size:11.2px; color:var(--ink-2);
    background:transparent; border:none; padding:7px 8px; border-radius:999px; cursor:pointer; white-space:nowrap; flex:none;
  }
  nav.tabs button:hover{background:var(--card-2);}
  nav.tabs button[aria-current="page"]{background:var(--pill-active-bg); color:var(--pill-active-ink);}
  nav.tabs button:focus-visible, .btn:focus-visible, .idx-item:focus-visible{outline:2px solid var(--navy-2); outline-offset:2px;}
  .save-status{font-size:10.5px; color:var(--muted); white-space:nowrap; flex:none;}
  @media (max-width:1200px){
    nav.tabs{justify-content:flex-start;}
    .brand-text span{display:none;}
  }

  .btn{display:inline-flex; align-items:center; gap:8px; font-family:var(--font-body); font-weight:700; font-size:14px;
    padding:12px 20px; border-radius:999px; border:1px solid transparent; cursor:pointer; text-decoration:none;}
  .btn-dark{background:var(--navy); color:#fff;}
  .btn-dark:hover{background:var(--navy-2);}
  .btn-ghost{background:var(--card); color:var(--ink); border-color:var(--line);}
  .btn-ghost:hover{background:var(--card-2);}
  .btn-sm{padding:8px 14px; font-size:12.5px; border-radius:999px; font-weight:700; cursor:pointer; border:1px solid var(--line); background:var(--card); color:var(--ink);}
  .btn-sm.primary{background:var(--navy); color:#fff; border-color:var(--navy);}
  .btn-sm.danger{background:var(--rose-bg); color:var(--rose-ink); border-color:transparent;}

  .hero-shell{background:var(--card); border-bottom:1px solid var(--line);}
  .hero{padding-block:56px 44px;}
  .hero-grid{display:grid; grid-template-columns:1.05fr .95fr; gap:36px; align-items:center;}
  .badge-pill{display:inline-flex; align-items:center; gap:8px; background:var(--navy); color:#fff; font-weight:700;
    font-size:12px; letter-spacing:.06em; padding:8px 14px 8px 10px; border-radius:999px; margin-bottom:22px;}
  .badge-pill .dot{width:6px;height:6px;border-radius:50%;background:#fff;}
  h1.hero-title{font-size:clamp(34px,5vw,52px); font-weight:800; line-height:1.05; color:var(--ink); margin-bottom:18px;}
  .hero-sub{font-size:16.5px; color:var(--ink-2); max-width:46ch; margin-bottom:26px;}
  .hero-actions{display:flex; gap:12px; flex-wrap:wrap;}

  .hero-card{background:var(--card); border-radius:var(--radius-lg); box-shadow:var(--shadow); padding:32px; border:1px solid var(--line);}
  .crumbs{display:flex; align-items:center; gap:8px; font-weight:800; font-size:12px; letter-spacing:.08em; color:var(--navy-2); margin-bottom:16px;}
  .crumbs .sep{color:var(--muted); font-weight:600;}
  .hero-card h2{font-family:var(--font-serif); font-weight:500; font-size:26px; line-height:1.28; color:var(--ink); margin-bottom:14px;}
  .hero-card p{color:var(--ink-2); margin-bottom:14px;}
  .hero-quote{font-family:var(--font-serif); font-style:italic; color:var(--navy-2); font-size:15px; margin-bottom:20px;}
  .cat-list{display:flex; flex-direction:column; gap:10px;}
  .cat{display:flex; align-items:center; gap:14px; border-radius:16px; padding:14px 16px;}
  .cat .ic{width:38px; height:38px; border-radius:11px; background:var(--card); display:grid; place-items:center; flex:none; box-shadow:var(--shadow);}
  .cat b{display:block; font-size:14.5px;}
  .cat span{display:block; font-size:12.5px; opacity:.85;}
  .cat.c1{background:var(--lavender-bg); color:var(--lavender-ink);}
  .cat.c2{background:var(--sage-bg); color:var(--sage-ink);}
  .cat.c3{background:var(--peach-bg); color:var(--peach-ink);}

  .stats-band{background:var(--navy); color:#fff; margin-block:8px;}
  .stats-grid{display:grid; grid-template-columns:.85fr 1.15fr; gap:0;}
  .stats-left{padding:52px 20px; display:flex; flex-direction:column; gap:16px; justify-content:center;}
  .seal{width:56px; height:56px; border-radius:50%; border:1.5px solid rgba(255,255,255,.35); display:grid; place-items:center;}
  .stats-left h3{font-size:23px; font-weight:700; max-width:16ch;}
  .stats-left p{color:rgba(255,255,255,.72); max-width:34ch; font-size:14px;}
  .stats-right{position:relative; padding:36px 20px;
    background:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,.08) 0, transparent 40%),
      radial-gradient(circle at 85% 75%, rgba(255,255,255,.06) 0, transparent 45%),
      linear-gradient(135deg, var(--navy-2), var(--navy) 70%);
    display:grid; grid-template-columns:1fr 1fr; gap:14px; align-content:center;}
  .stat-card{background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16); border-radius:16px; padding:16px 18px; backdrop-filter:blur(2px);}
  .stat-card .ic{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.14); display:grid; place-items:center; margin-bottom:10px;}
  .stat-card b{display:block; font-size:24px; font-weight:800; font-variant-numeric:tabular-nums;}
  .stat-card span{display:block; font-size:11px; letter-spacing:.05em; color:rgba(255,255,255,.68); font-weight:700; margin-top:2px;}

  .plan-hero{background:var(--navy); color:#fff; border-radius:var(--radius-lg); padding:30px 32px; margin:26px 0 -46px; position:relative; z-index:2;
    box-shadow:0 24px 46px -20px rgba(6,20,24,.5);}
  .kicker{display:inline-block; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2); font-size:12px; font-weight:700;
    padding:6px 12px; border-radius:999px; margin-bottom:14px;}
  .plan-hero h1{font-size:clamp(22px,3vw,30px); line-height:1.25; margin-bottom:10px;}
  .plan-hero p{color:rgba(255,255,255,.75); max-width:80ch; font-size:14.5px;}

  .plan-shell{background:var(--card); border:1px solid var(--line); border-radius:var(--radius-lg); box-shadow:var(--shadow);
    padding:64px 24px 24px; position:relative; z-index:1; margin-bottom:30px;}

  .meta-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:26px;}
  .meta-card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px;}
  .meta-card .lbl{font-size:11px; font-weight:800; letter-spacing:.06em; color:var(--muted); text-transform:uppercase; margin-bottom:6px;}
  .meta-card .val{font-size:14.5px; font-weight:700; color:var(--ink);}

  .plan-body{display:grid; grid-template-columns:280px 1fr; gap:22px; align-items:start; padding-bottom:70px;}
  .idx-wrap{position:sticky; top:calc(78px + env(safe-area-inset-top,0px)); background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; max-height:calc(100vh - 110px); overflow-y:auto;}
  .idx-title{font-size:11.5px; font-weight:800; letter-spacing:.07em; color:var(--muted); margin-bottom:10px; padding-inline:6px;}
  .idx-item{display:flex; align-items:flex-start; gap:10px; width:100%; text-align:left; background:transparent; border:none; cursor:pointer;
    padding:9px 8px; border-radius:10px; font-family:var(--font-body); color:var(--ink-2); font-size:13.5px; font-weight:600;}
  .idx-item:hover{background:var(--card-2);}
  .idx-item .num{flex:none; width:20px; height:20px; border-radius:50%; border:1.6px solid var(--muted); display:grid; place-items:center; font-size:10.5px; font-weight:800; color:var(--muted); margin-top:1px;}
  .idx-item[aria-current="true"]{background:var(--pill-active-bg); color:var(--pill-active-ink);}
  .idx-item[aria-current="true"] .num{border-color:var(--pill-active-ink); background:var(--pill-active-ink); color:var(--pill-active-bg);}

  .sec-card{background:var(--card-2); border-radius:18px; padding:24px 26px; margin-bottom:16px; scroll-margin-top:90px;}
  .sec-head{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:12px;}
  .sec-tag{font-size:11px; font-weight:800; letter-spacing:.06em; background:var(--pill-active-bg); border:1px solid var(--line); padding:5px 10px; border-radius:999px; color:var(--pill-active-ink);}
  .sec-card h2{font-size:19px; font-weight:700; color:var(--ink);}
  .sec-card > p{color:var(--ink-2); margin-bottom:10px;}
  .sec-card h4{font-family:var(--font-body); font-size:13.5px; font-weight:800; margin:16px 0 8px; color:var(--ink);}
  .sec-card ul{margin:0 0 10px; padding-left:20px; color:var(--ink-2);}
  .sec-card li{margin-bottom:6px;}
  .note{background:var(--amber-bg); color:var(--amber-ink); border-radius:12px; padding:12px 14px; font-size:13px; margin-top:8px;}
  .linklike{background:none; border:none; padding:0; font:inherit; font-weight:700; color:var(--navy-2); text-decoration:underline; cursor:pointer;}

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:6px;}
  .mini-card{background:var(--mint-bg); color:var(--mint-ink); border-radius:14px; padding:16px 18px; position:relative;}
  .mini-card .row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; gap:8px;}
  .mini-card .id{font-weight:800; font-size:12.5px;}
  .mini-card .date{font-size:11.5px; opacity:.75; font-weight:600;}
  .mini-card b{display:block; font-size:14px; margin-bottom:4px;}
  .mini-card p{font-size:13px; opacity:.92;}

  .doc-card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; display:flex; gap:14px; margin-bottom:10px; position:relative;}
  .doc-card .n{flex:none; width:30px; height:30px; border-radius:9px; background:var(--navy); color:#fff; display:grid; place-items:center; font-weight:800; font-size:13px;}
  .doc-card b{display:block; font-size:14px; margin-bottom:4px;}
  .doc-card span{color:var(--muted); font-size:13px;}

  .table-wrap{overflow-x:auto; border-radius:12px; border:1px solid var(--line); background:var(--card);}
  table{border-collapse:collapse; width:100%; font-size:13px; min-width:560px;}
  table th{background:var(--navy); color:#fff; text-align:left; font-size:11.5px; letter-spacing:.03em; padding:10px 12px; white-space:nowrap;}
  table td{padding:10px 12px; border-top:1px solid var(--line); color:var(--ink-2); vertical-align:top;}
  table tr:nth-child(even) td{background:var(--card-2);}
  .chip{display:inline-block; padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:700; white-space:nowrap;}
  .chip.ok{background:var(--sage-bg); color:var(--sage-ink);}
  .chip.warn{background:var(--amber-bg); color:var(--amber-ink);}
  .chip.bad{background:var(--rose-bg); color:var(--rose-ink);}
  .chip.info{background:var(--lavender-bg); color:var(--lavender-ink);}
  .row-del{width:34px; text-align:center;}
  .table-add{padding:10px; border-top:1px solid var(--line); background:var(--card-2);}

  .page-head{padding-block:34px 6px;}
  .page-head h1{font-size:clamp(24px,3.4vw,32px); margin-bottom:8px;}
  .page-head p{color:var(--ink-2); max-width:70ch;}
  .stat-row{display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin-block:22px;}
  .tile{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; text-align:center;}
  .tile b{display:block; font-size:26px; font-weight:800; font-variant-numeric:tabular-nums;}
  .tile span{font-size:11px; letter-spacing:.04em; color:var(--muted); font-weight:700;}

  .people-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; padding-block:26px 60px;}
  .person{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px;}
  .person .av{width:44px;height:44px;border-radius:50%; background:var(--navy); color:#fff; display:grid; place-items:center; font-weight:800; margin-bottom:12px;}
  .person b{display:block; font-size:14.5px; margin-bottom:2px;}
  .person .role{font-size:12.5px; color:var(--navy-2); font-weight:700; margin-bottom:8px;}
  .person p{font-size:13px; color:var(--ink-2);}

  .norm-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; padding-block:26px 60px;}
  .norm-card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px;}
  .norm-card .tag{font-size:11px; font-weight:800; letter-spacing:.05em; color:var(--navy-2); margin-bottom:8px; display:block;}
  .norm-card b{display:block; font-size:14.5px; margin-bottom:6px;}
  .norm-card p{font-size:13.3px; color:var(--ink-2);}

  .empty{background:var(--card); border:1.5px dashed var(--line); border-radius:18px; padding:48px 24px; text-align:center; margin-block:30px 70px;}
  .empty b{display:block; font-size:16px; margin-bottom:6px;}
  .empty p{color:var(--muted); font-size:13.5px; max-width:50ch; margin:0 auto;}

  .changelog{padding-block:10px 60px;}
  .changelog-item{display:flex; gap:14px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:10px;}
  .changelog-item .dot{width:9px;height:9px;border-radius:50%;background:var(--navy-2); margin-top:6px; flex:none;}
  .changelog-item time{display:block; font-size:11.5px; color:var(--muted); font-weight:700; margin-bottom:2px;}
  .changelog-item p{font-size:13.5px;}

  footer.site{padding:26px 20px 40px; text-align:center; color:var(--muted); font-size:12.5px;}

  /* ---------- EDIT MODE ---------- */
  body.editing [data-editable]{outline:1.5px dashed color-mix(in srgb, var(--navy-2) 55%, transparent); outline-offset:3px; border-radius:5px; cursor:text;}
  body.editing [data-editable]:hover{background:color-mix(in srgb, var(--pill-active-bg) 45%, transparent);}
  body.editing [data-editable]:focus{outline:2px solid var(--navy-2); background:var(--pill-active-bg); color:var(--pill-active-ink);}
  body.editing th[data-editable]{outline-color:rgba(255,255,255,.55);}
  body.editing th[data-editable]:hover{background:rgba(255,255,255,.14);}
  body.editing th[data-editable]:focus{background:rgba(255,255,255,.22); color:#fff; outline-color:#fff;}
  body.editing .kicker[data-editable], body.editing .plan-hero h1[data-editable], body.editing .plan-hero p[data-editable]{outline-color:rgba(255,255,255,.55);}
  body.editing .plan-hero [data-editable]:hover{background:rgba(255,255,255,.12);}
  body.editing .plan-hero [data-editable]:focus{background:rgba(255,255,255,.18); color:#fff; outline-color:#fff;}
  .edit-bar{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(18px + env(safe-area-inset-bottom,0px)); z-index:80;
    background:var(--navy); color:#fff; border-radius:999px; padding:10px 12px; display:flex; align-items:center; gap:10px;
    box-shadow:0 10px 30px -8px rgba(0,0,0,.4);}
  .edit-bar span{font-size:12.5px; font-weight:700; padding-left:6px;}
  .edit-bar .btn-sm{border-radius:999px;}
  .edit-fab{position:fixed; right:calc(18px + env(safe-area-inset-right,0px)); bottom:calc(18px + env(safe-area-inset-bottom,0px)); z-index:80;}

  .modal-backdrop{position:fixed; inset:0; background:rgba(10,20,24,.45); z-index:100; display:flex; align-items:center; justify-content:center; padding:20px;}
  .modal{background:var(--card); border-radius:18px; padding:24px; max-width:420px; width:100%; box-shadow:0 20px 50px -10px rgba(0,0,0,.35);}
  .modal h3{font-size:16px; margin-bottom:6px;}
  .modal p{color:var(--muted); font-size:13px; margin-bottom:14px;}
  .modal input[type=text]{width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line); font:inherit; margin-bottom:16px; background:var(--card-2); color:var(--ink);}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px;}

  .toast-wrap{position:fixed; top:calc(14px + env(safe-area-inset-top,0px)); right:14px; z-index:120; display:flex; flex-direction:column; gap:8px;}
  .toast{background:var(--navy); color:#fff; padding:11px 16px; border-radius:12px; font-size:13px; font-weight:600; box-shadow:var(--shadow); max-width:320px;}
  .toast.error{background:var(--rose-ink);}

  @media (max-width:880px){
    .hero-grid{grid-template-columns:1fr;}
    .stats-grid{grid-template-columns:1fr;}
    .stats-right{grid-template-columns:1fr 1fr;}
    .meta-grid{grid-template-columns:repeat(2,1fr);}
    .plan-body{grid-template-columns:1fr;}
    .idx-wrap{position:static; max-height:none;}

/* ================= PATH HELPERS ================= */

function getPath(obj, path){
  return path.split(".").reduce(function(o,k){ return (o==null)?o:o[k]; }, obj);
}
function setPath(obj, path, value){
  var parts = path.split(".");
  var last = parts.pop();
  var target = parts.reduce(function(o,k){ return o[k]; }, obj);
  target[last] = value;
}

/* ================= RENDER HELPERS ================= */

function el(tag, cls, html){var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e;}
function ed(path){ return "data-editable data-path='"+path+"'"; }

function renderTable(head, rows, rowsPath, headPath){
  var editing = document.body.classList.contains("editing");
  var t = "<thead><tr>"+head.map(function(h,hi){
    return "<th "+(headPath?ed(headPath+"."+hi):"")+">"+h+"</th>";
  }).join("")+(editing?"<th class='row-del'></th>":"")+"</tr></thead><tbody>";
  rows.forEach(function(r, ri){
    t += "<tr>"+r.map(function(c,ci){
      return "<td "+ed(rowsPath+"."+ri+"."+ci)+">"+c+"</td>";
    }).join("");
    if(editing) t += "<td class='row-del'><button class='btn-sm danger' data-action='del-row' data-rows-path='"+rowsPath+"' data-row='"+ri+"'>×</button></td>";
    t += "</tr>";
  });
  t += "</tbody>";
  if(editing){
    t += "<tfoot><tr><td class='table-add' colspan='"+(head.length+1)+"'><button class='btn-sm' data-action='add-row' data-rows-path='"+rowsPath+"' data-cols='"+head.length+"'>+ Añadir fila</button></td></tr></tfoot>";
  }
  return t;
}

/* ================= NAV / TABS ================= */

var PAGES = ["inicio","plan","cronograma","normativas","anexos","equipo","actas","dashboard"];

function showPage(name){
  if(PAGES.indexOf(name)===-1) name="inicio";
  PAGES.forEach(function(p){ var sec=document.getElementById("page-"+p); if(sec) sec.hidden=(p!==name); });
  document.querySelectorAll("nav.tabs button").forEach(function(b){
    if(b.getAttribute("data-page")===name) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
  });
  window.scrollTo({top:0});
  try{ if(/^[A-Za-z0-9._~-]+$/.test(name)) history.replaceState(null,"","#"+name); }catch(e){}
}

document.getElementById("tabs").addEventListener("click", function(e){
  var b = e.target.closest("button[data-page]"); if(b) showPage(b.getAttribute("data-page"));
});
document.addEventListener("click", function(e){
  var b = e.target.closest("[data-goto]"); if(b) showPage(b.getAttribute("data-goto"));
});
document.getElementById("secList") && document.body.addEventListener("click", function(e){
  var item = e.target.closest(".idx-item");
  if(item){ var t=document.getElementById(item.getAttribute("data-target")); if(t) t.scrollIntoView({behavior:"smooth", block:"start"}); return; }
});

function setActiveIdx(id){
  document.querySelectorAll(".idx-item").forEach(function(b){
    if(b.getAttribute("data-target")===id) b.setAttribute("aria-current","true"); else b.removeAttribute("aria-current");
  });
}
var observer=null;
function initScrollSpy(){
  if(observer) observer.disconnect();
  observer = new IntersectionObserver(function(entries){
    entries.forEach(function(en){ if(en.isIntersecting) setActiveIdx(en.target.id); });
  }, {rootMargin:"-96px 0px -70% 0px", threshold:0});
  STATE.sections.forEach(function(s){ var t=document.getElementById("sec-"+s.n); if(t) observer.observe(t); });
}

function harvestEdits(){
  document.querySelectorAll("[data-path]").forEach(function(node){
    setPath(STATE, node.getAttribute("data-path"), node.innerHTML.trim());
  });
}

function setEditing(on){
  editing = on;
  document.body.classList.toggle("editing", on);
  renderAll();
  document.querySelectorAll("[data-editable]").forEach(function(node){ node.setAttribute("contenteditable", on?"true":"false"); });
  document.getElementById("editBar").hidden = !on;
  document.getElementById("editFab").hidden = on || !canEdit;
}

document.getElementById("editFab").addEventListener("click", function(){ setEditing(true); });
document.getElementById("cancelEditBtn").addEventListener("click", function(){
  setEditing(false); // discards unsaved edits: rebuilds from last-saved STATE
});

document.body.addEventListener("click", function(e){
  var add = e.target.closest("[data-action='add-row']");
  if(add){
    harvestEdits();
    var arr = getPath(STATE, add.getAttribute("data-rows-path"));
    var cols = parseInt(add.getAttribute("data-cols"),10);
    var row = []; for(var i=0;i<cols;i++) row.push("—");
    arr.push(row);
    setEditing(true);
    return;
  }
  var del = e.target.closest("[data-action='del-row']");
  if(del){
    harvestEdits();
    var arr2 = getPath(STATE, del.getAttribute("data-rows-path"));
    arr2.splice(parseInt(del.getAttribute("data-row"),10), 1);
    setEditing(true);
    return;
  }
});

function toast(msg, isError){
  var wrap = document.getElementById("toastWrap");
  var t = el("div","toast"+(isError?" error":""), msg);
  wrap.appendChild(t);
  setTimeout(function(){ t.remove(); }, 4200);
}

var saveModal = document.getElementById("saveModal");
document.getElementById("saveEditBtn").addEventListener("click", function(){
  document.getElementById("saveNote").value="";
  saveModal.hidden = false;
  document.getElementById("saveNote").focus();
});
document.getElementById("modalCancel").addEventListener("click", function(){ saveModal.hidden = true; });
document.getElementById("modalConfirm").addEventListener("click", function(){
  var note = document.getElementById("saveNote").value.trim() || "Edición sin nota";
  saveModal.hidden = true;
  doSave(note);
});

var RESET_CSS = ":root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#fafafa}img{max-width:100%}[hidden]{display:none!important}";

function buildFullDocument(){
  var stateScript = document.getElementById("state-data");
  stateScript.textContent = JSON.stringify(STATE);
  var head = "<head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>"+RESET_CSS+"</style></head>";
  return "<!doctype html><html>"+head+"<body>"+document.body.innerHTML+"</body></html>";
}

async function doSave(note){
  harvestEdits();
  STATE.changelog.unshift({ts:Date.now(), note:note});
  setEditing(false);
  var html = buildFullDocument();
  var statusEl = document.getElementById("saveStatus");
  if(!artifactCap){
    toast("El modo de guardado en vivo no está disponible en esta vista. Pide a Claude que republique la página con tus cambios.", true);
    return;
  }
  statusEl.textContent = "Guardando…";
  try{
    await artifactCap.publish(html);
    statusEl.textContent = "Guardado";
    toast("Guardado ✓ — nueva versión publicada");
  }catch(err){
    var code = err && err.code;
    if(code === "conflict"){
      toast("Alguien más guardó cambios primero. Se actualizó a la versión más reciente.");
    } else if(code === "not_granted" || code === "not_writer"){
      toast("Tu vista es de solo lectura: no tienes permiso para guardar cambios aquí.", true);
    } else {
      toast("No se pudo guardar: "+(err && err.message ? err.message : String(err)), true);
    }
    statusEl.textContent = "";
  }
}

async function initCapabilities(){
  try{ userCap = window.claude && window.claude.use ? await window.claude.use("user") : null; }catch(e){ userCap = null; }
  try{ artifactCap = window.claude && window.claude.use ? await window.claude.use("artifact") : null; }catch(e){ artifactCap = null; }
  canEdit = !!(artifactCap && userCap && typeof userCap.canEdit === "function" && userCap.canEdit());
  document.getElementById("editFab").hidden = !canEdit || editing;
}

/* ================= INIT ================= */

renderAll();
var startHash = (location.hash||"").replace("#","");
showPage(startHash || "inicio");
initCapabilities();

})();
</script>
