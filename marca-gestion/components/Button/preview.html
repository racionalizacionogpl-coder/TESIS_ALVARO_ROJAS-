<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Button</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"></head>
<body>
<div id="root"></div>
<script>
  var P = window.Gestion, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h('div', { className: 'py-row' }, h(P.Button, { variant: 'primary' }, 'Guardar acuerdo'), h(P.Button, { variant: 'accent', icon: 'asesor' }, 'Informe con IA'), h(P.Button, null, 'Exportar datos'), h(P.Button, { size: 'sm' }, 'Editar')),
    h('div', { className: 'py-row', style: { background: 'var(--navy-900)' } }, h(P.Button, { variant: 'pill' }, 'Nuevo proyecto'), h(P.Button, { variant: 'pill', size: 'sm' }, 'Exportar'))));
</script>
</body>
</html>
