<title>Proyecta · Centro de Monitoreo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Marca Proyecta: barra marina superior, franja principal en bruma turquesa, títulos centrados con subrayado
   doble, banda de indicadores turquesa, tarjetas blancas con una destacada y pie marino en cuatro columnas.
   Tokens idénticos al sistema de marca (claro / oscuro). */
:root{
  --canvas:#F4F7FA; --surface:#FFFFFF; --surface-alt:#F8FAFC; --mist:#E7F6F9; --line:#DCE4ED; --line-soft:#EAF0F5;
  --ink:#0F2240; --ink-muted:#55657E; --ink-faint:#7A879C;
  --navy-900:#0B1D3A; --navy-700:#14315F; --series-2:#14315F; --on-navy:#FFFFFF; --on-navy-muted:#B8C6DB;
  --teal-500:#1BB0C4; --teal-600:#0A7E90; --teal-700:#087686; --teal-100:#D3EFF4;
  --primary:#14315F; --on-primary:#FFFFFF;
  --ok:#1A7049; --ok-soft:#E1F3EA; --warn:#96590A; --warn-soft:#FDF0D9; --crit:#B8352C; --crit-soft:#FBE5E3; --idle:#5F6D84; --idle-soft:#EBEFF4;
  --q-act:#E3E9F5; --scrim:rgba(11,29,58,.55);
  --shadow-card:0 1px 2px #0b1d3a0f,0 10px 24px -14px #0b1d3a38; --shadow-float:0 18px 40px -16px #0b1d3a52;
  --focus-ring:0 0 0 2px #ffffff,0 0 0 4px #087686;
  --font-display:Montserrat,"Arial Black",system-ui,sans-serif;
  --font-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --radius-sm:6px; --radius-md:10px; --radius-lg:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --canvas:#0A1426; --surface:#0F1C33; --surface-alt:#142441; --mist:#0E2A3B; --line:#24365A; --line-soft:#1A2B4A;
    --ink:#E8EEF7; --ink-muted:#A6B4CA; --ink-faint:#7C8CA6;
    --navy-900:#071022; --navy-700:#1E3E72; --series-2:#A9BEDF; --on-navy:#FFFFFF; --on-navy-muted:#B8C6DB;
    --teal-500:#2BBACD; --teal-600:#0B7C8D; --teal-700:#5BD0E0; --teal-100:#133B4D;
    --primary:#3CC4D6; --on-primary:#061127;
    --ok:#5BC98F; --ok-soft:#13301F; --warn:#E7B24F; --warn-soft:#352812; --crit:#F27C72; --crit-soft:#3B1C1A; --idle:#8B97AC; --idle-soft:#1C2A44;
    --q-act:#1A2B4A; --scrim:rgba(0,0,0,.62);
    --shadow-card:0 1px 2px #00000066,0 10px 24px -14px #000000b3; --shadow-float:0 18px 40px -16px #000000cc;
    --focus-ring:0 0 0 2px #0f1c33,0 0 0 4px #5bd0e0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --canvas:#0A1426; --surface:#0F1C33; --surface-alt:#142441; --mist:#0E2A3B; --line:#24365A; --line-soft:#1A2B4A;
  --ink:#E8EEF7; --ink-muted:#A6B4CA; --ink-faint:#7C8CA6;
  --navy-900:#071022; --navy-700:#1E3E72; --series-2:#A9BEDF; --on-navy:#FFFFFF; --on-navy-muted:#B8C6DB;
  --teal-500:#2BBACD; --teal-600:#0B7C8D; --teal-700:#5BD0E0; --teal-100:#133B4D;
  --primary:#3CC4D6; --on-primary:#061127;
  --ok:#5BC98F; --ok-soft:#13301F; --warn:#E7B24F; --warn-soft:#352812; --crit:#F27C72; --crit-soft:#3B1C1A; --idle:#8B97AC; --idle-soft:#1C2A44;
  --q-act:#1A2B4A; --scrim:rgba(0,0,0,.62);
  --shadow-card:0 1px 2px #00000066,0 10px 24px -14px #000000b3; --shadow-float:0 18px 40px -16px #000000cc;
  --focus-ring:0 0 0 2px #0f1c33,0 0 0 4px #5bd0e0;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--canvas);color:var(--ink);font:400 15px/1.6 var(--font-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-family:var(--font-display)}
p{margin:0}
:focus-visible{outline:none;box-shadow:var(--focus-ring);border-radius:4px}
.sr{position:absolute;left:0;top:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.mono{font-family:var(--font-mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding-inline:clamp(16px,3.2vw,36px)}
.ico{flex:none;display:inline-block;vertical-align:middle}

/* ---------- barra superior ---------- */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--navy-900);color:var(--on-navy)}
.nav .wrap{display:flex;align-items:center;gap:20px;min-height:64px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;color:var(--on-navy);cursor:pointer;text-align:left}
.logo svg{display:block}
.logo b{display:block;font:800 19px/1 var(--font-display);letter-spacing:.06em}
.logo small{display:block;font:700 8.5px/1 var(--font-display);letter-spacing:.16em;color:var(--on-navy-muted);margin-top:4px}
.menu{display:flex;align-items:center;gap:4px;margin-left:auto;margin-right:auto}
.menu>button,.menu summary{list-style:none;border:0;background:none;color:var(--on-navy);font:700 12px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;padding:24px 12px 21px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
.menu summary::-webkit-details-marker{display:none}
.menu>button:hover,.menu summary:hover{color:var(--teal-500)}
.menu [aria-current="true"],.menu details.on summary{border-bottom-color:var(--teal-500)}
.menu details{position:relative}
.dd{position:absolute;top:calc(100% - 2px);left:0;min-width:320px;max-width:min(420px,90vw);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius-md);box-shadow:var(--shadow-float);padding:8px;z-index:50}
.dd button{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;border:0;background:none;padding:9px 10px;border-radius:var(--radius-sm);text-align:left;cursor:pointer;color:var(--ink)}
.dd button:hover{background:var(--surface-alt)}
.dd .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.nav-r{display:flex;align-items:center;gap:12px}
.live{display:inline-flex;align-items:center;gap:7px;font:700 11px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--on-navy)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--teal-500);animation:pulse 2.4s infinite}
.live.off i{background:var(--on-navy-muted);animation:none} .live.err i{background:var(--crit);animation:none} .live.wait i{animation:none}
.live small{font:400 12px/1 var(--font-body);letter-spacing:0;text-transform:none;color:var(--on-navy-muted)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(27,176,196,.55)}70%{box-shadow:0 0 0 8px rgba(27,176,196,0)}100%{box-shadow:0 0 0 0 rgba(27,176,196,0)}}
@media (prefers-reduced-motion:reduce){.live i{animation:none}}
.avs{display:flex}
.avs img{width:28px;height:28px;border-radius:50%;border:2px solid var(--navy-900);margin-left:-8px;background:var(--navy-700);object-fit:cover}
.avs img:first-child{margin-left:0}

/* ---------- botones y píldoras ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;font:600 14px/1 var(--font-body);padding:11px 18px;border-radius:var(--radius-md);border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap;transition:background-color .15s ease-out,border-color .15s ease-out,color .15s ease-out}
.btn:hover{border-color:var(--teal-700);color:var(--teal-700)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{filter:brightness(1.12);color:var(--on-primary)}
.btn.accent{background:var(--teal-600);border-color:var(--teal-600);color:var(--on-navy)}
.btn.accent:hover{filter:brightness(1.1);color:var(--on-navy)}
.btn.pill{background:var(--on-navy);border-color:var(--on-navy);color:var(--navy-900);border-radius:999px;font:700 11.5px/1 var(--font-body);letter-spacing:.07em;text-transform:uppercase;padding:9px 16px}
.btn.pill:hover{background:var(--teal-500);border-color:var(--teal-500);color:var(--navy-900)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-muted)}
.btn.danger{color:var(--crit)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.round{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--teal-700);border:0;box-shadow:var(--shadow-card);cursor:pointer;flex:none}
.round-wrap{display:inline-flex;align-items:center;gap:12px;border:0;background:none;padding:0;cursor:pointer;color:var(--ink);font:600 14px/1.3 var(--font-body);text-align:left}
.round-wrap:hover .round{background:var(--teal-600);color:var(--on-navy)}
.icon-btn{border:1px solid transparent;background:none;border-radius:var(--radius-sm);padding:4px 9px;font:600 12.5px/1.2 var(--font-body);color:var(--teal-700);cursor:pointer}
.icon-btn:hover{border-color:var(--line);background:var(--surface)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font:700 12px/1.35 var(--font-body);white-space:nowrap;background:var(--idle-soft);color:var(--idle)}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.crit{background:var(--crit-soft);color:var(--crit)} .pill.data{background:var(--teal-100);color:var(--teal-700)} .pill.accent{background:var(--teal-100);color:var(--teal-700)}
.code-chip{font:500 12.5px/18px var(--font-mono);background:var(--teal-100);color:var(--teal-700);padding:2px 8px;border-radius:var(--radius-sm)}
select.inline{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-sm);padding:6px 9px;font-size:14px}

/* ---------- franja principal ---------- */
.hero{background:var(--mist);position:relative;overflow:hidden;border-bottom-left-radius:var(--radius-lg);border-bottom-right-radius:var(--radius-lg)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:40px;align-items:center;padding-block:52px 56px;position:relative}
.bubble{position:absolute;border-radius:50%;background:var(--surface);opacity:.9}
.eyebrow{font:700 11.5px/16px var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--teal-700);margin-bottom:10px}
h1.hero-t{font:800 40px/1.1 var(--font-display);letter-spacing:.01em;text-transform:uppercase;color:var(--ink)}
h1.title{font:700 32px/1.15 var(--font-display);color:var(--ink)}
.lead{font:400 17px/1.6 var(--font-body);color:var(--ink-muted);margin-top:14px;max-width:62ch}
.hero-actions{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;margin-top:26px}
.facts{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin-top:12px;font-size:14px;color:var(--ink-muted)}
.facts b{color:var(--ink);font-weight:600}
.blob{background:var(--navy-900);color:var(--on-navy);border-radius:140px 28px 140px 28px;padding:34px 34px 30px;box-shadow:var(--shadow-float);min-width:0}
.blob h2{font:700 11.5px/16px var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--teal-500);margin-bottom:16px;text-align:center}
.bl-row{display:grid;grid-template-columns:42px minmax(0,1fr) 44px;gap:10px;align-items:center;margin-top:12px;font-size:13px}
.bl-row .mono{color:var(--on-navy)}
.bl-trk{position:relative;height:10px;border-radius:5px;background:var(--navy-700)}
.bl-trk span{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--teal-500)}
.bl-trk i{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--on-navy);border-radius:1px}
.bl-val{font:700 13px/1 var(--font-display);text-align:right;font-variant-numeric:tabular-nums}
.bl-leg{display:flex;justify-content:center;gap:16px;margin-top:18px;font-size:12px;color:var(--on-navy-muted)}
.bl-leg span{display:inline-flex;align-items:center;gap:6px}
.bl-leg i{width:14px;height:6px;border-radius:3px;background:var(--teal-500)} .bl-leg i.plan{width:2px;height:12px;background:var(--on-navy)}

/* cuenta regresiva */
.cd{background:var(--navy-900);color:var(--on-navy);border-radius:var(--radius-lg);padding:26px 28px;box-shadow:var(--shadow-float);min-width:0}
.cd-eyebrow{font:700 11.5px/16px var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--teal-500)}
.cd-title{font:700 18px/1.3 var(--font-display);margin-top:6px}
.cd-sub{font-size:13px;color:var(--on-navy-muted);margin-top:4px}
.cd-row{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap}
.cd-c{width:70px;height:70px;border-radius:50%;border:2px solid var(--teal-500);display:flex;flex-direction:column;align-items:center;justify-content:center}
.cd-c b{font:700 22px/1 var(--font-display);font-variant-numeric:tabular-nums}
.cd-c span{font:600 10px/1.4 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--on-navy-muted);margin-top:3px}

/* ---------- secciones ---------- */
main{display:block}
.section{padding-block:48px 0}
.st{margin-bottom:26px}
.st.center{text-align:center}
.st h2{font:700 24px/1.25 var(--font-display);color:var(--ink)}
.st p.note{margin:8px auto 0}
.bars{display:flex;gap:6px;margin-top:10px}
.st.center .bars{justify-content:center}
.bars span{height:4px;width:28px;border-radius:2px;background:var(--teal-500)}
.bars span+span{width:8px}
.note{font-size:13.5px;color:var(--ink-muted);max-width:76ch}
.stack{display:flex;flex-direction:column;gap:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);box-shadow:var(--shadow-card);padding:22px 24px;min-width:0}
.panel-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.panel-head>div{min-width:0}
.panel-head h2{font:700 18px/1.3 var(--font-display)}
.panel-head .bars{margin-top:8px}
.panel-head .note{margin-top:8px}
.head-actions{display:flex;flex-wrap:wrap;gap:8px}
.split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px}
.split.even{grid-template-columns:repeat(2,minmax(0,1fr))}
.empty{border:1px dashed var(--line);border-radius:var(--radius-md);padding:18px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;color:var(--ink-muted);font-size:14px;background:var(--surface-alt)}
.empty p{max-width:64ch}
.domain-note{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:14px;color:var(--ink-muted);margin:4px 0 20px}
.domain-note b{font:700 11px/1 var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--teal-700)}

/* indicadores */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:16px}
.kpi{background:var(--teal-600);color:var(--on-navy);border-radius:var(--radius-md);padding:24px 14px 22px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:7px;min-width:0}
.kpi .ico{width:42px;height:42px}
.k-label{font:700 11px/16px var(--font-body);letter-spacing:.08em;text-transform:uppercase}
.k-val{font:700 34px/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.k-sub{font-size:13px;line-height:1.35}
.kband{position:relative;padding-block:6px}
.kband::before{content:"";position:absolute;left:0;right:0;top:45%;bottom:-26px;background:var(--mist);z-index:-1}

/* tarjetas de proyecto */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);box-shadow:var(--shadow-card);padding:22px;display:flex;flex-direction:column;gap:13px;min-width:0;cursor:pointer;transition:box-shadow .2s ease-out,transform .2s ease-out}
.pcard:hover{box-shadow:var(--shadow-float);transform:translateY(-2px)}
@media (prefers-reduced-motion:reduce){.pcard:hover{transform:none}}
.pcard.feat{background:var(--teal-600);border-color:var(--teal-600);color:var(--on-navy)}
.pcard.feat .code-chip{background:var(--navy-900);color:var(--on-navy)}
.pcard-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pcard h3{font:700 17px/1.3 var(--font-display);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.feat-tag{font:700 10.5px/1 var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--on-navy);opacity:.95}
.pbar{position:relative;height:8px;background:var(--line-soft);border-radius:4px}
.pbar>span{position:absolute;left:0;top:0;bottom:0;background:var(--teal-600);border-radius:4px}
.pbar>i{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--navy-700);border-radius:1px}
.pcard.feat .pbar{background:var(--navy-700)} .pcard.feat .pbar>span{background:var(--on-navy)} .pcard.feat .pbar>i{background:var(--teal-500)}
.pbar-legend{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;margin-top:6px;font-variant-numeric:tabular-nums;color:var(--ink-muted)}
.pcard.feat .pbar-legend,.pcard.feat .pfoot,.pcard.feat .mini dt{color:var(--on-navy)}
.pbar-legend b{color:inherit;font-weight:700}
.mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:0;padding-top:12px;border-top:1px solid var(--line-soft)}
.pcard.feat .mini{border-top-color:rgba(255,255,255,.28)}
.mini div{min-width:0}
.mini dt{font:700 10px/1.25 var(--font-body);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-muted);min-height:2.5em}
.mini dd{margin:0;font:700 19px/1.2 var(--font-display);font-variant-numeric:tabular-nums}
.tone-ok{color:var(--ok)} .tone-warn{color:var(--warn)} .tone-crit{color:var(--crit)} .tone-idle{color:var(--ink-muted)} .tone-data{color:var(--teal-700)}
.pcard.feat .mini dd{color:var(--on-navy)}
.pfoot{font-size:13px;color:var(--ink-muted)}
.pcard .btn{align-self:flex-start}
.stepper{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.step{border:0;background:none;padding:0;text-align:left;min-width:0;color:inherit}
.step i{display:block;height:5px;border-radius:3px;background:var(--line)}
.step.past i{background:var(--teal-500)} .step.now i{background:var(--navy-700)}
.pcard.feat .step i{background:rgba(255,255,255,.3)} .pcard.feat .step.past i{background:var(--teal-500)} .pcard.feat .step.now i{background:var(--on-navy)}
.step span{display:block;font-size:10.5px;color:var(--ink-muted);margin-top:4px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step.now span{color:var(--ink);font-weight:700}
.pcard.feat .step span{color:var(--on-navy)}

/* etapas numeradas */
.phases{display:flex;align-items:flex-start;justify-content:space-between;gap:0;position:relative;padding:4px 0}
.ph{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;border:0;background:none;padding:0;color:var(--ink);min-width:0}
.ph::before{content:"";position:absolute;top:19px;left:-50%;right:50%;height:3px;background:var(--line)}
.ph:first-child::before{display:none}
.ph.past::before,.ph.now::before{background:var(--teal-500)}
.ph .dot{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:700 15px/1 var(--font-display);background:var(--surface);border:2px solid var(--line);color:var(--ink-muted);position:relative;z-index:1}
.ph.past .dot{background:var(--teal-500);border-color:var(--teal-500);color:var(--navy-900)}
.ph.now .dot{background:var(--navy-700);border-color:var(--navy-700);color:var(--on-navy);box-shadow:0 0 0 5px var(--teal-100)}

function alertList(alerts, withProject) {

function feedList(pid) {

function matrixSVG(all) {
  const pts = all.filter(x => x.pr);
  if (!pts.length) return `<div class="empty"><p>Completa los 8 criterios de priorización en el acta de cada proyecto para ubicarlo en la matriz.</p></div>`;
  const W = 380, H = 300, L = 46, R = 366, Tp = 14, B = 252;
  const X = e => L + (e - 1) / 4 * (R - L), Y = i => B - (i - 1) / 4 * (B - Tp);
  let g = `<rect x="${L}" y="${Tp}" width="${X(3) - L}" height="${Y(3) - Tp}" class="m-q-prior"/><rect x="${X(3)}" y="${Tp}" width="${R - X(3)}" height="${Y(3) - Tp}" class="m-q-act"/><rect x="${L}" y="${Y(3)}" width="${X(3) - L}" height="${B - Y(3)}" class="m-q-np"/><rect x="${X(3)}" y="${Y(3)}" width="${R - X(3)}" height="${B - Y(3)}" class="m-q-na"/>`;
  g += `<text x="${L + 6}" y="${Tp + 14}" class="m-qlbl">PRIORIZAR ACCIONES</text><text x="${X(3) + 6}" y="${Tp + 14}" class="m-qlbl">ACCIONES A REALIZAR</text><text x="${L + 6}" y="${B - 7}" class="m-qlbl">ÁREA NO PRIORITARIA</text><text x="${X(3) + 6}" y="${B - 7}" class="m-qlbl">NO ATENDER</text>`;
  for (let v = 1; v <= 5; v++) { g += `<text x="${X(v)}" y="${B + 16}" text-anchor="middle" class="c-tick">${v}</text><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end" class="c-tick">${v}</text>`; }
  g += `<text x="${(L + R) / 2}" y="${H - 6}" text-anchor="middle" class="c-tick">Esfuerzo →</text><text transform="translate(13 ${(Tp + B) / 2}) rotate(-90)" text-anchor="middle" class="c-tick">Impacto →</text>`;
  const seen = {};
  pts.forEach(({ p, pr }) => {
    const key = pr.i.toFixed(2) + '|' + pr.e.toFixed(2); const k = seen[key] = (seen[key] || 0) + 1;
    const x = X(pr.e) + (k - 1) * 10, y = Y(pr.i) - (k - 1) * 10;
    g += `<g class="g-row" data-act="go-project" data-id="${esc(p.id)}"><title>${esc(p.code)} · ${esc(p.name)} — impacto ${pr.i.toFixed(2)}, esfuerzo ${pr.e.toFixed(2)}: ${esc(pr.quad.label)}</title><circle cx="${x}" cy="${y}" r="7" class="m-dot"/><text x="${x + 11}" y="${y + 4}" class="m-lbl">${esc(p.code)}</text></g>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Matriz impacto esfuerzo de la cartera">${g}</svg>`;
}

function tabResumen(p, m) {

    ${kpi('Actividades', `${m.done}/${m.leaves.length}`, `${plural(m.late.length, 'vencida', 'vencidas')} · ${plural(m.behind.length, 'retrasada', 'retrasadas')}`, 'acuerdo', m.late.length ? pill('crit', 'Con vencidas') : pill('ok', 'Al día'))}

function sCurve(p, m) {
  const td = today();
  const L = m.leaves.map(t => ({ s: parseD(t.start), e: parseD(t.end) || parseD(t.start), w: m.costMode ? num(t.plannedCost) : null })).filter(x => x.s);
  if (!L.length) return `<div class="empty"><p>Agrega actividades con fechas en la pestaña Cronograma para dibujar la curva S.</p></div>`;
  L.forEach(x => { if (x.w == null) x.w = Math.max(1, dBetween(x.s, x.e) + 1); });
  const W = L.reduce((s, x) => s + x.w, 0) || 1;
  let min = L.reduce((a, x) => x.s < a ? x.s : a, L[0].s), max = L.reduce((a, x) => x.e > a ? x.e : a, L[0].e);
  if (+max === +min) max = new Date(min.getTime() + DAY);
  const at = d => L.reduce((s, x) => s + x.w * plannedFrac(x.s, x.e, d), 0) / W * 100;
  const VW = 560, VH = 230, Lx = 44, Rx = 546, Ty = 14, By = 192;
  const X = d => Lx + (d - min) / (max - min) * (Rx - Lx), Y = v => By - v / 100 * (By - Ty);
  const N = 48; let path = '', area = '';
  for (let i = 0; i <= N; i++) { const d = new Date(min.getTime() + (max - min) * i / N); const x = X(d).toFixed(1), y = Y(at(d)).toFixed(1); path += (i ? 'L' : 'M') + x + ' ' + y; area += (i ? 'L' : `M${x} ${By}L`) + x + ' ' + y; }
  area += `L${Rx} ${By}Z`;
  let g = `<path d="${area}" class="c-area" opacity=".8"/>`;
  [0, 25, 50, 75, 100].forEach(v => { g += `<line x1="${Lx}" x2="${Rx}" y1="${Y(v)}" y2="${Y(v)}" class="c-grid"/><text x="${Lx - 8}" y="${Y(v) + 4}" text-anchor="end" class="c-tick">${v}%</text>`; });
  const ticks = 5; for (let i = 0; i <= ticks; i++) { const d = new Date(min.getTime() + (max - min) * i / ticks); g += `<text x="${X(d)}" y="${By + 17}" text-anchor="${i === 0 ? 'start' : i === ticks ? 'end' : 'middle'}" class="c-tick">${MES[d.getMonth()]} ${String(d.getFullYear()).slice(2)}</text>`; }
  g += `<path d="${path}" class="c-plan"/>`;
  if (td >= min && td <= max) {
    const x = X(td), yp = Y(m.planPct || 0), yr = Y(m.realPct || 0);
    g += `<line x1="${x}" x2="${x}" y1="${Ty}" y2="${By}" class="c-today"/>`;
    g += `<circle cx="${x}" cy="${yp}" r="5" class="c-planpt"/><circle cx="${x}" cy="${yr}" r="6" class="c-real"/>`;
    const right = x > (Lx + Rx) / 2;
    const ax = right ? x - 10 : x + 10, anchor = right ? 'end' : 'start';
    const sep = Math.abs(yp - yr) < 16 ? 9 : 0;
    g += `<text x="${ax}" y="${yp - 6 - sep}" text-anchor="${anchor}" class="c-lbl dat">Plan ${pct(m.planPct)}</text><text x="${ax}" y="${yr + 16 + sep}" text-anchor="${anchor}" class="c-lbl acc">Real ${pct(m.realPct)}</text>`;
  }
  return `<svg class="chart" viewBox="0 0 ${VW} ${VH}" role="img" aria-label="Curva S: plan ${pct(m.planPct)}, real ${pct(m.realPct)} a la fecha de corte">${g}</svg><div class="legend"><span><i></i>Línea base (avance planificado acumulado)</span><span><i class="pt"></i>Planificado a hoy</span><span><i class="acc"></i>Avance real a hoy</span></div>`;
}

function tabGobernanza(p, m) {

function gantt(p, m) {
  const td = today();
  const rows = m.T.filter(t => wbsDepth(t.wbs) <= UI.depth);
  let min = null, max = null;
  for (const t of m.T) {
    const s = t.type === 'Entregable' ? (m.sum.get(t.id) || {}).start : parseD(t.start);
    const e = t.type === 'Entregable' ? (m.sum.get(t.id) || {}).end : (parseD(t.end) || parseD(t.start));
    if (s && (!min || s < min)) min = s; if (e && (!max || e > max)) max = e;
  }
  if (!min || !rows.length) return `<div class="empty"><p>Agrega fechas de inicio y fin a las actividades para dibujar el diagrama.</p></div>`;
  min = new Date(min.getFullYear(), min.getMonth(), 1); max = new Date(max.getFullYear(), max.getMonth() + 1, 0);
  const narrow = window.innerWidth < 640;
  const days = dBetween(min, max) + 1, LW = narrow ? 168 : 310, RH = 28, HH = 44;
  const avail = Math.max(260, Math.min(window.innerWidth, 1240) - 120 - LW);
  const pxd = clamp(avail / days, 1.1, 16);
  const BW = Math.ceil(days * pxd + 46), H = HH + rows.length * RH + 6;
  const X = d => 4 + dBetween(min, d) * pxd;
  const ed = canEdit();
  const rowAttr = t => ed ? ` data-act="edit" data-coll="tasks" data-id="${esc(t.id)}"` : '';
  let left = '', right = '';
  rows.forEach((t, i) => { if (i % 2) { left += `<rect x="0" y="${HH + i * RH}" width="${LW}" height="${RH}" class="g-zebra"/>`; right += `<rect x="0" y="${HH + i * RH}" width="${BW}" height="${RH}" class="g-zebra"/>`; } });
  for (let d = new Date(min); d <= max; d = new Date(d.getFullYear(), d.getMonth() + 1, 1)) {
    const x = X(d), nxt = new Date(d.getFullYear(), d.getMonth() + 1, 1), w = dBetween(d, nxt) * pxd;
    right += `<line x1="${x}" y1="${HH - 18}" x2="${x}" y2="${H}" class="g-grid"/>`;
    if (w >= 22) right += `<text x="${x + 4}" y="${HH - 9}" class="g-month">${MES[d.getMonth()]}</text>`;
    if (d.getMonth() === 0 || +d === +min) right += `<text x="${x + 4}" y="${HH - 25}" class="g-year">${d.getFullYear()}</text>`;
  }
  left += `<line x1="0" y1="${HH}" x2="${LW}" y2="${HH}" class="g-sep"/><text x="10" y="${HH - 9}" class="g-month">ELEMENTO DE LA EDT</text>`;
  right += `<line x1="0" y1="${HH}" x2="${BW}" y2="${HH}" class="g-sep"/>`;
  rows.forEach((t, i) => {
    const y = HH + i * RH, d = wbsDepth(t.wbs), indent = 10 + (d - 1) * (narrow ? 8 : 12);
    const codeW = String(t.wbs).length * 7 + 8;
    const maxChars = Math.max(5, Math.floor((LW - indent - codeW - 8) / 6.6));
    const label = String(t.name || '').length > maxChars ? String(t.name).slice(0, maxChars - 1) + '…' : String(t.name || '');
    const tip = `<title>${esc(t.wbs)} ${esc(t.name)}${t.owner ? ' · ' + esc(t.owner) : ''}</title>`;
    left += `<g class="g-row"${rowAttr(t)}>${tip}<rect x="0" y="${y}" width="${LW}" height="${RH}" class="g-hit"/><text x="${indent}" y="${y + 18}" class="g-code">${esc(t.wbs)}</text><text x="${indent + codeW}" y="${y + 18}" class="g-label${t.type === 'Entregable' ? ' sum' : ''}">${esc(label)}</text></g>`;
    let bar = '';
    if (t.type === 'Entregable') {
      const s = m.sum.get(t.id) || {};
      if (s.start && s.end) { const x1 = X(s.start), x2 = X(s.end) + pxd; bar = `<rect x="${x1}" y="${y + 11}" width="${Math.max(3, x2 - x1)}" height="6" rx="3" class="g-sum"/><text x="${x2 + 6}" y="${y + 18}" class="g-pct">${pct(s.progress)}</text>`; }
    } else {
      const s = parseD(t.start), e = parseD(t.end) || s, st = taskState(t, td);
      if (s) {
        if (t.type === 'Hito') { const cx = X(e || s) + pxd / 2, cy = y + RH / 2; bar = `<path d="M${cx} ${cy - 8}L${cx + 8} ${cy}L${cx} ${cy + 8}L${cx - 8} ${cy}Z" class="g-ms${st.k === 'done' ? ' done' : ''}"/>`; }
        else { const x1 = X(s), w = Math.max(3, (dBetween(s, e) + 1) * pxd), pw = w * clamp(num(t.progress), 0, 100) / 100; bar = `<rect x="${x1}" y="${y + 7}" width="${w}" height="14" rx="4" class="g-plan"/>${pw > 0 ? `<rect x="${x1}" y="${y + 7}" width="${pw}" height="14" rx="4" class="g-prog ${st.k}"/>` : ''}<text x="${x1 + w + 6}" y="${y + 18}" class="g-pct">${pct(num(t.progress))}</text>`; }
      }
    }
    right += `<g class="g-row"${rowAttr(t)}>${tip}<rect x="0" y="${y}" width="${BW}" height="${RH}" class="g-hit"/>${bar}</g>`;
  });
  let todayX = '';
  if (td >= min && td <= max) { const x = X(td) + pxd / 2; todayX = x.toFixed(0); right += `<line x1="${x}" y1="${HH - 4}" x2="${x}" y2="${H}" class="g-today"/><text x="${x + 4}" y="${HH - 30}" class="g-today-l">HOY</text>`; }
  return `<div class="gantt-wrap"><svg class="g-left" width="${LW}" height="${H}" viewBox="0 0 ${LW} ${H}" aria-hidden="true">${left}</svg><div class="g-scroll" data-today-x="${todayX}"><svg width="${BW}" height="${H}" viewBox="0 0 ${BW} ${H}" role="img" aria-label="Diagrama de Gantt de ${esc(p.code)}">${right}</svg></div></div>`;
}

function tabFinanzas(p, m) {
  const cv = m.EV - m.AC, sv = m.EV - m.PV, etc = m.EAC != null ? m.EAC - m.AC : null;
  const intro = m.costMode ? '' : `<div class="empty"><p>Aún no hay costos planificados en las actividades. Registra el <b>costo planificado</b> y el <b>costo real</b> de cada actividad (pestaña Cronograma → Editar) para activar el análisis de valor ganado. Mientras tanto, el SPI se calcula ponderando por duración.</p></div>`;
  const k = `<section class="kpis">
    ${kpi('Presupuesto BAC', money(m.budget), num(p.budget) ? 'Aprobado en el acta' : 'Suma de costos planificados', 'portafolio')}
    ${kpi('Valor planificado PV', money(m.PV), 'Lo que debió ejecutarse a hoy', 'cronograma')}
    ${kpi('Valor ganado EV', money(m.EV), 'Lo logrado, valorizado', 'curva')}
    ${kpi('Costo real AC', money(m.AC), 'Lo efectivamente gastado', 'acuerdo')}
    ${kpi('Estimación EAC', m.EAC != null ? money(m.EAC) : '—', m.VAC != null ? `VAC ${money(m.VAC)}` : 'BAC ÷ CPI', 'riesgo', m.VAC != null ? pill(m.VAC >= 0 ? 'ok' : 'crit', m.VAC >= 0 ? 'Dentro del presupuesto' : 'Sobrecosto') : '')}
  </section>`;
  const gl = `<dl class="gl"><dt>CV = EV − AC</dt><dd>${m.costMode ? `<b class="num ${cv >= 0 ? 'tone-ok' : 'tone-crit'}">${money(cv)}</b> · ${cv >= 0 ? 'dentro del presupuesto' : 'sobrecosto'}` : '—'}</dd><dt>SV = EV − PV</dt><dd>${m.costMode ? `<b class="num ${sv >= 0 ? 'tone-ok' : 'tone-crit'}">${money(sv)}</b> · ${sv >= 0 ? 'adelantado' : 'atrasado'} en valor` : '—'}</dd><dt>CPI = EV / AC</dt><dd><b class="num tone-${idxTone(m.CPI)}">${ix(m.CPI)}</b> · cada S/ 1 gastado produce S/ ${ix(m.CPI)} de valor</dd><dt>SPI = EV / PV</dt><dd><b class="num tone-${idxTone(m.SPI)}">${ix(m.SPI)}</b> · ritmo de avance frente al plan</dd><dt>ETC = EAC − AC</dt><dd>${etc != null ? money(etc) : '—'} · lo que falta gastar</dd><dt>TCPI</dt><dd>${ix(m.TCPI)} · eficiencia necesaria para terminar dentro del BAC</dd></dl>`;
  const groups = m.T.filter(t => t.type === 'Entregable' && wbsDepth(t.wbs) === 1);
  const td = today();
  const gRows = groups.map(g => {
    const kids = m.leaves.filter(l => isChildOf(l.wbs, g.wbs));
    let bac = 0, pv = 0, ev = 0, ac = 0;
    kids.forEach(t => { const s = parseD(t.start), e = parseD(t.end) || s; bac += num(t.plannedCost); pv += num(t.plannedCost) * plannedFrac(s, e, td); ev += num(t.plannedCost) * clamp(num(t.progress), 0, 100) / 100; ac += num(t.actualCost); });
    return { g, bac, pv, ev, ac };
  });
  const tbl = m.costMode && gRows.length ? `<div class="tbl"><table><thead><tr><th>Entregable</th><th class="r">BAC</th><th class="r">PV</th><th class="r">EV</th><th class="r">AC</th><th class="r">CPI</th><th class="r">SPI</th></tr></thead><tbody>${gRows.map(r => `<tr><td><span class="mono">${esc(r.g.wbs)}</span> ${esc(r.g.name)}</td><td class="r">${money(r.bac)}</td><td class="r">${money(r.pv)}</td><td class="r">${money(r.ev)}</td><td class="r">${money(r.ac)}</td><td class="r tone-${idxTone(r.ac ? r.ev / r.ac : null)}">${ix(r.ac ? r.ev / r.ac : null)}</td><td class="r tone-${idxTone(r.pv ? r.ev / r.pv : null)}">${ix(r.pv ? r.ev / r.pv : null)}</td></tr>`).join('')}</tbody></table></div>` : '';
  const maxV = Math.max(m.budget, m.PV, m.EV, m.AC, 1);
  const bars = m.costMode ? `<div class="hbars">${[['Presupuesto (BAC)', m.budget, ''], ['Planificado a hoy (PV)', m.PV, ''], ['Valor ganado (EV)', m.EV, 'ok'], ['Costo real (AC)', m.AC, 'acc']].map(([l, v, c]) => `<div class="hbar"><span class="lab">${l}</span><div class="trk"><span class="${c}" style="width:${(v / maxV * 100).toFixed(1)}%"></span></div><span class="num">${money(v)}</span></div>`).join('')}</div>` : '';
  return intro + k + `<div class="split">${panel('Indicadores de valor ganado', 'Fórmulas de la gestión del valor ganado (EVM) aplicadas a la fecha de corte.', gl)}${panel('Comparación de montos', '', bars || '<p class="note">Se mostrará al registrar costos.</p>')}</div>` + (tbl ? panel('Valor ganado por entregable', '', tbl) : '');
}

function tabInteresados(p) {
  const SH = of('stakeholders', p.id).slice().sort((a, b) => (num(b.power) * num(b.interest)) - (num(a.power) * num(a.interest)));
  const q = (pw, it) => SH.filter(s => (num(s.power) >= 3) === pw && (num(s.interest) >= 3) === it);
  const box = (cls, title, list) => `<div class="qbox ${cls}"><h4>${title}</h4><div class="chips">${list.length ? list.map(s => `<span class="chip" title="${esc(s.role || '')}">${esc(s.name)}</span>`).join('') : '<span class="note">—</span>'}</div></div>`;
  const grid = `<div class="quad">${box('q4', 'Mantener satisfecho', q(true, false))}${box('q2', 'Gestionar de cerca', q(true, true))}${box('q3', 'Monitorear', q(false, false))}${box('q1', 'Mantener informado', q(false, true))}</div><div class="quad-axes"><span>↑ Más poder</span><span>Más interés →</span></div>`;
  const lvl = n => OPT.engagement.indexOf(n);

      { h: 'Código', v: r => `<span class="mono">${T_(r.code)}</span><span class="sub">${esc(r.kind || '')}</span>`, cls: 'nowrap' },
      { h: 'Riesgo', v: r => `${esc(r.title)}${r.trigger ? `<span class="sub">Señal: ${esc(r.trigger)}</span>` : ''}`, cls: 'wrap' },

let aiCtl = null;
function aiPanel(scope) {

}
function mdLite(t) {
  const lines = String(t).split('\n'); let html = '', inList = false;
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  for (const raw of lines) {
    const l = raw.trim();
    if (/^[-*•] /.test(l)) { if (!inList) { html += '<ul>'; inList = true; } html += `<li>${inline(l.replace(/^[-*•] /, ''))}</li>`; continue; }
    if (inList) { html += '</ul>'; inList = false; }
    if (/^#{1,4} /.test(l)) html += `<h4>${inline(l.replace(/^#{1,4} /, ''))}</h4>`;
    else if (l) html += `<p>${inline(l)}</p>`;
  }
  if (inList) html += '</ul>';
  return html;
}
function projectPayload(p) {
  const m = metrics(p), td = today();
  const pick = (o, ks) => Object.fromEntries(ks.filter(k => o[k] !== undefined && o[k] !== '').map(k => [k, o[k]]));
  return {
    proyecto: pick(p, ['code', 'name', 'unit', 'sponsor', 'manager', 'phase', 'approach', 'start', 'end', 'budget', 'purpose', 'objective', 'success', 'scopeIn', 'scopeOut', 'assumptions', 'constraints']),
    salud: { semaforo: m.health.label, motivos: m.why },

    actividadesVencidas: m.late.slice(0, 12).map(({ t, st }) => ({ edt: t.wbs, nombre: t.name, responsable: t.owner, fin: t.end, avance: num(t.progress), diasVencida: st.days })),
    actividadesRetrasadas: m.behind.slice(0, 8).map(({ t }) => ({ edt: t.wbs, nombre: t.name, avance: num(t.progress), fin: t.end })),
    riesgosAbiertos: m.openR.slice(0, 15).map(r => pick(r, ['code', 'kind', 'title', 'probability', 'impact', 'strategy', 'response', 'owner', 'status'])),
    incidentesAbiertos: m.openI.slice(0, 8).map(i => pick(i, ['code', 'title', 'priority', 'owner', 'due'])),
    cambiosPendientes: m.pendC.map(c => pick(c, ['code', 'title', 'area', 'status', 'date'])),
    acuerdosPendientes: m.pendA.slice(0, 15).map(a => Object.assign(pick(a, ['text', 'owner', 'due']), { vencido: !!(parseD(a.due) && parseD(a.due) < td) })),
    interesados: of('stakeholders', p.id).slice(0, 12).map(s => pick(s, ['name', 'role', 'power', 'interest', 'current', 'desired'])),
    bitacoraReciente: of('logbook', p.id).slice().sort((a, b) => String(b.date).localeCompare(String(a.date))).slice(0, 10).map(l => pick(l, ['date', 'person', 'hours', 'activity', 'blockers'])),
  };
}
async function runAI(scope) {
  if (!sample) return;
  if (aiCtl) aiCtl.abort();
  const ctl = new AbortController(); aiCtl = ctl;
  const td = isoD(today());
  let prompt;
  if (scope === 'portfolio') {
    const data = projectsSorted().map(p => { const m = metrics(p), pr = prio(p); return { codigo: p.code, nombre: p.name, fase: p.phase, fin: p.end, semaforo: m.health.label, motivos: m.why, avancePlanPct: m.planPct && Math.round(m.planPct), avanceRealPct: m.realPct && Math.round(m.realPct), SPI: m.SPI && +m.SPI.toFixed(2), CPI: m.CPI && +m.CPI.toFixed(2), riesgosAltos: m.highR.map(r => r.title), acuerdosVencidos: m.lateA.length, actividadesVencidas: m.late.length, priorizacion: pr ? { impacto: +pr.i.toFixed(2), esfuerzo: +pr.e.toFixed(2), cuadrante: pr.quad.label } : null }; });
    prompt = `Eres director de una oficina de gestión de proyectos (PMO) y dominas la Guía del PMBOK 8.ª edición (6 principios; 7 dominios de desempeño: Gobernanza, Alcance, Cronograma, Finanzas, Interesados, Recursos y Riesgo; 5 áreas de enfoque: Inicio, Planificación, Ejecución, Monitoreo y control, Cierre).
Redacta en español un informe ejecutivo de la cartera de proyectos de la Oficina General de Planificación de la UNMSM con fecha de corte ${td}. Secciones: "## Estado de la cartera" (2-3 frases), "## Proyecto por proyecto" (una viñeta por proyecto con semáforo e interpretación de SPI/CPI), "## Decisiones que necesita la dirección" (máximo 4, concretas), "## Prioridad recomendada" (orden de atención justificado con la matriz impacto-esfuerzo y el estado actual).
Usa solo los datos dados; si falta información, dilo. Formato: títulos con "## ", viñetas con "- ", negritas con **. Máximo 380 palabras.
DATOS: ${JSON.stringify(data)}`;
  } else {
    const p = projectById(scope); if (!p) return;
    prompt = `Eres director de proyectos certificado PMP y dominas la Guía del PMBOK 8.ª edición (6 principios; 7 dominios de desempeño: Gobernanza, Alcance, Cronograma, Finanzas, Interesados, Recursos y Riesgo; 5 áreas de enfoque).
Redacta en español el informe de estado del proyecto con fecha de corte ${td}. Secciones: "## Estado general" (semáforo y por qué, 2-3 frases), "## Cronograma y costos" (interpreta SPI, CPI y avance real vs planificado; nombra las actividades vencidas más importantes), "## Riesgos, incidentes y cambios", "## Interesados", "## Recomendaciones por dominio" (máximo 6 viñetas, cada una empieza con el dominio en negrita), "## Próximos pasos (2 semanas)" (acciones concretas con responsable si se conoce).
Usa solo los datos dados; si falta información, dilo con claridad y sugiere registrarla. Formato: títulos con "## ", viñetas con "- ", negritas con **. Máximo 450 palabras.
DATOS: ${JSON.stringify(projectPayload(p))}`;
  }
  UI.ai[scope] = { text: '', busy: true }; schedule();
  try {
    const res = await sample(prompt, { signal: ctl.signal, cache: false, onText: ({ text }) => { if (UI.ai[scope]) { UI.ai[scope].text = text; schedule(); } } });
    if (UI.ai[scope]) { UI.ai[scope].text = (res && res.text) || UI.ai[scope].text; UI.ai[scope].busy = false; }
  } catch (e) {
    const code = e && e.code;
    if (UI.ai[scope]) { UI.ai[scope].busy = false; if (e && e.text) UI.ai[scope].text = e.text; }
    if (code === 'not_granted') { sample = null; delete UI.ai[scope]; toast('El asesor con IA no está disponible para tu cuenta en esta página.', 'warn'); }
    else if (code === 'rate_limited') { if (UI.ai[scope]) UI.ai[scope].error = 'Se alcanzó el límite de consultas. Inténtalo de nuevo en unos minutos.'; }
    else if (code !== 'cancelled' && UI.ai[scope]) UI.ai[scope].error = 'No se pudo completar el informe. Inténtalo de nuevo.';
  }
  if (aiCtl === ctl) aiCtl = null;
  schedule();
}

    let ctl;
    if (f.t === 'textarea') ctl = `<textarea id="${fid}" name="${f.k}" rows="3">${esc(v)}</textarea>`;
    else if (f.t === 'select') ctl = `<select id="${fid}" name="${f.k}">${f.req ? '' : '<option value="">—</option>'}${f.o.map(o => `<option value="${esc(o)}"${String(o) === String(v) ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
    else ctl = `<input id="${fid}" name="${f.k}" type="${f.t === 'number' ? 'number' : f.t === 'date' ? 'date' : 'text'}" value="${esc(v)}"${f.min != null ? ` min="${f.min}"` : ''}${f.max != null ? ` max="${f.max}"` : ''}${f.t === 'number' ? ' step="any" inputmode="decimal"' : ''}${f.ph ? ` placeholder="${esc(f.ph)}"` : ''}${f.dl ? ' list="dl-team" autocomplete="off"' : ''}>`;
    html += `<label class="f${f.wide ? ' wide' : ''}" for="${fid}"><span>${esc(f.l)}${f.req ? ' <b class="req" aria-hidden="true">*</b>' : ''}</span>${ctl}${f.hint ? `<small>${esc(f.hint)}</small>` : ''}</label>`;
  }
  html += `</div><datalist id="dl-team">${teamNames(pid).map(n => `<option value="${esc(n)}"></option>`).join('')}</datalist></div><p class="form-err" id="form-err" hidden></p><footer class="dlg-foot">${id ? `<div class="del-zone" id="del-zone"><button type="button" class="btn ghost danger" data-act="ask-delete">Eliminar</button></div>` : ''}<div class="foot-r"><button type="button" class="btn" data-act="close-modal">Cancelar</button><button type="submit" class="btn primary">Guardar</button></div></footer></form></div></div>`;
  const mdl = $('#modal'); mdl.innerHTML = html; mdl.hidden = false;
  setTimeout(() => { const first = mdl.querySelector('input:not([type=hidden]),select,textarea'); if (first) first.focus(); }, 30);
}
function closeModal() { const mdl = $('#modal'); mdl.hidden = true; mdl.innerHTML = ''; }
function formErr(msg) { const e = $('#form-err'); if (e) { e.textContent = msg; e.hidden = false; } }
async function submitForm(form) {
  const coll = form.dataset.coll, id = form.dataset.id || null, isP = coll === 'projects';
  const fields = isP ? PROJECT_FIELDS : COLL[coll].fields;
  const data = {}, missing = [];
  for (const f of fields) {
    const el = form.elements[f.k]; if (!el) continue;
    let v = String(el.value).trim();
    if (f.t === 'number') { v = v === '' ? 0 : Number(v); if (!Number.isFinite(v)) v = 0; if (f.min != null) v = Math.max(f.min, v); if (f.max != null) v = Math.min(f.max, v); }
    else if (f.num) v = v === '' ? null : Number(v);
    if (f.req && (v === '' || v == null)) missing.push(f.l);
    data[f.k] = v;
  }
  if (missing.length) { formErr('Completa los campos obligatorios: ' + missing.join(', ') + '.'); return; }
  if (data.start && data.end && data.end < data.start) { formErr('La fecha de fin no puede ser anterior a la de inicio.'); return; }
  if (coll === 'tasks' && !/^\d+(\.\d+)*$/.test(data.wbs)) { formErr('El código EDT debe tener el formato 1, 1.2 o 1.2.3 (solo números separados por puntos).'); return; }
  if (isP && S.projects.some(p => p.id !== id && String(p.code).toLowerCase() === String(data.code).toLowerCase())) { formErr(`Ya existe un proyecto con el código ${data.code}.`); return; }
  if (!isP) data.pid = UI.pid;
  const btn = form.querySelector('[type=submit]'); btn.disabled = true;
  try {
    let newId = id;
    if (id) await updateRec(coll, id, data);
    else { const ref = await createRec(coll, data); newId = ref && ref.id; }
    closeModal();
    toast(id ? 'Cambios guardados' : 'Registro creado', 'ok');
    const label = data.name || data.title || data.text || data.description || data.activity || data.situation || data.code || '';
    if (isP && !id && newId) { UI.view = 'project'; UI.pid = newId; UI.tab = 'resumen'; persistUI(); }
    logFeed(isP ? newId : UI.pid, `${id ? 'actualizó' : 'registró'} ${isP ? (id ? 'el acta del proyecto' : 'el proyecto') : COLL[coll].one} «${String(label).slice(0, 90)}»`);
    schedule();
  } catch (e) { btn.disabled = false; writeErr(e); }
}
async function deleteFromForm(form) {
  const coll = form.dataset.coll, id = form.dataset.id;
  const rec = S[coll].find(r => r.id === id) || {};
  const zone = $('#del-zone'); if (zone) zone.innerHTML = '<span>Eliminando…</span>';
  try {
    await db.doc(`${coll}/${id}`).delete();
    if (coll === 'projects') {
      for (const c of Object.keys(COLL)) for (const r of of(c, id)) await db.doc(`${c}/${r.id}`).delete();
      UI.view = 'portfolio'; UI.pid = null; persistUI();
    }
    closeModal(); toast('Registro eliminado', 'ok');
    logFeed(coll === 'projects' ? null : UI.pid, `eliminó ${coll === 'projects' ? 'el proyecto' : COLL[coll].one} «${String(rec.name || rec.title || rec.text || rec.description || rec.activity || rec.code || '').slice(0, 90)}»`);
    schedule();
  } catch (e) { writeErr(e); if (zone) zone.innerHTML = '<button type="button" class="btn ghost danger" data-act="ask-delete">Eliminar</button>'; }
}

/* =========================================================
   Eventos
   ========================================================= */
function go(view, pid, tab) {
  UI.view = view; if (pid !== undefined) UI.pid = pid; if (tab) UI.tab = tab; UI.scrollGantt = true;
  persistUI(); render(); window.scrollTo(0, 0);
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  const openDd = document.querySelector('.menu details[open]');
  if (openDd && (!el || !openDd.contains(el)) && !e.target.closest('.menu details')) openDd.open = false;
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'overlay') { if (e.target === el) closeModal(); return; }
  switch (act) {
    case 'go-portfolio': go('portfolio'); break;
    case 'go-guide': go('guide'); break;
    case 'go-project': go('project', el.dataset.id, el.dataset.tab || (UI.pid === el.dataset.id ? UI.tab : 'resumen')); break;
    case 'tab': UI.tab = el.dataset.tab; UI.scrollGantt = true; persistUI(); render(); break;
    case 'new-project': openForm('projects', null); break;
    case 'edit-project': openForm('projects', el.dataset.id); break;
    case 'add': openForm(el.dataset.coll, null); break;
    case 'edit': if (canEdit()) openForm(el.dataset.coll, el.dataset.id); break;
    case 'close-modal': closeModal(); break;
    case 'top': window.scrollTo(0, 0); break;
    case 'ask-delete': { const z = $('#del-zone'); if (z) z.innerHTML = `<span>¿Eliminar definitivamente?${$('#rec-form').dataset.coll === 'projects' ? ' Se borrarán también todos sus registros.' : ''}</span><button type="button" class="btn sm danger" data-act="confirm-delete">Sí, eliminar</button><button type="button" class="btn sm" data-act="cancel-delete">No</button>`; break; }
    case 'cancel-delete': { const z = $('#del-zone'); if (z) z.innerHTML = '<button type="button" class="btn ghost danger" data-act="ask-delete">Eliminar</button>'; break; }
    case 'confirm-delete': deleteFromForm($('#rec-form')); break;
    case 'set-phase': {
      const p = projectById(UI.pid), ph = el.dataset.phase;
      if (!p || !canEdit() || p.phase === ph) break;
      updateRec('projects', p.id, { phase: ph }).then(() => { toast(`Área de enfoque: ${ph}`, 'ok'); logFeed(p.id, `movió el proyecto al área de enfoque «${ph}»`); }).catch(writeErr);
      break;
    }
    case 'agree-done': {
      const a = S.agreements.find(x => x.id === el.dataset.id); if (!a) break;
      el.disabled = true;
      updateRec('agreements', a.id, { status: 'Cumplido', doneAt: isoD(today()) }).then(() => { toast('Acuerdo marcado como cumplido', 'ok'); logFeed(a.pid, `cerró el acuerdo «${String(a.text).slice(0, 80)}»`); }).catch(err => { el.disabled = false; writeErr(err); });
      break;
    }
    case 'ai': runAI(el.dataset.scope); break;
    case 'ai-stop': if (aiCtl) aiCtl.abort(); break;
    case 'ai-close': if (aiCtl) aiCtl.abort(); delete UI.ai[el.dataset.scope]; render(); break;
    case 'export': exportProject(projectById(el.dataset.id)); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#modal').hidden) { closeModal(); return; } const dd = document.querySelector('.menu details[open]'); if (dd) dd.open = false; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('article.pcard')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('submit', e => { const form = e.target.closest('#rec-form'); if (!form) return; e.preventDefault(); submitForm(form); });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.change === 'depth') { UI.depth = Number(t.value) || 9; UI.scrollGantt = true; persistUI(); render(); return; }
  if (t.dataset && t.dataset.quick === 'progress') {
    const task = S.tasks.find(x => x.id === t.dataset.id); if (!task) return;
    const v = clamp(Math.round(num(t.value)), 0, 100);
    if (v === num(task.progress)) return;
    t.disabled = true;
    updateRec('tasks', task.id, { progress: v }).then(() => { toast(`Avance actualizado a ${v}%`, 'ok'); logFeed(task.pid, `actualizó el avance de «${String(task.name).slice(0, 70)}» a ${v}%`); }).catch(err => { t.disabled = false; writeErr(err); });
  }
});
let toastT = 0;
function toast(msg, tone) { const t = $('#toast'); t.textContent = msg; t.className = 'toast show ' + (tone === 'ok' ? '' : tone || ''); clearTimeout(toastT); toastT = setTimeout(() => { t.className = 'toast'; }, 4200); }

/* Reloj: cuenta regresiva cada segundo; "hace X" cada 30 s; recálculo completo al cambiar el día */
let lastDay = isoD(today()), ticks = 0;
setInterval(() => {
  tickCountdowns();
  if (++ticks % 30 === 0) { const d = isoD(today()); if (d !== lastDay) { lastDay = d; render(); } else if (!document.querySelector('.menu details[open]')) renderNav(); }
}, 1000);
