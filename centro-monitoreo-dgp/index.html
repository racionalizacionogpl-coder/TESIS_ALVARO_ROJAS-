<title>Gestión · Centro de Monitoreo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Marca Gestión: barra marina superior, franja principal en bruma turquesa, títulos centrados con subrayado
   doble, banda de indicadores turquesa, tarjetas blancas con una destacada y pie marino en cuatro columnas.
   Tokens idénticos al sistema de marca (claro / oscuro). */
:root{
  --canvas:#F4F7FA; --surface:#FFFFFF; --surface-alt:#F8FAFC; --mist:#E7F6F9; --line:#DCE4ED; --line-soft:#EAF0F5;
  --ink:#0F2240; --ink-muted:#55657E; --ink-faint:#7A879C;
  --navy-900:#0B1D3A; --navy-700:#14315F; --series-2:#14315F; --on-navy:#FFFFFF; --on-navy-muted:#B8C6DB;
  --teal-500:#1BB0C4; --teal-600:#0A7E90; --teal-700:#087686; --teal-100:#D3EFF4;
  --primary:#14315F; --on-primary:#FFFFFF;
  --ok:#1A7049; --ok-soft:#E1F3EA; --warn:#96590A; --warn-soft:#FDF0D9; --crit:#B8352C; --crit-soft:#FBE5E3; --idle:#5F6D84; --idle-soft:#EBEFF4;
  --q-act:#E3E9F5; --scrim:rgba(11,29,58,.55);
  --shadow-card:0 1px 2px #0b1d3a0f,0 10px 24px -14px #0b1d3a38; --shadow-float:0 18px 40px -16px #0b1d3a52;
  --focus-ring:0 0 0 2px #ffffff,0 0 0 4px #087686;
  --font-display:Montserrat,"Arial Black",system-ui,sans-serif;
  --font-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --radius-sm:6px; --radius-md:10px; --radius-lg:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --canvas:#0A1426; --surface:#0F1C33; --surface-alt:#142441; --mist:#0E2A3B; --line:#24365A; --line-soft:#1A2B4A;
    --ink:#E8EEF7; --ink-muted:#A6B4CA; --ink-faint:#7C8CA6;
    --navy-900:#071022; --navy-700:#1E3E72; --series-2:#A9BEDF; --on-navy:#FFFFFF; --on-navy-muted:#B8C6DB;
    --teal-500:#2BBACD; --teal-600:#0B7C8D; --teal-700:#5BD0E0; --teal-100:#133B4D;
    --primary:#3CC4D6; --on-primary:#061127;
    --ok:#5BC98F; --ok-soft:#13301F; --warn:#E7B24F; --warn-soft:#352812; --crit:#F27C72; --crit-soft:#3B1C1A; --idle:#8B97AC; --idle-soft:#1C2A44;
    --q-act:#1A2B4A; --scrim:rgba(0,0,0,.62);
    --shadow-card:0 1px 2px #00000066,0 10px 24px -14px #000000b3; --shadow-float:0 18px 40px -16px #000000cc;
    --focus-ring:0 0 0 2px #0f1c33,0 0 0 4px #5bd0e0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --canvas:#0A1426; --surface:#0F1C33; --surface-alt:#142441; --mist:#0E2A3B; --line:#24365A; --line-soft:#1A2B4A;
  --ink:#E8EEF7; --ink-muted:#A6B4CA; --ink-faint:#7C8CA6;
  --navy-900:#071022; --navy-700:#1E3E72; --series-2:#A9BEDF; --on-navy:#FFFFFF; --on-navy-muted:#B8C6DB;
  --teal-500:#2BBACD; --teal-600:#0B7C8D; --teal-700:#5BD0E0; --teal-100:#133B4D;
  --primary:#3CC4D6; --on-primary:#061127;
  --ok:#5BC98F; --ok-soft:#13301F; --warn:#E7B24F; --warn-soft:#352812; --crit:#F27C72; --crit-soft:#3B1C1A; --idle:#8B97AC; --idle-soft:#1C2A44;
  --q-act:#1A2B4A; --scrim:rgba(0,0,0,.62);
  --shadow-card:0 1px 2px #00000066,0 10px 24px -14px #000000b3; --shadow-float:0 18px 40px -16px #000000cc;
  --focus-ring:0 0 0 2px #0f1c33,0 0 0 4px #5bd0e0;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--canvas);color:var(--ink);font:400 15px/1.6 var(--font-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-family:var(--font-display)}
p{margin:0}
:focus-visible{outline:none;box-shadow:var(--focus-ring);border-radius:4px}
.sr{position:absolute;left:0;top:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.mono{font-family:var(--font-mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding-inline:clamp(16px,3.2vw,36px)}
.ico{flex:none;display:inline-block;vertical-align:middle}

/* ---------- barra superior ---------- */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--navy-900);color:var(--on-navy)}
.nav .wrap{display:flex;align-items:center;gap:20px;min-height:64px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;color:var(--on-navy);cursor:pointer;text-align:left}
.logo svg{display:block}
.logo b{display:block;font:800 19px/1 var(--font-display);letter-spacing:.06em}
.logo small{display:block;font:700 8.5px/1 var(--font-display);letter-spacing:.16em;color:var(--on-navy-muted);margin-top:4px}
.menu{display:flex;align-items:center;gap:4px;margin-left:auto;margin-right:auto}
.menu>button,.menu summary{list-style:none;border:0;background:none;color:var(--on-navy);font:700 12px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;padding:24px 12px 21px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
.menu summary::-webkit-details-marker{display:none}
.menu>button:hover,.menu summary:hover{color:var(--teal-500)}
.menu [aria-current="true"],.menu details.on summary{border-bottom-color:var(--teal-500)}
.menu details{position:relative}
.dd{position:absolute;top:calc(100% - 2px);left:0;min-width:320px;max-width:min(420px,90vw);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius-md);box-shadow:var(--shadow-float);padding:8px;z-index:50}
.dd button{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;border:0;background:none;padding:9px 10px;border-radius:var(--radius-sm);text-align:left;cursor:pointer;color:var(--ink)}
.dd button:hover{background:var(--surface-alt)}
.dd .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.nav-r{display:flex;align-items:center;gap:9px}
.live{display:inline-flex;align-items:center;gap:7px;font:700 11px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--on-navy)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--teal-500);animation:pulse 2.4s infinite}
.live.off i{background:var(--on-navy-muted);animation:none} .live.err i{background:var(--crit);animation:none} .live.wait i{animation:none}
.live small{font:400 12px/1 var(--font-body);letter-spacing:0;text-transform:none;color:var(--on-navy-muted)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(27,176,196,.55)}70%{box-shadow:0 0 0 8px rgba(27,176,196,0)}100%{box-shadow:0 0 0 0 rgba(27,176,196,0)}}
@media (prefers-reduced-motion:reduce){.live i{animation:none}}
.avs{display:flex}
.avs img{width:28px;height:28px;border-radius:50%;border:2px solid var(--navy-900);margin-left:-8px;background:var(--navy-700);object-fit:cover}
.avs img:first-child{margin-left:0}

/* ---------- botones y píldoras ---------- */
a.btn{text-decoration:none}
.btn{display:inline-flex;align-items:center;gap:8px;font:600 14px/1 var(--font-body);padding:11px 18px;border-radius:var(--radius-md);border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap;transition:background-color .15s ease-out,border-color .15s ease-out,color .15s ease-out}
.btn:hover{border-color:var(--teal-700);color:var(--teal-700)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{filter:brightness(1.12);color:var(--on-primary)}
.btn.accent{background:var(--teal-600);border-color:var(--teal-600);color:var(--on-navy)}
.btn.accent:hover{filter:brightness(1.1);color:var(--on-navy)}
.btn.pill{background:var(--on-navy);border-color:var(--on-navy);color:var(--navy-900);border-radius:999px;font:700 11.5px/1 var(--font-body);letter-spacing:.07em;text-transform:uppercase;padding:9px 16px}
.btn.pill:hover{background:var(--teal-500);border-color:var(--teal-500);color:var(--navy-900)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-muted)}
.btn.danger{color:var(--crit)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.round{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--teal-700);border:0;box-shadow:var(--shadow-card);cursor:pointer;flex:none}
.round-wrap{display:inline-flex;align-items:center;gap:12px;border:0;background:none;padding:0;cursor:pointer;color:var(--ink);font:600 14px/1.3 var(--font-body);text-align:left}
.round-wrap:hover .round{background:var(--teal-600);color:var(--on-navy)}
.icon-btn{border:1px solid transparent;background:none;border-radius:var(--radius-sm);padding:4px 9px;font:600 12.5px/1.2 var(--font-body);color:var(--teal-700);cursor:pointer}
.icon-btn:hover{border-color:var(--line);background:var(--surface)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font:700 12px/1.35 var(--font-body);white-space:nowrap;background:var(--idle-soft);color:var(--idle)}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.crit{background:var(--crit-soft);color:var(--crit)} .pill.data{background:var(--teal-100);color:var(--teal-700)} .pill.accent{background:var(--teal-100);color:var(--teal-700)}
.code-chip{font:500 12.5px/18px var(--font-mono);background:var(--teal-100);color:var(--teal-700);padding:2px 8px;border-radius:var(--radius-sm)}
select.inline{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-sm);padding:6px 9px;font-size:14px}

/* ---------- franja principal ---------- */
.hero{background:var(--mist);position:relative;overflow:hidden;border-bottom-left-radius:var(--radius-lg);border-bottom-right-radius:var(--radius-lg)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:40px;align-items:center;padding-block:52px 56px;position:relative}
.bubble{position:absolute;border-radius:50%;background:var(--surface);opacity:.9}
.eyebrow{font:700 11.5px/16px var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--teal-700);margin-bottom:10px}
h1.hero-t{font:800 40px/1.1 var(--font-display);letter-spacing:.01em;text-transform:uppercase;color:var(--ink)}
h1.title{font:700 32px/1.15 var(--font-display);color:var(--ink)}
.lead{font:400 17px/1.6 var(--font-body);color:var(--ink-muted);margin-top:14px;max-width:62ch}
.hero-actions{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;margin-top:26px}
.facts{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin-top:12px;font-size:14px;color:var(--ink-muted)}
.facts b{color:var(--ink);font-weight:600}
.blob{background:var(--navy-900);color:var(--on-navy);border-radius:140px 28px 140px 28px;padding:34px 34px 30px;box-shadow:var(--shadow-float);min-width:0}
.blob h2{font:700 11.5px/16px var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--teal-500);margin-bottom:16px;text-align:center}
.bl-row{display:grid;grid-template-columns:42px minmax(0,1fr) 44px;gap:10px;align-items:center;margin-top:12px;font-size:13px}
.bl-row .mono{color:var(--on-navy)}
.bl-trk{position:relative;height:10px;border-radius:5px;background:var(--navy-700)}
.bl-trk span{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--teal-500)}
.bl-trk i{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--on-navy);border-radius:1px}
.bl-val{font:700 13px/1 var(--font-display);text-align:right;font-variant-numeric:tabular-nums}
.bl-leg{display:flex;justify-content:center;gap:16px;margin-top:18px;font-size:12px;color:var(--on-navy-muted)}
.bl-leg span{display:inline-flex;align-items:center;gap:6px}
.bl-leg i{width:14px;height:6px;border-radius:3px;background:var(--teal-500)} .bl-leg i.plan{width:2px;height:12px;background:var(--on-navy)}

/* cuenta regresiva */
.cd{background:var(--navy-900);color:var(--on-navy);border-radius:var(--radius-lg);padding:26px 28px;box-shadow:var(--shadow-float);min-width:0}
.cd-eyebrow{font:700 11.5px/16px var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--teal-500)}
.cd-title{font:700 18px/1.3 var(--font-display);margin-top:6px}
.cd-sub{font-size:13px;color:var(--on-navy-muted);margin-top:4px}
.cd-row{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap}
.cd-c{width:70px;height:70px;border-radius:50%;border:2px solid var(--teal-500);display:flex;flex-direction:column;align-items:center;justify-content:center}
.cd-c b{font:700 22px/1 var(--font-display);font-variant-numeric:tabular-nums}
.cd-c span{font:600 10px/1.4 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--on-navy-muted);margin-top:3px}

/* ---------- secciones ---------- */
main{display:block}
.section{padding-block:48px 0}
.st{margin-bottom:26px}
.st.center{text-align:center}
.st h2{font:700 24px/1.25 var(--font-display);color:var(--ink)}
.st p.note{margin:8px auto 0}
.bars{display:flex;gap:6px;margin-top:10px}
.st.center .bars{justify-content:center}
.bars span{height:4px;width:28px;border-radius:2px;background:var(--teal-500)}
.bars span+span{width:8px}
.note{font-size:13.5px;color:var(--ink-muted);max-width:76ch}
.stack{display:flex;flex-direction:column;gap:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);box-shadow:var(--shadow-card);padding:22px 24px;min-width:0}
.panel-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.panel-head>div{min-width:0}
.panel-head h2{font:700 18px/1.3 var(--font-display)}
.panel-head .bars{margin-top:8px}
.panel-head .note{margin-top:8px}
.head-actions{display:flex;flex-wrap:wrap;gap:8px}
.split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px}
.split.even{grid-template-columns:repeat(2,minmax(0,1fr))}
.empty{border:1px dashed var(--line);border-radius:var(--radius-md);padding:18px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;color:var(--ink-muted);font-size:14px;background:var(--surface-alt)}
.empty p{max-width:64ch}
.domain-note{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:14px;color:var(--ink-muted);margin:4px 0 20px}
.domain-note b{font:700 11px/1 var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--teal-700)}

/* indicadores */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:16px}
.kpi{background:var(--teal-600);color:var(--on-navy);border-radius:var(--radius-md);padding:24px 14px 22px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:7px;min-width:0}
.kpi .ico{width:42px;height:42px}
.k-label{font:700 11px/16px var(--font-body);letter-spacing:.08em;text-transform:uppercase}
.k-val{font:700 34px/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.k-sub{font-size:13px;line-height:1.35}
.kband{position:relative;padding-block:6px}
.kband::before{content:"";position:absolute;left:0;right:0;top:45%;bottom:-26px;background:var(--mist);z-index:-1}

/* tarjetas de proyecto */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);box-shadow:var(--shadow-card);padding:22px;display:flex;flex-direction:column;gap:13px;min-width:0;cursor:pointer;transition:box-shadow .2s ease-out,transform .2s ease-out}
.pcard:hover{box-shadow:var(--shadow-float);transform:translateY(-2px)}
@media (prefers-reduced-motion:reduce){.pcard:hover{transform:none}}
.pcard.feat{background:var(--teal-600);border-color:var(--teal-600);color:var(--on-navy)}
.pcard.feat .code-chip{background:var(--navy-900);color:var(--on-navy)}
.pcard-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pcard h3{font:700 17px/1.3 var(--font-display);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.feat-tag{font:700 10.5px/1 var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--on-navy);opacity:.95}
.pbar{position:relative;height:8px;background:var(--line-soft);border-radius:4px}
.pbar>span{position:absolute;left:0;top:0;bottom:0;background:var(--teal-600);border-radius:4px}
.pbar>i{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--navy-700);border-radius:1px}
.pcard.feat .pbar{background:var(--navy-700)} .pcard.feat .pbar>span{background:var(--on-navy)} .pcard.feat .pbar>i{background:var(--teal-500)}
.pbar-legend{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;margin-top:6px;font-variant-numeric:tabular-nums;color:var(--ink-muted)}
.pcard.feat .pbar-legend,.pcard.feat .pfoot,.pcard.feat .mini dt{color:var(--on-navy)}
.pbar-legend b{color:inherit;font-weight:700}
.mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:0;padding-top:12px;border-top:1px solid var(--line-soft)}
.pcard.feat .mini{border-top-color:rgba(255,255,255,.28)}
.mini div{min-width:0}
.mini dt{font:700 10px/1.25 var(--font-body);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-muted);min-height:2.5em}
.mini dd{margin:0;font:700 19px/1.2 var(--font-display);font-variant-numeric:tabular-nums}
.tone-ok{color:var(--ok)} .tone-warn{color:var(--warn)} .tone-crit{color:var(--crit)} .tone-idle{color:var(--ink-muted)} .tone-data{color:var(--teal-700)}
.pcard.feat .mini dd{color:var(--on-navy)}
.pfoot{font-size:13px;color:var(--ink-muted)}
.pcard .btn{align-self:flex-start}
.stepper{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.step{border:0;background:none;padding:0;text-align:left;min-width:0;color:inherit}
.step i{display:block;height:5px;border-radius:3px;background:var(--line)}
.step.past i{background:var(--teal-500)} .step.now i{background:var(--navy-700)}
.pcard.feat .step i{background:rgba(255,255,255,.3)} .pcard.feat .step.past i{background:var(--teal-500)} .pcard.feat .step.now i{background:var(--on-navy)}
.step span{display:block;font-size:10.5px;color:var(--ink-muted);margin-top:4px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step.now span{color:var(--ink);font-weight:700}
.pcard.feat .step span{color:var(--on-navy)}

/* etapas numeradas */
.phases{display:flex;align-items:flex-start;justify-content:space-between;gap:0;position:relative;padding:4px 0}
.ph{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;border:0;background:none;padding:0;color:var(--ink);min-width:0}
.ph::before{content:"";position:absolute;top:19px;left:-50%;right:50%;height:3px;background:var(--line)}
.ph:first-child::before{display:none}
.ph.past::before,.ph.now::before{background:var(--teal-500)}
.ph .dot{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:700 15px/1 var(--font-display);background:var(--surface);border:2px solid var(--line);color:var(--ink-muted);position:relative;z-index:1}
.ph.past .dot{background:var(--teal-500);border-color:var(--teal-500);color:var(--navy-900)}
.ph.now .dot{background:var(--navy-700);border-color:var(--navy-700);color:var(--on-navy);box-shadow:0 0 0 5px var(--teal-100)}
.ph span{font:600 12.5px/1.25 var(--font-body);text-align:center;color:var(--ink-muted);padding-inline:4px}
.ph.now span{color:var(--ink);font-weight:700}
button.ph{cursor:pointer}
button.ph:hover .dot{border-color:var(--teal-500)}

/* pestañas */
.tabs{display:flex;gap:4px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;overflow-x:auto;margin:26px 0 18px;box-shadow:var(--shadow-card);scrollbar-width:thin}
.tab{padding:10px 16px;border:0;background:none;border-radius:999px;color:var(--ink-muted);font:700 13px/1 var(--font-body);white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.tab:hover{color:var(--ink);background:var(--surface-alt)}
.tab[aria-selected="true"]{background:var(--navy-900);color:var(--on-navy)}
.tab .cnt{font:700 11px/1 var(--font-mono);background:var(--crit);color:#fff;border-radius:999px;padding:3px 6px}

/* listas */
.alerts,.feed{list-style:none;margin:0;padding:0}
.alerts li,.feed li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line-soft)}
.alerts li:first-child,.feed li:first-child{border-top:0;padding-top:2px}
.sev{width:10px;height:10px;border-radius:50%;margin-top:7px;background:var(--teal-600)}
.sev.s2{background:var(--crit)} .sev.s1{background:var(--warn)} .sev.s0{background:var(--teal-600)}
.a-meta{font-size:12.5px;color:var(--ink-muted);display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:2px}
.a-meta .mono{font-size:12px}
.linkish{border:0;background:none;padding:0;color:var(--teal-700);font-weight:700;cursor:pointer;font-size:12.5px}
.linkish:hover{text-decoration:underline}
.feed .who{font-weight:700}

/* hitos (eventos) */
.events{display:flex;flex-direction:column;gap:18px}
.event{display:grid;grid-template-columns:150px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);box-shadow:var(--shadow-card);overflow:hidden;min-width:0}
.ev-date{background:var(--navy-900);color:var(--on-navy);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:2px;position:relative}
.ev-date b{font:800 44px/1 var(--font-display);font-variant-numeric:tabular-nums}
.ev-date span{font:700 12px/1.2 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--on-navy-muted)}
.ev-date svg{color:var(--teal-500);margin-bottom:6px}
.ev-body{padding:20px 24px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ev-body h3{font:700 18px/1.3 var(--font-display)}
.ev-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}

/* tablas */
.tbl{overflow-x:auto;margin:0 -4px;position:relative}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font:700 10.5px/1.3 var(--font-body);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-muted);text-align:left;padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:10px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tbody tr:hover td{background:var(--surface-alt)}
td.wrap{min-width:200px;max-width:440px;padding-inline:10px;margin:0}
td.nowrap,th.nowrap{white-space:nowrap}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.act-col{width:1%;white-space:nowrap;text-align:right}
.tfilter{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.tf{border:1px solid var(--line);background:var(--surface);color:var(--ink-muted);border-radius:999px;padding:7px 13px;font:700 12.5px/1 var(--font-body);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.tf b{font:600 11.5px/1 var(--font-mono);color:var(--ink-faint)}
.tf:hover{color:var(--ink);border-color:var(--ink-faint)}
.tf.on{background:var(--navy-900);border-color:var(--navy-900);color:var(--on-navy)}
.tf.on b{color:var(--on-navy-muted)}
.tf.late b{color:var(--crit)} .tf.late.on b{color:#FFB4AC}
td.c,th.c{text-align:center}
.done-chk{display:inline-grid;place-items:center;cursor:pointer;position:relative;width:26px;height:26px}
.done-chk input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.done-chk span{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;transition:background .15s,border-color .15s}
.done-chk:hover span{border-color:var(--ok)}
.done-chk input:checked+span{background:var(--ok);border-color:var(--ok)}
.done-chk input:checked+span::after{content:"";width:6px;height:11px;border:solid var(--ok-soft);border-width:0 2.5px 2.5px 0;transform:translate(0,-1px) rotate(45deg)}
.done-chk input:focus-visible+span{box-shadow:var(--focus-ring)}
.done-chk input:disabled+span{opacity:.5}
.done-mark{color:var(--ok);font-weight:700}
.quick{width:68px;border:1px solid var(--line);background:var(--surface-alt);border-radius:var(--radius-sm);padding:4px 7px;font-size:13.5px;text-align:right;font-variant-numeric:tabular-nums}
.sub{display:block;font-size:12.5px;color:var(--ink-muted)}

/* priorización */
.prank{list-style:none;margin:16px 0 0;padding:0;border-top:1px solid var(--line-soft)}
.prank li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.prank-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:6px}
.prank-meta .sub{display:inline}
.prank-n{width:28px;height:28px;border-radius:50%;background:var(--navy-700);color:var(--on-navy);display:grid;place-items:center;font:700 13px/1 var(--font-display)}
.prank-name{border:0;background:none;padding:0;color:var(--ink);font:600 14px/1.35 var(--font-body);text-align:left;cursor:pointer}
.prank-name:hover{color:var(--teal-700);text-decoration:underline}
.prank-name .mono{color:var(--teal-700);margin-right:2px}
.pstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0 0 18px}
.pstats div{background:var(--surface-alt);border:1px solid var(--line-soft);border-radius:var(--radius-md);padding:14px 16px;min-width:0}
.pstats dt{font:700 10.5px/1.3 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:6px}
.pstats dd{margin:0;font:700 26px/1.15 var(--font-display);font-variant-numeric:tabular-nums;color:var(--ink)}
.pstats dd small{font:600 13px/1 var(--font-body);color:var(--ink-muted)}
.pstats dd.pq{font-size:14px;padding-top:5px}
.prio-t tr.grp th{background:var(--mist);color:var(--teal-700);border-bottom:1px solid var(--line);padding:8px 10px}
.prio-t tr.grp:hover th{background:var(--mist)}
.score{display:inline-flex;align-items:center;gap:8px}
.score b{font:700 17px/1 var(--font-display);min-width:12px}
.score .dots{justify-content:flex-start;gap:4px}
.score .dots i{width:8px;height:8px}

/* EDT */
.wbs{list-style:none;margin:0;padding:0}
.wbs li{display:grid;grid-template-columns:minmax(0,1fr) 160px auto;gap:14px;align-items:center;padding:8px 0;border-top:1px solid var(--line-soft)}
.wbs li:first-child{border-top:0}
.wbs .w-name{display:flex;gap:8px;align-items:baseline;min-width:0}
.wbs .w-name span:last-child{overflow:hidden;text-overflow:ellipsis}
.wbs .lvl1 .w-name{font-weight:700}
.wbs .w-code{font:500 12px var(--font-mono);color:var(--ink-muted);flex:none}

/* gráficos */
.chart{width:100%;height:auto;display:block}
.c-grid{stroke:var(--line-soft)}
.c-tick{fill:var(--ink-muted);font:500 11px var(--font-body)}
.c-plan{fill:none;stroke:var(--teal-600);stroke-width:2.4}
.c-area{fill:var(--teal-100)}
.c-real{fill:var(--series-2);stroke:var(--surface);stroke-width:2}
.c-planpt{fill:var(--teal-600);stroke:var(--surface);stroke-width:2}
.c-today{stroke:var(--series-2);stroke-width:1.4;stroke-dasharray:4 3}
.c-lbl{fill:var(--ink);font:700 12px var(--font-body)}
.c-lbl.acc{fill:var(--series-2)} .c-lbl.dat{fill:var(--teal-700)}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12.5px;color:var(--ink-muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;background:var(--teal-600)}
.legend i.acc{width:10px;height:10px;border-radius:50%;background:var(--series-2)}
.legend i.pt{width:10px;height:10px;border-radius:50%;background:var(--teal-600)}
.m-q-prior{fill:var(--teal-100)} .m-q-act{fill:var(--q-act)} .m-q-np{fill:var(--surface-alt)} .m-q-na{fill:var(--idle-soft)}
.m-qlbl{fill:var(--ink-muted);font:700 9.5px var(--font-body);letter-spacing:.06em}
.m-dot{fill:var(--series-2);stroke:var(--surface);stroke-width:2}
.m-lbl{fill:var(--ink);font:600 12px var(--font-mono)}
.g-row{cursor:pointer}
.gantt-tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}
.gantt-wrap{display:grid;grid-template-columns:auto minmax(0,1fr);border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface);overflow:hidden}
.gantt-wrap svg{display:block}
.g-left{border-right:1px solid var(--line)}
.g-scroll{overflow-x:auto;min-width:0}
.g-zebra{fill:var(--surface-alt)} .g-hit{fill:transparent}
.g-row:hover .g-hit{fill:var(--teal-100)}
.g-grid{stroke:var(--line-soft)}
.g-month{fill:var(--ink-muted);font:700 11px var(--font-body)}
.g-year{fill:var(--ink);font:700 11px var(--font-display)}
.g-label{fill:var(--ink);font:400 12.5px var(--font-body)}
.g-label.sum{font-weight:700}
.g-code{fill:var(--ink-muted);font:500 11px var(--font-mono)}
.g-plan{fill:var(--teal-100);stroke:var(--teal-500)}
.g-prog{fill:var(--teal-600)} .g-prog.late{fill:var(--crit)} .g-prog.done{fill:var(--ok)} .g-prog.behind{fill:var(--warn)}
.g-sum{fill:var(--series-2)}
.g-ms{fill:var(--series-2)} .g-ms.done{fill:var(--ok)}
.g-today{stroke:var(--crit);stroke-width:1.5;stroke-dasharray:4 3}
.g-today-l{fill:var(--crit);font:700 11px var(--font-body)}
.g-pct{fill:var(--ink-muted);font:500 10.5px var(--font-mono)}
.g-sep{stroke:var(--line)}
.heat{display:grid;grid-template-columns:22px repeat(5,minmax(0,1fr));gap:5px;font-size:12px;align-items:stretch}
.hcell{min-height:48px;border-radius:var(--radius-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 15px/1.1 var(--font-display);font-variant-numeric:tabular-nums;padding:4px;text-align:center}
.hcell small{font:500 10px var(--font-mono);line-height:1.2}
.hcell.lo{background:var(--ok-soft);color:var(--ok)} .hcell.mid{background:var(--warn-soft);color:var(--warn)} .hcell.hi{background:var(--crit-soft);color:var(--crit)}
.hcell.zero{opacity:.5}
.hax{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink-muted);font-weight:700}
.hax.vert{writing-mode:vertical-rl;transform:rotate(180deg)}
.heat-foot{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-muted);margin-top:6px;padding-left:28px}
.quad{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.qbox{border-radius:var(--radius-md);padding:12px;min-height:100px;min-width:0}
.qbox h4{font:700 11px/1.2 var(--font-body);letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px;color:var(--ink)}
.qbox.q1{background:var(--teal-100)} .qbox.q2{background:var(--q-act)} .qbox.q3{background:var(--surface-alt);border:1px solid var(--line-soft)} .qbox.q4{background:var(--idle-soft)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-block;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:2px 8px;font-size:12.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quad-axes{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-muted);margin-top:8px}
.hbars{display:flex;flex-direction:column;gap:10px}
.hbar{display:grid;grid-template-columns:minmax(0,160px) minmax(0,1fr) auto;gap:12px;align-items:center;font-size:13.5px}
.hbar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .trk{height:10px;background:var(--line-soft);border-radius:5px;position:relative}
.hbar .trk span{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--teal-600)}
.hbar .trk span.acc{background:var(--series-2)} .hbar .trk span.ok{background:var(--ok)}
.charter{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 26px;margin:0}
.charter div{min-width:0}
.charter dt{font:700 10.5px/1.3 var(--font-body);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-muted);margin-bottom:3px}
.charter dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.charter .wide{grid-column:1/-1}

/* personas */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.person{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);box-shadow:var(--shadow-card);padding:22px 18px 18px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;min-width:0}
.avatar{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:var(--teal-100);color:var(--navy-700);font:800 26px/1 var(--font-display);box-shadow:0 0 0 4px var(--surface),0 0 0 7px var(--teal-500);margin-bottom:10px}
.person h3{font:700 16px/1.3 var(--font-display)}
.person .role{font-size:13.5px;color:var(--ink-muted)}
.person .sep{width:100%;height:1px;background:var(--line-soft);margin:8px 0}
.person .meta{display:flex;justify-content:center;gap:14px;font-size:12.5px;color:var(--ink-muted);flex-wrap:wrap}
.person .meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.person p.txt{font-size:13.5px;color:var(--ink-muted);text-align:left;width:100%}
.dots{display:flex;gap:5px;justify-content:center}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--teal-600)}
.dots i.goal{background:transparent;box-shadow:inset 0 0 0 2px var(--teal-600)}

/* asesor IA */
.ai .ai-body{font-size:15px;line-height:1.65;max-width:82ch}
.ai .ai-body h4{font:700 16px/1.3 var(--font-display);margin:16px 0 4px}
.ai .ai-body h4:first-child{margin-top:0}
.ai .ai-body ul{margin:4px 0 8px;padding-left:20px}
.ai .ai-body p{margin:4px 0}

/* guía */
.guide-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.gcard{border:1px solid var(--line);border-radius:var(--radius-md);padding:22px;background:var(--surface);box-shadow:var(--shadow-card);min-width:0}
.gnum{width:40px;height:40px;border-radius:50%;background:var(--teal-600);color:var(--on-navy);display:grid;place-items:center;font:700 16px/1 var(--font-display);margin-bottom:12px}
.gcard h3{font:700 17px/1.3 var(--font-display);margin-bottom:6px}
.gcard p{font-size:14px;color:var(--ink-muted)}
.gcard .where{font-size:13.5px;margin-top:10px;color:var(--ink)}
.gcard .where b{color:var(--teal-700)}
.gl{display:grid;grid-template-columns:minmax(100px,max-content) minmax(0,1fr);gap:8px 18px;margin:0;font-size:14px}
.gl dt{font:600 13px var(--font-mono);color:var(--teal-700)}
.gl dd{margin:0;color:var(--ink-muted)}

/* pie */
.foot{background:var(--navy-900);color:var(--on-navy);margin-top:72px}
.foot .wrap{padding-block:52px 0}
.foot-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:34px}
.foot h4{font:700 15px/1.3 var(--font-display);margin-bottom:14px}
.foot p,.foot li{font-size:14px;color:var(--on-navy-muted)}
.foot ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.foot button.fl{border:0;background:none;padding:0;color:var(--on-navy-muted);cursor:pointer;font-size:14px;text-align:left}
.foot button.fl:hover{color:var(--teal-500)}
.foot-bottom{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.12);margin-top:40px;padding-block:20px 26px}
.foot-bottom small{color:var(--on-navy-muted);font-size:13px}
.totop{width:48px;height:48px;border-radius:50%;background:var(--teal-600);color:var(--on-navy);border:0;display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow-float)}
.totop:hover{filter:brightness(1.12)}

/* modal y avisos */
.overlay{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
.dialog{background:var(--surface);border-radius:var(--radius-lg);width:min(800px,100%);max-height:calc(100% - 24px);overflow:auto;box-shadow:var(--shadow-float)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 24px;position:sticky;top:0;background:var(--navy-900);color:var(--on-navy);z-index:1}
.dlg-head h2{font:700 18px/1.3 var(--font-display)}
.dlg-head .icon-btn{color:var(--on-navy)}
.dlg-head .icon-btn:hover{background:var(--navy-700);border-color:var(--navy-700)}
.dlg-body{padding:20px 24px 6px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.f{display:flex;flex-direction:column;gap:5px;font:700 12.5px/1.3 var(--font-body);color:var(--ink-muted);min-width:0}
.f.wide{grid-column:1/-1}
.f small{font-weight:400;color:var(--ink-muted);font-size:12px}
.req{color:var(--crit);font-weight:700}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface-alt);border-radius:var(--radius-sm);padding:9px 11px;font:400 15px/1.4 var(--font-body);color:var(--ink);width:100%;min-width:0}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--teal-700)}
.f textarea{resize:vertical;min-height:72px}
.fgroup{grid-column:1/-1;font:700 11px/1.3 var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--teal-700);padding-top:10px;border-top:1px solid var(--line-soft);margin-top:4px}
.form-err{color:var(--crit);font-size:14px;font-weight:700;padding:8px 24px 0}
.dlg-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 24px 22px}
.foot-r{display:flex;gap:10px;margin-left:auto}
.del-zone{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--crit);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--navy-900);color:var(--on-navy);padding:12px 18px;border-radius:var(--radius-md);font-size:14px;font-weight:700;max-width:min(560px,calc(100% - 32px));transition:opacity .2s,transform .2s;z-index:80;box-shadow:var(--shadow-float);border-left:0}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.crit{background:var(--crit);color:#fff} .toast.warn{background:var(--warn);color:#fff}
.loading{padding:70px 0;color:var(--ink-muted);display:flex;flex-direction:column;gap:10px;max-width:62ch}

@media (max-width:1100px){.split,.split.even{grid-template-columns:minmax(0,1fr)}.foot-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .hero .wrap{grid-template-columns:minmax(0,1fr);padding-block:36px 40px}
  .nav .wrap{gap:4px 14px;padding-block:8px 0}
  .menu{order:3;width:100%;margin:0;overflow-x:auto}
  .menu>button,.menu summary{padding:12px 10px 11px}
  .nav-r{margin-left:auto}
  .dd{position:fixed;left:16px;right:16px;top:auto;min-width:0;max-width:none}
}
@media (max-width:640px){
  h1.hero-t{font-size:28px} h1.title{font-size:25px}
  .fgrid,.charter{grid-template-columns:minmax(0,1fr)}

}

/* modelo de gestión (láminas) */

/* =========================================================
   Pizarra digital: lienzo infinito con zonas, tarjetas, aristas y recorrido

:root{--wbc-proj:var(--m-proj);--wbc-proc:var(--m-proc);--wbc-acred:var(--m-acred);--wbc-risk:var(--m-risk);--wbc-calidad:var(--m-calidad);--wbc-navy:var(--series-2);--wbc-hub:#0B1D3A}

.wb-hero .wrap{grid-template-columns:minmax(0,1fr);padding-block:30px 30px}

.wb-viewport:focus-visible{box-shadow:inset 0 0 0 3px var(--teal-600);border-radius:0}
.wb-world{position:absolute;left:0;top:0;transform-origin:0 0}
.wb-world.anim{transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.wb-edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.wb-el{position:absolute;transition:opacity .35s ease,box-shadow .2s ease,border-color .2s ease}
.wb-el.dim{opacity:.16}
.wb-wtitle{position:absolute;left:84px;top:16px;font:800 30px/1.1 var(--font-display);letter-spacing:.04em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.wb-wtitle small{font:700 18px/1 var(--font-body);letter-spacing:.09em;color:var(--teal-700);margin-left:14px}
.wb-wlegend{position:absolute;right:84px;top:22px;display:flex;gap:26px;font:600 16px/1 var(--font-body);color:var(--ink-muted);white-space:nowrap}
.wb-wlegend span{display:inline-flex;align-items:center;gap:10px}
.wb-lg{fill:none;stroke-width:3.5;stroke-linecap:round}
.wb-lg.base{stroke:var(--series-2)} .wb-lg.flow{stroke:var(--ink-faint);stroke-width:2.5} .wb-lg.rel{stroke:var(--teal-500);stroke-dasharray:8 6}
/* zonas */
.wb-frame{border-radius:30px;background:var(--surface-alt);background:color-mix(in srgb,var(--wc) 7%,var(--surface));border:2px solid color-mix(in srgb,var(--wc) 34%,transparent);border-top:12px solid var(--wc);cursor:zoom-in}
.wb-frame:hover{border-color:var(--wc)}
.wb-frame header{display:flex;align-items:center;gap:16px;padding:10px 24px}
.wb-fn{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--m-yellow);color:var(--m-yellow-ink);box-shadow:0 0 0 3px var(--navy-900);font:800 23px/1 var(--font-display);flex:none}
.wb-frame h3{font:800 26px/1.15 var(--font-display);color:var(--ink)}
.wb-frame header p{font-size:15px;line-height:1.35;color:var(--ink-muted);margin-top:3px}
/* tarjetas */
.wb-node{display:grid;grid-template-columns:minmax(0,1fr);align-content:start;gap:8px 12px;padding:14px 18px;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--wc);border-radius:14px;box-shadow:var(--shadow-card);overflow:hidden;cursor:pointer;color:var(--ink)}
.wb-node:hover{border-color:var(--wc);box-shadow:var(--shadow-float)}
.wb-node.sel{box-shadow:0 0 0 4px var(--teal-500),var(--shadow-float)}
.wb-node:focus-visible{box-shadow:var(--focus-ring),var(--shadow-float);border-radius:14px}
.wb-node h4{font:700 17px/1.25 var(--font-display);color:var(--ink);min-width:0;overflow-wrap:anywhere}
.wb-node.has-num{grid-template-columns:auto minmax(0,1fr)}
.wb-node.has-num>h4{align-self:center}
.wb-node.has-num .wb-body{grid-column:1/-1}
.wb-step.has-num .wb-num{grid-row:span 2;align-self:start}
.wb-step.has-num .wb-body{grid-column:2}
.wb-phase.has-num{grid-template-columns:minmax(0,1fr)}
.wb-ts{display:none}
.wb-num{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 8px;border-radius:999px;background:var(--m-yellow);color:var(--m-yellow-ink);box-shadow:0 0 0 2px var(--navy-900);font:800 13px/1 var(--font-display);justify-self:start;white-space:nowrap}
.wb-num.in{display:inline-grid;margin-right:10px;vertical-align:3px}
.wb-proj .wb-num{font-family:var(--font-mono);font-weight:500}
.wb-body{font-size:14.5px;line-height:1.45;color:var(--ink-muted);min-width:0;display:flex;flex-direction:column;gap:8px}
.wb-body ol,.wb-body ul{margin:0;padding-left:20px}
.wb-body b{color:var(--ink)}
.wb-quote{border-top-width:1px;border-left:6px solid var(--wc)}
.wb-q{font:600 17px/1.45 var(--font-body);color:var(--ink)}
.wb-hub{background:var(--wbc-hub);border:0;border-radius:26px;padding:26px 30px;color:var(--on-navy);box-shadow:var(--shadow-float);text-align:center;align-content:center;outline:4px solid color-mix(in srgb,var(--teal-500) 50%,transparent);outline-offset:7px}
.wb-hub:hover{box-shadow:var(--shadow-float)}
.wb-hub h4{font:800 28px/1.15 var(--font-display);color:var(--on-navy)}
.wb-hub .wb-body{color:var(--on-navy-muted);font-size:16px}
.wb-hub.sel{box-shadow:0 0 0 4px var(--teal-500),var(--shadow-float)}
.wb-key{background:var(--wbc-hub);border-color:var(--wbc-hub);color:var(--on-navy)}
.wb-key h4{color:var(--teal-500)}
.wb-key .wb-body,.wb-key .wb-body b{color:var(--on-navy)}
.wb-pq{font-style:italic;color:var(--ink)}
.wb-phase .wb-body ul{padding-left:18px}
.wb-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.wb-cols b,.wb-flow b{display:block;font:700 11.5px/1.3 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--wc);margin-bottom:4px}
.wb-flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.wb-flow b{width:100%;margin:0}
.wb-flow span{padding:4px 10px;border-radius:999px;background:var(--surface-alt);background:color-mix(in srgb,var(--wc) 12%,var(--surface));color:var(--ink);font-weight:600;font-size:13px}
.wb-flow i{font-style:normal;color:var(--wc);font-weight:700}
.wb-chips{display:flex;flex-wrap:wrap;gap:5px}
.wb-chips span{padding:3px 8px;border-radius:999px;background:var(--surface-alt);border:1px solid var(--line);font-size:12px;line-height:1.3;color:var(--ink)}
.wb-tree{list-style:none;padding:0!important;display:flex;flex-direction:column;gap:8px}
.wb-tree li{padding:3px 0 3px 12px;border-left:3px solid var(--wc)}
.wb-tree b,.wb-tree small{display:block}
.wb-tree small{font-size:13px}
.wb-sem{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;text-align:center;font:700 15px/1.25 var(--font-display)}
.wb-sem span{padding:8px 6px;border-radius:8px}
.wb-sem small{display:block;font:600 11.5px/1.2 var(--font-body);margin-top:2px}
.wb-sem .crit,.wb-grid .crit{background:var(--crit-soft);color:var(--crit)}
.wb-sem .warn,.wb-grid .warn{background:var(--warn-soft);color:var(--warn)}
.wb-sem .ok,.wb-grid .ok{background:var(--ok-soft);color:var(--ok)}
.wb-pxi{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.wb-pxi p{margin:0 0 3px}
.wb-grid{display:grid;grid-template-columns:repeat(5,34px);gap:3px}
.wb-grid i{display:grid;place-items:center;height:34px;border-radius:5px;font:500 12px/1 var(--font-mono);font-style:normal}
.wb-risk,.wb-cov{list-style:none;padding:0!important;display:flex;flex-direction:column;gap:6px;margin:0}
.wb-risk li{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 10px;background:var(--surface-alt);border-radius:8px}
.wb-cov li{display:grid;grid-template-columns:40px minmax(0,1fr) 44px;gap:10px;align-items:center}
.wb-mini{display:block;height:8px;border-radius:4px;background:var(--line-soft);overflow:hidden}
.wb-mini i{display:block;height:100%;background:var(--ok)}
.wb-cl{list-style:none;padding:0!important;display:flex;flex-direction:column;gap:6px}
.wb-cl li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 10px;border-radius:8px;background:var(--surface-alt)}
.wb-cl li b{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--wc);color:var(--m-on);font:800 12.5px/1 var(--font-display)}
.wb-cl li span{color:var(--ink);font-weight:600;line-height:1.25}
.wb-cl li em{font:500 11px/1 var(--font-mono);font-style:normal;padding:4px 7px;border-radius:999px;background:var(--m-yellow);color:var(--m-yellow-ink)}
.wb-flowmini{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.wb-flowmini span{padding:4px 10px;border-radius:999px;background:var(--navy-700);color:var(--on-navy);font:700 12.5px/1.2 var(--font-display)}
.wb-flowmini span.on{background:var(--m-yellow);color:var(--m-yellow-ink)}
.wb-flowmini i{font-style:normal;color:var(--teal-500)}
.wb-ph{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:13.5px}
.wb-av>span{display:block;position:relative;height:10px;border-radius:5px;background:var(--line-soft)}
.wb-av>span i{display:block;height:100%;border-radius:5px;background:var(--teal-600)}
.wb-av>span em{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--ink)}
.wb-av small{display:block;margin-top:5px;font-size:12.5px}
.wb-steps{display:flex;flex-wrap:wrap;gap:5px}
.wb-steps span{padding:3px 8px;border-radius:999px;background:var(--m-yellow);color:var(--m-yellow-ink);font:800 11.5px/1.2 var(--font-display)}
.wb-rol{font-size:13.5px}
/* aristas y etiquetas */
.wb-e{fill:none;stroke-linecap:round;transition:opacity .35s,stroke .2s,stroke-width .2s}
.wb-e.base{stroke:var(--series-2);stroke-width:3.5}
.wb-e.flow{stroke:var(--ink-faint);stroke-width:2.5}
.wb-e.rel{stroke:var(--teal-500);stroke-width:3;stroke-dasharray:10 9;opacity:0}
.rel .wb-e.rel{opacity:.9;animation:wb-march 1.6s linear infinite}
.wb-e.hi{stroke:var(--teal-600);stroke-width:4.5;opacity:1}
.wb-e.dim,.rel .wb-e.rel.dim{opacity:.12}
.wb-ar.base{fill:var(--series-2)} .wb-ar.flow{fill:var(--ink-faint)} .wb-ar.rel{fill:var(--teal-500)}
.wb-tag{position:absolute;transform:translate(-50%,-50%);padding:4px 11px;border-radius:999px;font:700 13px/1.2 var(--font-body);white-space:nowrap;pointer-events:none;transition:opacity .35s;box-shadow:var(--shadow-card)}
.wb-tag.base{background:var(--wbc-hub);color:var(--on-navy)}
.wb-tag.flow{background:var(--surface);color:var(--ink-muted);border:1px solid var(--line)}
.wb-tag.rel{background:var(--teal-600);color:#FFFFFF;opacity:0}
.rel .wb-tag.rel,.wb-tag.rel.hi{opacity:1}
.wb-tag.dim,.rel .wb-tag.rel.dim{opacity:.15}
@keyframes wb-march{to{stroke-dashoffset:-38}}
/* lejos: solo títulos grandes, como un mapa conceptual */
.far .wb-body{display:none}
.far .wb-node{align-content:center;padding:14px 22px}
.far .wb-node h4{font-size:34px;line-height:1.12}
.far .wb-step h4{font-size:24px}
.far .wb-phase{padding-inline:14px}
.far .wb-phase h4{font-size:19px}
.far .wb-e.base{stroke-width:7}
.far .wb-e.flow{stroke-width:5}
.far .wb-e.rel{stroke-width:7;stroke-dasharray:22 16}
.far .wb-e.hi{stroke-width:9}
.far .wb-node.tall.has-num{grid-template-columns:minmax(0,1fr)}
.far .wb-node.tall.has-num>h4{align-self:start}
.far .wb-step.tall .wb-num{grid-row:auto}
.far .wb-hub h4{font-size:46px}
.far .wb-num{min-width:52px;height:52px;font-size:20px;padding:0 12px}
.far .wb-frame h3{font-size:46px}
.far .wb-frame header p{display:none}
.far .wb-fn{width:66px;height:66px;font-size:30px}
.far .wb-tag{font-size:24px;padding:7px 18px}
.far .wb-tag.flow{display:none}
.far .wb-wtitle{font-size:46px}
.far .wb-wtitle small{font-size:28px}
.far .wb-wlegend{font-size:28px;top:18px}
/* minimapa, panel y recorrido */
.wb-minimap{position:absolute;left:12px;bottom:12px;width:160px;height:auto;aspect-ratio:3400/2300;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-card);cursor:pointer;z-index:2}
.wb-minimap rect{opacity:.42}
.wb-minimap .wb-mm-vp{opacity:1;fill:var(--teal-500);fill-opacity:.14;stroke:var(--teal-600);stroke-width:2;vector-effect:non-scaling-stroke}
.wb-panel{position:absolute;top:12px;right:12px;bottom:12px;width:min(380px,calc(100% - 24px));background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-float);padding:22px 22px 24px;overflow-y:auto;overscroll-behavior:contain;transform:translateX(calc(100% + 24px));visibility:hidden;transition:transform .38s cubic-bezier(.2,.7,.2,1),visibility 0s .38s;cursor:auto;user-select:text;-webkit-user-select:text;touch-action:pan-y;z-index:3}
.wb-panel.on{transform:none;visibility:visible;transition:transform .38s cubic-bezier(.2,.7,.2,1)}
.wb-panel h3{font:700 21px/1.25 var(--font-display);margin:0 34px 12px 0}
.wb-x{position:absolute;top:12px;right:12px;font-size:15px}
.wb-more{font-size:14.5px;line-height:1.55;display:flex;flex-direction:column;gap:10px;color:var(--ink)}
.wb-more ul,.wb-more ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.wb-more .wb-cov{padding:0}
.wb-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.wb-kids{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:8px}
.wb-kids .linkish{font-size:14px;text-align:left}
.wb-tour{display:none}
.wb-tour.on{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 20px;align-items:center;padding:14px 18px 16px;background:var(--navy-900);color:var(--on-navy);animation:wb-up .35s ease-out}
.wb-tour-t small{font:700 11px/1.3 var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--teal-500)}
.wb-tour-t b{display:block;font:700 18px/1.25 var(--font-display);margin:2px 0 4px}
.wb-tour-t p{font-size:14.5px;color:var(--on-navy-muted);max-width:92ch}
.wb-tour-b{display:flex;flex-wrap:wrap;gap:8px}
.wb-dots{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
.wb-dots button{width:12px;height:12px;border:0;border-radius:6px;padding:0;background:var(--navy-700);cursor:pointer;transition:width .25s,background-color .25s}
.wb-dots button:hover{background:var(--teal-600)}
.wb-dots button.on{width:30px;background:var(--teal-500)}
/* animación de entrada */
.wb-intro .wb-frame{animation:wb-in .55s cubic-bezier(.2,.7,.2,1) both}
.wb-intro .wb-node{animation:wb-in .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 22ms + 220ms)}
.wb-intro .wb-e.base,.wb-intro .wb-e.flow{stroke-dasharray:1;stroke-dashoffset:1;animation:wb-draw 1s ease-out .75s forwards}
.wb-intro .wb-tag{animation:wb-fade .4s ease-out 1.5s both}
@keyframes wb-in{from{opacity:0;transform:translateY(18px) scale(.96)}}
@keyframes wb-draw{to{stroke-dashoffset:0}}
@keyframes wb-fade{from{opacity:0}}
@keyframes wb-up{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){.wb-world.anim,.wb-viewport.anim,.wb-panel,.wb-panel.on{transition:none}.rel .wb-e.rel,.wb-tour.on{animation:none}}
@media (max-width:900px){.wb-hint{display:none}}
@media (max-width:640px){
  .wb-shell{padding-inline:8px}
  .wb-viewport{height:clamp(420px,64vh,560px)}
  .wb.touring:not(.max) .wb-viewport{height:clamp(300px,48vh,440px)}
  .wb-tl{display:none}.wb-ts{display:inline}
  .wb-zl{display:none}
  .wb.touring .wb-minimap{display:none}
  .wb-sep{display:none}
  .wb-minimap{width:112px;left:8px;bottom:8px}
  .wb-panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;max-height:60%;transform:translateY(calc(100% + 16px))}
  .wb-tour.on{grid-template-columns:minmax(0,1fr);padding:12px 14px 14px}
  .wb-tour-t p{font-size:13.5px}
  .wb-chip{font-size:12.5px}
}
.plan-flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;position:relative}
.plan-card{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--teal-600);border-radius:var(--radius-md);padding:14px 16px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0;box-shadow:var(--shadow-card)}
.plan-card.none{border-top-color:var(--line);background:var(--surface-alt);box-shadow:none}
.plan-card small{font:700 10.5px/1.3 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--teal-700)}
.plan-card h3{font:700 17px/1.25 var(--font-display)}
.plan-t{font-size:13.5px;color:var(--ink);line-height:1.35}
.plan-meta{font-size:12.5px;color:var(--ink-muted)}
.plan-bar{width:100%;height:8px;border-radius:4px;background:var(--line-soft);overflow:hidden;margin-top:4px}
.plan-bar span{display:block;height:100%;background:var(--ok)}
.plan-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.plan-mx td.c,.plan-mx th.c{text-align:center}
.pm-ok{color:var(--ok);font-weight:700;font-size:16px}
.pm-pend{color:var(--warn);font-size:18px;line-height:1}
.plan-gates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.plan-gates div{display:flex;gap:10px;align-items:flex-start;font-size:13px;padding:10px 12px;border:1px dashed var(--line);border-radius:var(--radius-md);background:var(--surface-alt)}
.plan-gates b{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--navy-900);color:var(--on-navy);font:800 12px/1 var(--font-display)}
@media (max-width:1000px){.plan-flow{grid-template-columns:repeat(2,minmax(0,1fr))}.plan-gates{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.plan-flow{grid-template-columns:minmax(0,1fr)}}
.pr{position:fixed;inset:0;z-index:62;background:var(--scrim);display:flex;align-items:stretch;justify-content:center;padding:16px}
html.pr-lock{overflow:hidden}
.pr-shell{width:min(1240px,100%);background:var(--canvas);border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-float)}
.pr-top{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:16px 22px;background:var(--navy-900);color:var(--on-navy)}
.pr-top-t{min-width:0;flex:1 1 360px}
.pr-top small{font:700 11px/1.3 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--teal-500)}
.pr-top small .mono{font-size:11.5px;letter-spacing:0;text-transform:none}
.pr-top h2{font:700 20px/1.25 var(--font-display);margin-top:3px}
.pr-top-a{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pr-prog{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--on-navy-muted)}
.pr-prog b{color:var(--on-navy)}
.pr-bar{display:inline-block;width:80px;height:6px;border-radius:3px;background:var(--navy-700);overflow:hidden}
.pr-bar i{display:block;height:100%;background:var(--teal-500)}
.pr-main{flex:1;min-height:0;display:grid;grid-template-columns:260px minmax(0,1fr)}
.pr-toc{border-right:1px solid var(--line);background:var(--surface);overflow-y:auto;padding:14px 10px}
.pr-toc-t{font:700 10.5px/1.3 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);padding:0 8px 8px}
.pr-toc ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.pr-toc button{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;border-radius:var(--radius-sm);padding:7px 8px;font:600 13px/1.3 var(--font-body);color:var(--ink);cursor:pointer}
.pr-toc button:hover{background:var(--surface-alt)}
.pr-tk{flex:none;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:10px;margin-top:1px}
.pr-tk.on{background:var(--ok);border-color:var(--ok);color:var(--ok-soft)}
.pr-body{position:relative;overflow-y:auto;padding:22px clamp(16px,3vw,36px) 60px;scroll-behavior:auto}
.pr-sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow-card)}
.pr-sec.editing{border-color:var(--teal-600);box-shadow:0 0 0 2px var(--teal-600)}
.pr-sec-h{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.pr-sec-h h3{font:700 18px/1.3 var(--font-display);flex:1 1 320px}
.pr-sec-a{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pr-val{border:1px dashed var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font:700 12px/1.2 var(--font-body);color:var(--ink-muted);cursor:pointer}
