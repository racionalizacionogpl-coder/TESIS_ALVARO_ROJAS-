function tabRiesgo(p, m) {
  const td = today();
  const threats = m.threats;
  const cells = []; for (let pr = 5; pr >= 1; pr--) { cells.push(`<div class="hax">${pr}</div>`); for (let im = 1; im <= 5; im++) { const sc = pr * im, list = threats.filter(r => num(r.probability) === pr && num(r.impact) === im); const cls = sc >= 15 ? 'hi' : sc >= 8 ? 'mid' : 'lo'; cells.push(`<div class="hcell ${cls}${list.length ? '' : ' zero'}" title="P${pr} × I${im} = ${sc}">${list.length || ''}${list.length ? `<small>${list.slice(0, 3).map(r => esc(r.code || '')).join(' ')}</small>` : ''}</div>`); } }
  const heat = `<div style="display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px;align-items:center"><div class="hax vert">Probabilidad</div><div><div class="heat">${cells.join('')}<div></div>${[1, 2, 3, 4, 5].map(i => `<div class="hax">${i}</div>`).join('')}</div><div class="heat-foot"><span>Impacto →</span><span>Alto ≥ 15 · Medio 8–14 · Bajo ≤ 7</span></div></div></div>`;
  const opps = m.openR.filter(r => r.kind === 'Oportunidad');
  const R = m.R.slice().sort((a, b) => { const ca = a.status === 'Cerrado' ? 1 : 0, cb = b.status === 'Cerrado' ? 1 : 0; if (ca !== cb) return ca - cb; return riskScore(b) - riskScore(a); });
  const sTone = { Abierto: 'warn', 'En tratamiento': 'data', Materializado: 'crit', Cerrado: 'ok' };
  const I = of('issues', p.id).slice().sort((a, b) => (a.status === 'Resuelto') - (b.status === 'Resuelto') || ['Alta', 'Media', 'Baja'].indexOf(a.priority) - ['Alta', 'Media', 'Baja'].indexOf(b.priority));
  const attention = threats.filter(r => riskScore(r) >= 15 || !r.response || (parseD(r.due) && parseD(r.due) < td)).sort((a, b) => riskScore(b) - riskScore(a));
  return `<div class="split">${panel('Mapa de calor de amenazas abiertas', `${plural(threats.length, 'amenaza abierta', 'amenazas abiertas')} · ${plural(opps.length, 'oportunidad', 'oportunidades')}. Cada celda muestra cuántos riesgos tienen esa probabilidad e impacto.`, heat)}
    ${panel('Riesgos que exigen atención', 'Puntaje alto, sin respuesta o con revisión vencida.', attention.length ? `<ul class="alerts">${attention.slice(0, 8).map(r => `<li><span class="sev ${riskScore(r) >= 15 ? 's2' : 's1'}"></span><div>${esc(r.title)}<div class="a-meta"><span class="mono">${esc(r.code || '')}</span><span>P×I ${riskScore(r)}</span><span>${esc(r.strategy || 'Sin estrategia')}</span>${r.owner ? `<span>${esc(r.owner)}</span>` : ''}</div></div></li>`).join('')}</ul>` : '<div class="empty"><p>Todas las amenazas tienen respuesta y están dentro de rango.</p></div>')}</div>`
    + panel('Registro de riesgos', 'Probabilidad × impacto en escala 1–5. Las oportunidades usan estrategias de explotar, mejorar o compartir.', regTable('risks', R, [
      { h: 'Código', v: r => `<span class="mono">${T_(r.code)}</span><span class="sub">${esc(r.kind || '')}</span>`, cls: 'nowrap' },
      { h: 'Riesgo', v: r => `${esc(r.title)}${r.trigger ? `<span class="sub">Señal: ${esc(r.trigger)}</span>` : ''}`, cls: 'wrap' },
      { h: 'P×I', v: r => { const sc = riskScore(r); return `<span class="pill ${r.kind === 'Oportunidad' ? 'data' : sc >= 15 ? 'crit' : sc >= 8 ? 'warn' : 'ok'}">${sc}</span><span class="sub">${num(r.probability)}×${num(r.impact)}</span>`; }, cls: 'nowrap' },
      { h: 'Respuesta', v: r => `${r.strategy ? `<b>${esc(r.strategy)}</b>: ` : ''}${wrapTxt(r.response)}`, cls: 'wrap' },
      { h: 'Dueño', v: r => T_(r.owner), cls: 'nowrap' },
      { h: 'Estado', v: r => `${pill(sTone[r.status] || '', r.status || '—')}${r.due ? `<span class="sub">Revisión ${fmtDs(r.due)}</span>` : ''}`, cls: 'nowrap' },
    ], { empty: 'Sin riesgos registrados. Identifícalos con lluvia de ideas, revisión de supuestos o lecciones de proyectos anteriores.' }), addBtn('risks'))
    + panel('Registro de incidentes', 'Problemas que ya ocurrieron y deben resolverse (a diferencia de los riesgos, que aún son inciertos).', regTable('issues', I, [
      { h: 'Código', v: i => `<span class="mono">${T_(i.code)}</span>`, cls: 'nowrap' },
      { h: 'Incidente', v: i => `${esc(i.title)}${i.description ? `<span class="sub">${esc(i.description)}</span>` : ''}`, cls: 'wrap' },
      { h: 'Prioridad', v: i => pill(i.priority === 'Alta' ? 'crit' : i.priority === 'Media' ? 'warn' : '', i.priority || '—'), cls: 'nowrap' },
      { h: 'Responsable', v: i => T_(i.owner), cls: 'nowrap' },
      { h: 'Objetivo', v: i => fmtDs(i.due), cls: 'nowrap num' },
      { h: 'Estado', v: i => pill(i.status === 'Resuelto' ? 'ok' : i.status === 'En curso' ? 'data' : 'warn', i.status || '—'), cls: 'nowrap' },
    ], { empty: 'Sin incidentes abiertos.' }), addBtn('issues'));
}

let aiCtl = null;
function aiPanel(scope) {

  return `<section class="panel ai"><div class="panel-head"><div><p class="eyebrow" style="margin-bottom:4px">Asesor PMBOK · redactado por Claude</p><h2>${scope === 'portfolio' ? 'Informe de portafolio' : 'Informe de estado del proyecto'}</h2><div class="bars" aria-hidden="true"><span></span><span></span></div></div><div class="head-actions">${st.busy ? '<button class="btn sm" data-act="ai-stop">Detener</button>' : `<button class="btn sm" data-act="ai" data-scope="${esc(scope)}">Regenerar</button>`}<button class="btn ghost sm" data-act="ai-close" data-scope="${esc(scope)}">Cerrar</button></div></div><div class="ai-body">${st.text ? mdLite(st.text) : '<p class="note">Analizando los datos del sistema… puede tardar unos segundos.</p>'}</div>${st.error ? `<p class="note tone-crit" style="margin-top:8px">${esc(st.error)}</p>` : ''}<p class="note" style="margin-top:12px">Revísalo antes de usarlo: se basa solo en lo registrado en este sistema al ${fmtD(today())}.</p></section>`;

function mdLite(t) {
  const lines = String(t).split('\n'); let html = '', inList = false;
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  for (const raw of lines) {
    const l = raw.trim();
    if (/^[-*•] /.test(l)) { if (!inList) { html += '<ul>'; inList = true; } html += `<li>${inline(l.replace(/^[-*•] /, ''))}</li>`; continue; }
    if (inList) { html += '</ul>'; inList = false; }
    if (/^#{1,4} /.test(l)) html += `<h4>${inline(l.replace(/^#{1,4} /, ''))}</h4>`;
    else if (l) html += `<p>${inline(l)}</p>`;
  }
  if (inList) html += '</ul>';
  return html;
}

    incidentesAbiertos: m.openI.slice(0, 8).map(i => pick(i, ['code', 'title', 'priority', 'owner', 'due'])),

  };
}

// componentes del plan de gestión (lámina 1.4) y cómo el sistema comprueba cada uno
function planItems(p) {
  const n = c => (S.loaded.has(c) ? of(c, p.id) : []);
  const T = n('tasks'), R = n('requirements'), C = n('changes'), TM = n('team'), RK = n('risks'), SH = n('stakeholders');
  const has = v => !!String(v || '').trim();
  const cnt = (k, one, many) => `${k} ${k === 1 ? one : many}`;
  return [
    ['Propósito del plan', 'gobernanza', has(p.purpose), has(p.purpose) ? 'Registrado en el acta' : 'Falta el propósito en el acta'],
    ['Decisiones adoptadas en esta versión', 'gobernanza', C.some(c => has(c.decision)), C.some(c => has(c.decision)) ? cnt(C.filter(c => has(c.decision)).length, 'decisión registrada', 'decisiones registradas') : 'Sin decisiones en Control de cambios'],
    ['Enunciado del alcance', 'alcance', has(p.scopeIn), has(p.scopeIn) ? 'Alcance y exclusiones en el acta' : 'Falta «El alcance incluye»'],
    ['Estructura de desglose del trabajo (EDT / WBS)', 'alcance', T.some(t => t.type === 'Entregable'), T.length ? cnt(T.filter(t => t.type === 'Entregable').length, 'entregable', 'entregables') + ' · ' + cnt(T.length, 'elemento', 'elementos') : 'EDT vacía'],
    ['Matriz de trazabilidad de requisitos', 'alcance', R.length > 0, R.length ? cnt(R.length, 'requisito', 'requisitos') : 'Sin requisitos registrados'],
    ['Criterios de aceptación', 'alcance', R.some(r => has(r.criteria)), R.some(r => has(r.criteria)) ? cnt(R.filter(r => has(r.criteria)).length, 'requisito con criterio', 'requisitos con criterio') : 'Sin criterios de aceptación'],
    ['Roles y responsabilidades (matriz RACI)', 'recursos', TM.length > 0, TM.length ? cnt(TM.length, 'integrante con rol', 'integrantes con rol') : 'Equipo sin registrar'],
    ['Control de cambios', 'gobernanza', C.length > 0, C.length ? cnt(C.length, 'solicitud', 'solicitudes') : 'Sin solicitudes de cambio'],
    ['Gestión del cronograma', 'cronograma', T.some(t => t.start && t.end), T.some(t => t.start && t.end) ? 'Cronograma con fechas y línea base' : 'Cronograma sin fechas'],
    ['Gestión de la calidad', 'gobernanza', has(p.success), has(p.success) ? 'Criterios de éxito definidos' : 'Faltan criterios de éxito'],
    ['Gestión de riesgos', 'riesgo', RK.length > 0, RK.length ? cnt(RK.length, 'riesgo identificado', 'riesgos identificados') : 'Sin riesgos registrados'],
    ['Interesados y comunicaciones', 'interesados', SH.length > 0, SH.length ? cnt(SH.length, 'interesado', 'interesados') : 'Sin interesados registrados'],
    ['Documentos que integran este plan', null, !!driveUrl(p.drive), driveUrl(p.drive) ? 'Carpeta de Drive enlazada' : 'Sin carpeta de Drive'],
  ];
}

/* geometría de las aristas: curvas de Bézier entre lados de las tarjetas */
const WB_NRM = { l: [-1, 0], r: [1, 0], t: [0, -1], b: [0, 1] };
const wbPt = ([x, y, w, h], s, t) => (s === 'l' ? [x, y + h * t] : s === 'r' ? [x + w, y + h * t] : s === 't' ? [x + w * t, y] : [x + w * t, y + h]);
function wbRect(id, M) { if (wbIsFrame(id)) { const f = M.F.find(x => x.id === id); return f && [f.x, f.y, f.w, f.h]; } const n = M.N.find(x => x.id === id); return n && [n.x, n.y, n.w, n.h]; }
function wbPath(a, b, anc, lt) {
  let s1, s2, p1, p2, L;
  if (anc) { s1 = anc[0]; s2 = anc[2]; p1 = wbPt(a, s1, anc[1]); p2 = wbPt(b, s2, anc[3]); L = Math.max(40, Math.hypot(p2[0] - p1[0], p2[1] - p1[1]) * 0.45); }
  else {
    const dx = b[0] + b[2] / 2 - (a[0] + a[2] / 2), dy = b[1] + b[3] / 2 - (a[1] + a[3] / 2);
    const horiz = Math.abs(dx) / (a[2] + b[2]) > Math.abs(dy) / (a[3] + b[3]);
    s1 = horiz ? (dx > 0 ? 'r' : 'l') : (dy > 0 ? 'b' : 't'); s2 = { l: 'r', r: 'l', t: 'b', b: 't' }[s1];
    p1 = wbPt(a, s1, 0.5); p2 = wbPt(b, s2, 0.5); L = Math.max(40, Math.abs(horiz ? p2[0] - p1[0] : p2[1] - p1[1]) * 0.5);
  }
  const n1 = WB_NRM[s1], n2 = WB_NRM[s2];
  const c1 = [p1[0] + n1[0] * L, p1[1] + n1[1] * L], c2 = [p2[0] + n2[0] * L, p2[1] + n2[1] * L];
  const t = lt == null ? 0.5 : lt, u = 1 - t, B = i => u * u * u * p1[i] + 3 * u * u * t * c1[i] + 3 * u * t * t * c2[i] + t * t * t * p2[i];
  const r = v => Math.round(v * 10) / 10;
  return { d: `M${r(p1[0])} ${r(p1[1])}C${r(c1[0])} ${r(c1[1])} ${r(c2[0])} ${r(c2[1])} ${r(p2[0])} ${r(p2[1])}`, mx: r(B(0)), my: r(B(1)) };
}

const wbVp = () => document.getElementById('wb-vp');
let wbSize = null, wbIntroT = 0;
function wbApply(anim) {
  const w = document.getElementById('wb-world'), vp = wbVp(); if (!w || !vp) return;
  const c = UI.wb, mo = !!anim && !matchMedia('(prefers-reduced-motion: reduce)').matches;
  w.classList.toggle('anim', mo); vp.classList.toggle('anim', mo);
  w.style.transform = `translate(${c.x}px,${c.y}px) scale(${c.k})`;
  vp.classList.toggle('far', c.k < 0.45);
  let g = 32 * c.k; while (g < 16) g *= 2;
  vp.style.backgroundSize = `${g}px ${g}px`; vp.style.backgroundPosition = `${c.x}px ${c.y}px`;
  const zl = document.getElementById('wb-zl'); if (zl) zl.textContent = Math.round(c.k * 100) + '%';
  const r = vp.getBoundingClientRect(), mv = vp.querySelector('.wb-mm-vp'); wbSize = [r.width, r.height];
  if (mv) { mv.setAttribute('x', -c.x / c.k); mv.setAttribute('y', -c.y / c.k); mv.setAttribute('width', r.width / c.k); mv.setAttribute('height', r.height / c.k); }
}
// mantiene el mismo punto del lienzo al centro cuando cambia el tamaño del visor
function wbReflow() {
  const vp = wbVp(); if (!vp || !wbSize) return;
  const r = vp.getBoundingClientRect(); UI.wb.x += (r.width - wbSize[0]) / 2; UI.wb.y += (r.height - wbSize[1]) / 2; wbApply(false);
}
function wbFitRect([x, y, w, h], anim, pad) {
  const vp = wbVp(); if (!vp) return;
  const r = vp.getBoundingClientRect(); const p = pad == null ? 0.92 : pad;
  const k = Math.max(0.08, Math.min(1.6, Math.min(r.width / w, r.height / h) * p));
  UI.wb.k = k; UI.wb.x = r.width / 2 - (x + w / 2) * k; UI.wb.y = r.height / 2 - (y + h / 2) * k;
  wbApply(anim);
}
function wbZoomAt(f, mx, my, anim) {
  const c = UI.wb, k2 = Math.max(0.08, Math.min(2.2, c.k * f));
  c.x = mx - (mx - c.x) * k2 / c.k; c.y = my - (my - c.y) * k2 / c.k; c.k = k2; wbApply(anim);
}
function wbSpot(fid, sel) {

  const conn = new Set(); if (sel) { conn.add(sel); M.E.forEach(([a, b]) => { if (a === sel) conn.add(b); if (b === sel) conn.add(a); }); }
  const own = sel && (M.N.find(n => n.id === sel) || {}).f;
  w.querySelectorAll('.wb-el').forEach(el => { const id = el.dataset.el; const dim = (fid && el.dataset.f !== fid && id !== fid) || (sel && !conn.has(id) && id !== own); el.classList.toggle('dim', !!dim); el.classList.toggle('sel', id === sel); });
  w.querySelectorAll('.wb-e,.wb-tag').forEach(e => { const hit = !!sel && (e.dataset.a === sel || e.dataset.b === sel); const near = !!fid && (e.dataset.a === fid || e.dataset.b === fid || (M.N.find(n => n.id === e.dataset.a) || {}).f === fid); e.classList.toggle('hi', hit); e.classList.toggle('dim', !!(fid || sel) && !hit && !near); });

}

  else el.innerHTML = `${close}<p class="eyebrow">${esc((M.F.find(x => x.id === n.f) || { t: 'Centro del modelo' }).t)}</p><h3>${n.num ? `<span class="wb-num in">${esc(n.num)}</span>` : ''}${esc(n.t)}</h3><div class="wb-more">${n.more || n.b || ''}</div>${n.links ? `<div class="wb-links">${n.links}</div>` : ''}`;

function wbStartLabel() { const b = document.getElementById('wb-start'); if (b) { b.innerHTML = wbStartTxt(); b.dataset.v = Math.max(0, UI.wb.tour); } }
function wbSetTourBar() {
  const tb = document.getElementById('wb-tour'); if (!tb || !UI.wbModel) return;
  const h = wbTourBar(UI.wbModel); tb.innerHTML = h; tb.classList.toggle('on', !!h); wbStartLabel();
  const wb = document.getElementById('wb'); if (wb) wb.classList.toggle('touring', !!h);
}
function wbSelect(id, zoom) {
  const M = UI.wbModel; if (!M || !wbVp()) return;
  UI.wb.sel = id; UI.wb.tour = -1; wbSetTourBar();
  wbPanel(id); wbRespot();
  if (!zoom) return;
  const r = wbRect(id, M); if (!r) return;
  const vp = wbVp().getBoundingClientRect(), sheet = vp.width <= 640;
  const panelW = !sheet && vp.width > 760 ? 392 : 0, availH = sheet ? vp.height * 0.4 : vp.height, pad = sheet ? 24 : 60;
  const k = Math.max(0.12, Math.min(1.25, Math.min((vp.width - panelW) / (r[2] + pad * 2), availH / (r[3] + pad * 2))));
  UI.wb.k = k; UI.wb.x = (vp.width - panelW) / 2 - (r[0] + r[2] / 2) * k; UI.wb.y = availH / 2 - (r[1] + r[3] / 2) * k; wbApply(true);
}
function wbClose() {
  UI.wb.sel = null; const p = document.getElementById('wb-panel'); if (p) p.classList.remove('on'); wbRespot();
}
// trae la pizarra completa a la vista, por debajo de la barra de navegación fija
function wbScrollIn() {
  const wb = document.getElementById('wb'); if (!wb || UI.wb.max) return;
  const r = wb.getBoundingClientRect(), navH = ($('#nav') || wb).getBoundingClientRect().height;
  if (r.top < navH - 1 || r.bottom > innerHeight + 1) window.scrollBy({ top: r.top - navH - 8, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
}
function wbTour(i) {
  const M = UI.wbModel; if (!M || !wbVp()) return;
  const starting = UI.wb.tour < 0;
  i = Math.max(0, Math.min(M.tour.length - 1, i)); UI.wb.tour = i; UI.wb.sel = null;
  wbSetTourBar(); if (starting) wbScrollIn();
  const pnl = document.getElementById('wb-panel'); if (pnl) pnl.classList.remove('on');
  const s = M.tour[i]; wbRespot(); wbFitRect(s.r, true, s.f ? 0.9 : 0.96);
}
function wbEndTour() { UI.wb.tour = -1; wbSetTourBar(); wbRespot(); wbReflow(); }
function wbMax() {
  const wb = document.getElementById('wb'); if (!wb) return;
  UI.wb.max = !UI.wb.max; wb.classList.toggle('max', UI.wb.max); document.documentElement.classList.toggle('wb-lock', UI.wb.max);
  const b = document.getElementById('wb-maxb'); if (b) b.innerHTML = wbMaxTxt();

}
function wbMount() {

// arrastre, rueda y pellizco
const wbPtr = { down: false, moved: false, x: 0, y: 0, pts: new Map(), pinch: 0 };
document.addEventListener('pointerdown', e => {
  wbPtr.moved = false;
  const vp = e.target.closest && e.target.closest('#wb-vp'); if (!vp || e.target.closest('.wb-panel,.wb-minimap,button,a')) return;
  wbPtr.pts.set(e.pointerId, [e.clientX, e.clientY]);
  wbPtr.down = true; wbPtr.x = e.clientX; wbPtr.y = e.clientY;
  if (wbPtr.pts.size === 2) { const [a, b] = [...wbPtr.pts.values()]; wbPtr.pinch = Math.hypot(a[0] - b[0], a[1] - b[1]); }
});
document.addEventListener('pointermove', e => {
  if (!wbPtr.down || !wbVp()) return;
  if (wbPtr.pts.has(e.pointerId)) wbPtr.pts.set(e.pointerId, [e.clientX, e.clientY]);

  }
  const dx = e.clientX - wbPtr.x, dy = e.clientY - wbPtr.y;
  if (!wbPtr.moved && Math.hypot(dx, dy) < 5) return;

});
const wbUp = e => { wbPtr.pts.delete(e.pointerId); if (wbPtr.pts.size < 2) wbPtr.pinch = 0; if (!wbPtr.pts.size) { wbPtr.down = false; const vp = wbVp(); if (vp) vp.classList.remove('drag'); } };
document.addEventListener('pointerup', wbUp); document.addEventListener('pointercancel', wbUp);

document.addEventListener('click', e => { if (wbPtr.moved && e.target.closest && e.target.closest('#wb-vp')) { e.stopPropagation(); e.preventDefault(); wbPtr.moved = false; } }, true);
document.addEventListener('wheel', e => {
  const vp = e.target.closest && e.target.closest('#wb-vp'); if (!vp || e.target.closest('.wb-panel')) return;
  e.preventDefault(); const r = vp.getBoundingClientRect();

// con el teclado, la tarjeta enfocada se trae a la vista
document.addEventListener('focusin', e => {
  const n = e.target.closest && e.target.closest('.wb-node'), vp = wbVp(); if (!n || !vp || wbPtr.down) return;
  const a = n.getBoundingClientRect(), v = vp.getBoundingClientRect();
  if (a.left >= v.left && a.right <= v.right && a.top >= v.top && a.bottom <= v.bottom) return;
  const rr = UI.wbModel && wbRect(n.dataset.el, UI.wbModel); if (!rr) return;
  const k = Math.max(UI.wb.k, 0.5); UI.wb.k = k; UI.wb.x = v.width / 2 - (rr[0] + rr[2] / 2) * k; UI.wb.y = v.height / 2 - (rr[1] + rr[3] / 2) * k; wbApply(true);
});
window.addEventListener('resize', () => { if (UI.view === 'board') wbReflow(); });
function wbKey(e) {
  const W = UI.wb;
  if (e.key === 'Escape') { if (W.tour >= 0) wbEndTour(); else if (W.sel) wbClose(); else if (W.max) wbMax(); return; }

  else if (e.key === '-' || e.key === '_') { e.preventDefault(); wbZoomAt(1 / 1.3, r.width / 2, r.height / 2, true); }
  else if (e.key === '0') { e.preventDefault(); wbFitRect([0, 0, WB_W, WB_H], true, 0.96); }

}
