/* ---------- oficina virtual 3D ---------- */
.of-hero .lead{max-width:780px}
.of-zones{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.of-shell{max-width:1340px;margin:0 auto;padding:0 clamp(16px,3.2vw,36px)}
.of{position:relative;scroll-margin-top:84px;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);box-shadow:var(--shadow-card);overflow:hidden}
.of.max{position:fixed;inset:0;z-index:70;border:0;border-radius:0;display:flex;flex-direction:column}
html.of-lock,html.of-lock body{overflow:hidden}
.of-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.of-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.of-grp{display:inline-flex;gap:3px}
.of-grp .btn{min-width:36px;justify-content:center;padding-inline:10px;font-size:15px}
.of-bar .btn.on{background:var(--teal-100);border-color:var(--teal-600);color:var(--teal-700)}
.of-clock{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface-alt)}
.seg button{border:0;background:none;border-radius:999px;padding:7px 12px;font:700 12.5px/1 var(--font-body);color:var(--ink-muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.of-time{display:inline-flex;align-items:baseline;gap:8px;font-size:14px;white-space:nowrap}
.of-time .mono{font:600 15px var(--font-mono);color:var(--teal-700)}
.of-sim{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.of-days{gap:4px}
.of-days .chip{padding:5px 9px;font-size:12px}
#of-range{width:min(210px,42vw);accent-color:var(--teal-600)}
.of-speed select{padding:6px 8px}
.of-off{font-size:12.5px;color:var(--ink-muted)}
.of-off .linkish{font-size:12.5px}
.of-stage{position:relative;height:clamp(440px,66vh,780px);background:var(--surface-alt);outline:none;overflow:hidden;touch-action:none}
.of.max .of-stage{flex:1;height:auto}
.of-stage:focus-visible{box-shadow:inset 0 0 0 3px var(--teal-600)}
.of-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
.of-canvas.drag{cursor:grabbing}
.of-load{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:12px;color:var(--ink-muted);font-weight:600;text-align:center;padding:20px;z-index:6;background:var(--surface-alt)}
.of-load p{margin:0;max-width:420px}
.of-spin{display:inline-block;width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--teal-600);animation:ofspin .9s linear infinite}
.of-spin.sm{width:14px;height:14px;border-width:2px}
@keyframes ofspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.of-spin{animation-duration:3s}}
.of-labels{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.of-tag{position:absolute;left:0;top:0;translate:-50% -100%;pointer-events:auto;display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:999px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 94%,transparent);box-shadow:0 6px 14px -8px rgba(11,29,58,.55);font:inherit;color:var(--ink);cursor:pointer;white-space:nowrap;visibility:hidden}
.of-tag:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.of-tag .av-chip{width:24px;height:24px;font-size:9.5px;box-shadow:none}
.of-tx{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}
.of-tx b{font:700 12.5px/1.15 var(--font-body)}
.of-tx small{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--ink-muted)}
.of-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--idle);flex:none}
.of-dot.desk{background:var(--ok)}.of-dot.class{background:var(--warn)}.of-dot.meeting{background:var(--m-proj)}.of-dot.away{background:var(--idle)}
.of-tag.on .av-chip{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ok)}
.of-tag.sel,.of-tag.hov{border-color:var(--teal-600);box-shadow:0 0 0 2px color-mix(in srgb,var(--teal-600) 45%,transparent),0 6px 14px -8px rgba(11,29,58,.55)}
.of-tag.ghost{border-style:dashed;border-color:var(--teal-600);background:color-mix(in srgb,var(--teal-100) 92%,transparent)}
.of-tag.ai{gap:5px;padding:3px 8px 3px 4px;font:700 11px/1 var(--font-body);color:var(--teal-700);border-color:color-mix(in srgb,var(--teal-600) 55%,transparent);background:color-mix(in srgb,var(--teal-100) 92%,transparent)}
.of-ai-i{display:inline-grid;place-items:center;min-width:20px;height:16px;padding:0 4px;border-radius:5px;background:var(--teal-600);color:#fff;font:800 9.5px/1 var(--font-display);letter-spacing:.04em}
.of-labels.far .of-tag:not(.ai),.of-tag.mini{padding:2px}
.of-labels.far .of-tx,.of-tag.mini .of-tx{display:none}
.of-bub{position:absolute;left:0;top:0;translate:-50% calc(-100% - 40px);pointer-events:none;width:max-content;max-width:230px;padding:6px 10px;border-radius:10px;background:var(--navy-900);color:#fff;font:600 12px/1.3 var(--font-body);box-shadow:var(--shadow-float);visibility:hidden}
.of-bub::after{content:'';position:absolute;left:50%;bottom:-4px;width:9px;height:9px;background:inherit;transform:translateX(-50%) rotate(45deg)}
.of-panel{position:absolute;top:12px;right:12px;bottom:12px;width:min(400px,calc(100% - 24px));overflow:auto;z-index:4;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);box-shadow:var(--shadow-float);padding:16px 16px 14px;overscroll-behavior:contain;touch-action:pan-y}
.of-ph{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
.of-ph h3{font:800 16.5px/1.25 var(--font-display);margin:0}
.of-ph p{margin:3px 0 0;font-size:13px;color:var(--ink-muted)}
.of-x{margin-left:auto;flex:none}
.of-zc{flex:none;width:12px;height:42px;border-radius:4px;background:var(--zc)}
.of-st{margin:0 0 10px}
.of-stl{display:inline;font-size:13px;font-weight:600}
.of-stl .of-dot{margin-right:6px;vertical-align:1px}
.of-who .of-stl,.of-listv .of-stl{font-weight:500;font-size:12.5px;color:var(--ink-muted)}
.of-sec{border-top:1px solid var(--line-soft);padding:12px 0}
.of-sec h4{display:flex;align-items:center;gap:6px;margin:0 0 8px;font:800 11.5px/1.2 var(--font-display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted)}
.of-sec h4 small{font:600 12px var(--font-body);letter-spacing:0;text-transform:none}
.of-sec p{margin:0;font-size:13.5px;line-height:1.45}
.of-sec .note{font-size:12.5px}
.of-now small{color:var(--ink-muted)}
.of-agent{margin:2px -8px 2px;padding:12px 8px;border-radius:var(--radius-sm);background:color-mix(in srgb,var(--teal-100) 55%,transparent);border-top-color:transparent}
.of-acts{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.of-acts .btn{white-space:normal;text-align:left;line-height:1.2}
.of-ask{display:flex;gap:6px}
.of-ask input{flex:1;min-width:0;border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 10px;font:inherit;font-size:14px;background:var(--surface);color:var(--ink)}
.of-ask input:focus{outline:none;box-shadow:var(--focus-ring)}
.of-out-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px;font-size:13.5px}
.of-out{max-height:340px;overflow:auto;margin-top:8px;border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;background:var(--surface);font-size:13.5px;line-height:1.5}
.of-out h4{margin:10px 0 4px;font:800 13px var(--font-display)}
.of-out h4:first-child{margin-top:0}
.of-out ul{margin:4px 0 8px;padding-left:18px}
.of-out p{margin:0 0 6px}
.of-panel > .of-out{max-height:none}
.of-out-a{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.of-ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.45}
.of-ul li+li{margin-top:4px}
.of-q{margin:0;padding-left:20px;font-size:13.5px;line-height:1.45}
.of-q li+li{margin-top:5px}
.of-q li.late{color:var(--crit)}
.of-q small{color:var(--ink-muted)}
.of-who{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.of-who li{display:grid;gap:2px}
.of-who .linkish{display:inline-flex;align-items:center;gap:6px}
.of-runs{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:13.5px}
.of-runs small{color:var(--ink-muted)}
.of-pa{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px!important}
.of-pf{display:flex;flex-wrap:wrap;gap:6px;border-top:1px solid var(--line-soft);padding-top:12px}
.of-cap{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(640px,calc(100% - 24px));z-index:5;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 16px;padding:14px 16px;border-radius:var(--radius-md);background:var(--navy-900);color:#fff;box-shadow:var(--shadow-float)}
.of-cap small{font:700 11px var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--teal-500)}
.of-cap h3{margin:4px 0 4px;font:800 17px/1.25 var(--font-display)}
.of-cap p{margin:0;font-size:14px;line-height:1.45;color:var(--on-navy-muted)}
.of-cap > div:first-child{flex:1 1 300px}
.of-cap-a{display:flex;gap:6px}
.of-hint{position:absolute;left:12px;bottom:10px;z-index:1;margin:0;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--surface) 85%,transparent);font-size:12px;color:var(--ink-muted);pointer-events:none}
.of-pulse{display:flex;align-items:stretch;gap:8px;overflow-x:auto;padding:10px 12px;border-top:1px solid var(--line);background:var(--surface)}
.of-p-t{flex:0 0 auto;align-self:center;max-width:78px;margin:0 2px;font:800 10.5px/1.25 var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted)}
.of-p{flex:0 0 auto;min-width:96px;display:flex;flex-direction:column;gap:3px;padding:8px 11px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface-alt)}
.of-p b{font:800 22px/1 var(--font-display);color:var(--ink)}
.of-p span{font-size:12px;line-height:1.2;color:var(--ink-muted);max-width:110px}
.of-p.ok b{color:var(--ok)}.of-p.warn b{color:var(--warn)}.of-p.info b{color:var(--m-proj)}.of-p.idle b{color:var(--idle)}.of-p.ai b{color:var(--teal-700)}.of-p.crit b{color:var(--crit)}
.of-listv{padding:12px;border-top:1px solid var(--line);background:var(--surface)}
.of-listv .mem-n small{display:block;font-size:12px;color:var(--ink-muted)}
.of-ai-t{color:var(--teal-700);font-weight:600}
.of-feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.of-run{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface);box-shadow:var(--shadow-card)}
.of-run header{display:flex;align-items:center;gap:8px}
.of-run header span{display:flex;flex-direction:column;line-height:1.2}
.of-run header small{font-size:12px;color:var(--ink-muted)}
.of-run h4{margin:0;font:800 14.5px/1.3 var(--font-display)}
.of-run p{margin:0;font-size:13.5px;line-height:1.45;color:var(--ink-muted);flex:1}
.of-run .btn{align-self:flex-start}
.of-how .gcard h3{margin-top:0}
.of-teaser{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:18px 26px;padding:22px 24px;border-radius:var(--radius-lg);background:var(--navy-900);color:var(--on-navy);box-shadow:var(--shadow-card)}
.of-teaser .eyebrow{color:var(--teal-500);margin:0 0 6px}
.of-teaser h2{margin:0 0 6px;font:800 21px/1.25 var(--font-display);color:#fff}
.of-teaser p{margin:0;color:var(--on-navy-muted);font-size:14.5px;line-height:1.5;max-width:640px}
.of-teaser-av{display:flex}
.of-teaser-av .av-chip{margin-left:-4px;box-shadow:0 0 0 2px var(--navy-900)}
.of-teaser-av .av-chip:first-child{margin-left:0}
.of-teaser .btn.primary{background:var(--teal-500);border-color:var(--teal-500);color:#061127}
@media (max-width:900px){.of-teaser{grid-template-columns:minmax(0,1fr)}.of-teaser .btn{justify-self:start}}
@media (max-width:900px){.of-top{align-items:flex-start}.of-clock{width:100%}}
@media (max-width:640px){
  .of-stage{height:clamp(400px,64vh,620px)}
  .of-panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;max-height:72%}
  .of-hint{display:none}
  .of-bar .btn{padding-inline:10px}
  .of-cap{bottom:8px}
  .of-bub{max-width:180px}
}
/* ---------- directorio del equipo ---------- */
.dir-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:16px}
.dir-q{flex:1 1 260px;min-width:0}
.dir-q input{width:100%;border:1px solid var(--line);border-radius:999px;padding:9px 14px;font:inherit;font-size:14px;background:var(--surface);color:var(--ink)}
.dir-q input:focus{outline:none;box-shadow:var(--focus-ring)}
.dir-adm{display:flex;flex-wrap:wrap;gap:6px}
.dir-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.dir-card{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface)}
.dir-card.ext{background:var(--surface-alt);border-style:dashed}
.dir-card header{display:flex;gap:10px;align-items:flex-start}
.dir-card h3{margin:0;font:800 15px/1.25 var(--font-display)}
.dir-card header p{margin:2px 0 0;font-size:13px;color:var(--ink-muted)}
.dir-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:0;font-size:13px}
.dir-meta a{color:var(--teal-700);word-break:break-all}
.dir-chips{display:flex;flex-direction:column;gap:6px}
.dir-chip{display:flex;align-items:center;gap:8px;padding:4px 6px 4px 4px;border:1px solid var(--line-soft);border-radius:var(--radius-sm);background:var(--surface-alt);font-size:13px}
.dir-chip .code-chip{flex:none;cursor:pointer;border:0}
.dir-r{flex:1;min-width:0;line-height:1.3}
.dir-x{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--crit);font:700 15px/1 var(--font-body);cursor:pointer}
.dir-x:hover{border-color:var(--crit);background:var(--crit-soft)}
.dir-card footer{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:auto;padding-top:8px;border-top:1px solid var(--line-soft)}
.dir-cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.dir-col{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface)}
.dir-col header{display:flex;gap:10px;align-items:flex-start}
.dir-col header .code-chip{flex:none;cursor:pointer;border:0}
.dir-col h3{margin:0;font:800 14px/1.3 var(--font-display)}
.dir-col header small{display:block;margin-top:2px;font-size:12.5px;color:var(--ink-muted)}
.dir-col ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.dir-col li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.dir-col li b{display:block;font-size:13.5px}
.dir-col li small{display:block;font-size:12.5px;color:var(--ink-muted);line-height:1.3}
.dir-ra{display:inline-flex;align-items:center;gap:2px}
.dir-add{align-self:flex-start;margin-top:auto}
.nw{white-space:nowrap}
.asg-pj{grid-column:1/-1;border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;margin:12px 0 0}
.asg-pj legend{padding:0 6px;font-weight:700;font-size:13px}
.asg-row{display:grid;grid-template-columns:auto auto minmax(0,1fr);align-items:center;gap:8px;margin:6px 0}
.asg-row input[type=text],.asg-row input:not([type]){border:1px solid var(--line);border-radius:var(--radius-sm);padding:6px 8px;font:inherit;font-size:13.5px;background:var(--surface);color:var(--ink);min-width:0}
/* reuniones de emergencia */
:root{--sos:#B8352C;--sos-ink:#FFFFFF;--sos-soft:#FBE5E3;--sos-line:#F2C4BF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sos:#C4433A;--sos-soft:#3B1C1A;--sos-line:#6B2B26}}
:root[data-theme="dark"]{--sos:#C4433A;--sos-soft:#3B1C1A;--sos-line:#6B2B26}
.btn.sos{background:var(--sos);border-color:var(--sos);color:var(--sos-ink);display:inline-flex;align-items:center;gap:6px}
.btn.sos:hover{filter:brightness(1.08);color:var(--sos-ink);border-color:var(--sos)}
.nav-r .sos-nav{background:var(--sos);border:1px solid #ffffff40;color:#fff;border-radius:999px;width:36px;height:34px;padding:0;display:inline-grid;place-items:center;cursor:pointer}
.nav-r .sos-nav:hover{filter:brightness(1.12)}
.nav-r .sos-nav:focus-visible{box-shadow:var(--focus-ring);outline:0}
.sos-i{color:var(--sos)}
.sos-bar{background:var(--sos);color:var(--sos-ink)}
.sos-bar .wrap{display:grid;gap:2px;padding-block:6px}
.sos-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:4px 0}
.sos-dot{width:12px;height:12px;border-radius:50%;background:#fff;flex:none;box-shadow:0 0 0 0 #ffffffb3;animation:sosPulse 1.6s infinite}
@keyframes sosPulse{0%{box-shadow:0 0 0 0 #ffffffb3}70%{box-shadow:0 0 0 10px #ffffff00}100%{box-shadow:0 0 0 0 #ffffff00}}
@media (prefers-reduced-motion: reduce){.sos-dot{animation:none}}
.sos-txt{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;min-width:0;flex:1 1 280px;font-size:14px;line-height:1.35}
.sos-txt b{font:800 12px/1.2 var(--font-display);letter-spacing:.08em;text-transform:uppercase}
.sos-txt span{font-weight:700;overflow-wrap:anywhere}
.sos-txt small{opacity:.92;font-size:13px}
.sos-acts{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sos-bar .btn{border-radius:999px}
.sos-bar .sos-w{background:#fff;border-color:#fff;color:var(--sos);font-weight:700}
.sos-bar .sos-w:hover{color:var(--sos);filter:brightness(.96)}
.sos-bar .sos-o{background:transparent;border-color:#ffffffa6;color:#fff}
.sos-bar .sos-o:hover,.sos-bar .sos-o.on{background:#fff;color:var(--sos);border-color:#fff}
.sos-x{border:0;background:none;color:#fff;font-size:22px;line-height:1;width:32px;height:32px;border-radius:50%;cursor:pointer}
.sos-x:hover{background:#ffffff26}
.sos-x:focus-visible,.sos-bar .btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.sos-more-t{margin:0 0 4px 24px;font-size:12.5px;opacity:.9}
.sos-lead{display:flex;gap:10px;align-items:flex-start;background:var(--sos-soft);border:1px solid var(--sos-line);color:var(--ink);border-radius:var(--radius-sm);padding:10px 12px;margin:0 0 14px;font-size:14px;line-height:1.45}
.sos-lead .ico{color:var(--sos);flex:none;margin-top:1px}
.sos-who{border:0;padding:0;margin:0 0 12px}
.sos-who legend{font-weight:700;font-size:13px;margin-bottom:6px;padding:0}
.sos-seg{display:flex;flex-wrap:wrap;gap:6px}
.sos-seg label{position:relative;cursor:pointer}
.sos-seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.sos-seg span{display:inline-block;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font:600 13.5px/1.2 var(--font-body)}
.sos-seg input:checked+span{background:var(--sos);border-color:var(--sos);color:var(--sos-ink)}
.sos-seg input:focus-visible+span{box-shadow:var(--focus-ring)}
.sos-pj{margin-bottom:10px}
.sos-list{border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 10px;margin:0 0 14px;max-height:320px;overflow:auto;background:var(--surface-alt)}
.sos-tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-muted);font-weight:700;padding:2px 2px 6px}
.sos-tools span{margin-right:auto}
.sos-rows{display:grid;gap:4px}
.sos-p{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,auto);align-items:center;gap:6px 12px;padding:6px 8px;border-radius:var(--radius-sm);border:1px solid transparent}
.sos-p.on{background:var(--surface);border-color:var(--line)}
.sos-p label{display:flex;align-items:center;gap:9px;min-width:0;cursor:pointer}
.sos-p label input{width:17px;height:17px;flex:none;accent-color:var(--sos)}
.sos-n{display:grid;min-width:0}
.sos-n b{font-size:14px;line-height:1.25}
.sos-n small{font-size:12px;color:var(--ink-muted)}
.sos-c{display:flex;align-items:center;gap:6px;justify-content:flex-end;min-width:0;flex-wrap:wrap}
.sos-em{font:500 12.5px/1.3 var(--font-mono);color:var(--ink-muted);overflow-wrap:anywhere;text-align:right}
.sos-in{border:1px solid var(--line);border-radius:var(--radius-sm);padding:6px 8px;font:inherit;font-size:13px;background:var(--surface);color:var(--ink);width:230px;max-width:100%}
.sos-more{margin-top:8px}
.sos-more summary{cursor:pointer;font-weight:700;font-size:13px;color:var(--teal-700);padding:4px 2px}
.sos-save{margin:10px 0 4px}
.sos-sum{margin-top:10px;display:grid;gap:6px}
.sos-k{margin:0;font-size:14px}
.sos-card{border:1px solid var(--line);border-left:4px solid var(--sos);border-radius:var(--radius-sm);padding:12px 14px;background:var(--surface);display:grid;gap:6px}
.sos-card h3{margin:0;font:800 18px/1.3 var(--font-display)}
.sos-card p{margin:0}
.sos-place{font-size:14px}
.sos-h{margin:16px 0 8px;font:800 14px/1.3 var(--font-display)}
.sos-send{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.sos-send .btn{display:inline-flex;align-items:center;gap:6px}
.sos-to textarea{font:500 12.5px/1.45 var(--font-mono);resize:vertical}
.mt-row.urgent{border-left:4px solid var(--sos)}
.ag-card.urgent{border-color:var(--sos);box-shadow:inset 4px 0 0 var(--sos)}
@media (max-width:640px){
  .sos-p{grid-template-columns:1fr}
  .sos-c{justify-content:flex-start;padding-left:26px}
  .sos-em{text-align:left}
  .sos-in{width:100%}
  .sos-row{gap:8px}
  .sos-acts{width:100%}
}
.hero-cta{margin:18px 0 0}
.dir-cf{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;align-items:center}
.dir-cf .dir-add{margin-top:0}
.btn.sos-ghost{color:var(--sos);border-color:var(--sos-line);display:inline-flex;align-items:center;gap:5px}
.btn.sos-ghost:hover{color:var(--sos);border-color:var(--sos)}
.mt-g{font-size:12.5px;color:var(--ink-muted);margin-left:6px}

/* transferir pendientes */
.tr-btn{font-size:12.5px;font-weight:700;color:var(--teal-700)}
.tr-tag{display:inline-block;background:var(--teal-100);color:var(--ink);border-radius:999px;padding:1px 8px;font-size:12px;font-weight:600}
.tr-new{display:flex;gap:8px;align-items:center;background:var(--surface-alt);border:1px solid var(--line);border-left:4px solid var(--teal-700);border-radius:var(--radius-sm);padding:8px 12px;margin:0 0 10px;font-size:14px}
.tr-help{margin:0 0 12px}
.tr-card{border:1px solid var(--line);border-left:4px solid var(--teal-700);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:10px;background:var(--surface)}
.tr-card p{margin:0}.tr-name{font-weight:700;margin:2px 0 4px!important}
.tr-who{border:0;padding:0;margin:8px 0 10px}.tr-who legend{font-weight:700;font-size:13px;margin-bottom:6px;padding:0}
.tr-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px;border:1px solid var(--line);border-radius:var(--radius-sm);padding:6px;background:var(--surface-alt);max-height:260px;overflow:auto}
.tr-p{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:var(--radius-sm);cursor:pointer;min-width:0}
.tr-p:has(input:checked){background:var(--surface);box-shadow:inset 0 0 0 1px var(--teal-700)}
.tr-p input,.tr-keep input{width:17px;height:17px;flex:none;accent-color:var(--teal-700)}
.tr-keep{display:flex;align-items:center;gap:8px;font-size:14px;margin:0 0 10px;cursor:pointer}

function stepper(p) {

  const W = 380, H = 300, L = 46, R = 366, Tp = 14, B = 252;
  const X = e => L + (e - 1) / 4 * (R - L), Y = i => B - (i - 1) / 4 * (B - Tp);
  let g = `<rect x="${L}" y="${Tp}" width="${X(3) - L}" height="${Y(3) - Tp}" class="m-q-prior"/><rect x="${X(3)}" y="${Tp}" width="${R - X(3)}" height="${Y(3) - Tp}" class="m-q-act"/><rect x="${L}" y="${Y(3)}" width="${X(3) - L}" height="${B - Y(3)}" class="m-q-np"/><rect x="${X(3)}" y="${Y(3)}" width="${R - X(3)}" height="${B - Y(3)}" class="m-q-na"/>`;
  g += `<text x="${L + 6}" y="${Tp + 14}" class="m-qlbl">PRIORIZAR ACCIONES</text><text x="${X(3) + 6}" y="${Tp + 14}" class="m-qlbl">ACCIONES A REALIZAR</text><text x="${L + 6}" y="${B - 7}" class="m-qlbl">ÁREA NO PRIORITARIA</text><text x="${X(3) + 6}" y="${B - 7}" class="m-qlbl">NO ATENDER</text>`;
  for (let v = 1; v <= 5; v++) { g += `<text x="${X(v)}" y="${B + 16}" text-anchor="middle" class="c-tick">${v}</text><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end" class="c-tick">${v}</text>`; }
  g += `<text x="${(L + R) / 2}" y="${H - 6}" text-anchor="middle" class="c-tick">Esfuerzo →</text><text transform="translate(13 ${(Tp + B) / 2}) rotate(-90)" text-anchor="middle" class="c-tick">Impacto →</text>`;
  const seen = {};
  const dots = pts.map(({ p, pr }) => {
    const key = pr.i.toFixed(2) + '|' + pr.e.toFixed(2); const k = seen[key] = (seen[key] || 0) + 1;
    return { p, pr, x: X(pr.e) + (k - 1) * 10, y: Y(pr.i) - (k - 1) * 10 };
  });
  dots.forEach(({ p, pr, x, y }) => {
    // la etiqueta va a la izquierda si a la derecha choca con otro punto o con el borde
    const left = x + 44 > W || dots.some(b => b.p !== p && Math.abs(b.y - y) < 16 && b.x > x && b.x - x < 46);
    g += `<g class="g-row" data-act="go-project" data-id="${esc(p.id)}"><title>${esc(p.code)} · ${esc(p.name)} — impacto ${pr.i.toFixed(2)}, esfuerzo ${pr.e.toFixed(2)}: ${esc(pr.quad.label)}</title><circle cx="${x}" cy="${y}" r="7" class="m-dot"/><text x="${left ? x - 11 : x + 11}" y="${y + 4}"${left ? ' text-anchor="end"' : ''} class="m-lbl">${esc(p.code)}</text></g>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Matriz impacto esfuerzo de la cartera">${g}</svg>`;

function sCurve(p, m) {
  const td = today();
  const L = m.leaves.map(t => ({ s: parseD(t.start), e: parseD(t.end) || parseD(t.start), w: m.costMode ? num(t.plannedCost) : null })).filter(x => x.s);
  if (!L.length) return `<div class="empty"><p>Agrega actividades con fechas en la pestaña Cronograma para dibujar la curva S.</p></div>`;
  L.forEach(x => { if (x.w == null) x.w = Math.max(1, dBetween(x.s, x.e) + 1); });
  const W = L.reduce((s, x) => s + x.w, 0) || 1;
  let min = L.reduce((a, x) => x.s < a ? x.s : a, L[0].s), max = L.reduce((a, x) => x.e > a ? x.e : a, L[0].e);
  if (+max === +min) max = new Date(min.getTime() + DAY);
  const at = d => L.reduce((s, x) => s + x.w * plannedFrac(x.s, x.e, d), 0) / W * 100;
  const VW = 560, VH = 230, Lx = 44, Rx = 546, Ty = 14, By = 192;
  const X = d => Lx + (d - min) / (max - min) * (Rx - Lx), Y = v => By - v / 100 * (By - Ty);
  const N = 48; let path = '', area = '';

  area += `L${Rx} ${By}Z`;
  let g = `<path d="${area}" class="c-area" opacity=".8"/>`;
  [0, 25, 50, 75, 100].forEach(v => { g += `<line x1="${Lx}" x2="${Rx}" y1="${Y(v)}" y2="${Y(v)}" class="c-grid"/><text x="${Lx - 8}" y="${Y(v) + 4}" text-anchor="end" class="c-tick">${v}%</text>`; });
  const ticks = 5; for (let i = 0; i <= ticks; i++) { const d = new Date(min.getTime() + (max - min) * i / ticks); g += `<text x="${X(d)}" y="${By + 17}" text-anchor="${i === 0 ? 'start' : i === ticks ? 'end' : 'middle'}" class="c-tick">${MES[d.getMonth()]} ${String(d.getFullYear()).slice(2)}</text>`; }
  g += `<path d="${path}" class="c-plan"/>`;
  if (td >= min && td <= max) {
    const x = X(td), yp = Y(m.planPct || 0), yr = Y(m.realPct || 0);
    g += `<line x1="${x}" x2="${x}" y1="${Ty}" y2="${By}" class="c-today"/>`;
    g += `<circle cx="${x}" cy="${yp}" r="5" class="c-planpt"/><circle cx="${x}" cy="${yr}" r="6" class="c-real"/>`;
    const right = x > (Lx + Rx) / 2;

  }
  return `<svg class="chart" viewBox="0 0 ${VW} ${VH}" role="img" aria-label="Curva S: plan ${pct(m.planPct)}, real ${pct(m.realPct)} a la fecha de corte">${g}</svg><div class="legend"><span><i></i>Línea base (avance planificado acumulado)</span><span><i class="pt"></i>Planificado a hoy</span><span><i class="acc"></i>Avance real a hoy</span></div>`;
}

    { h: 'Estado', v: t => { if (t.type === 'Entregable') return ''; const st = taskState(t, td); return pill(st.tone, st.label + (st.k === 'late' ? ` · ${st.days} d` : '')) + (st.k === 'done' && t.doneAt ? `<span class="sub">el ${fmtDs(t.doneAt)}</span>` : ''); }, cls: 'nowrap' },
  ], { empty: 'El cronograma está vacío. Empieza por los entregables de la EDT y luego agrega sus actividades con fechas y responsable.' }));
  return panel('Diagrama de Gantt', 'Barra clara: plan. Relleno: avance físico. Rombo: hito. Toca una fila para editarla.', m.T.length ? tools + gantt(p, m) : '', addBtn('tasks', 'Agregar actividad'))
    + panel('Actividades', ed ? 'Marca «Hecha» al terminar una actividad, o escribe un avance parcial en «Avance». Todos los tableros se recalculan al instante.' : '', table);
}
function gantt(p, m) {
  const td = today();
  const rows = m.T.filter(t => wbsDepth(t.wbs) <= UI.depth);
  let min = null, max = null;
  for (const t of m.T) {
    const s = t.type === 'Entregable' ? (m.sum.get(t.id) || {}).start : parseD(t.start);
    const e = t.type === 'Entregable' ? (m.sum.get(t.id) || {}).end : (parseD(t.end) || parseD(t.start));
    if (s && (!min || s < min)) min = s; if (e && (!max || e > max)) max = e;
  }
  if (!min || !rows.length) return `<div class="empty"><p>Agrega fechas de inicio y fin a las actividades para dibujar el diagrama.</p></div>`;
  min = new Date(min.getFullYear(), min.getMonth(), 1); max = new Date(max.getFullYear(), max.getMonth() + 1, 0);
  const narrow = window.innerWidth < 640;
  const days = dBetween(min, max) + 1, LW = narrow ? 168 : 310, RH = 28, HH = 44;
  const avail = Math.max(260, Math.min(window.innerWidth, 1240) - 120 - LW);
  const pxd = clamp(avail / days, 1.1, 16);
  const BW = Math.ceil(days * pxd + 46), H = HH + rows.length * RH + 6;
  const X = d => 4 + dBetween(min, d) * pxd;
  const ed = canEdit();
  const rowAttr = t => ed ? ` data-act="edit" data-coll="tasks" data-id="${esc(t.id)}"` : '';
  let left = '', right = '';
  rows.forEach((t, i) => { if (i % 2) { left += `<rect x="0" y="${HH + i * RH}" width="${LW}" height="${RH}" class="g-zebra"/>`; right += `<rect x="0" y="${HH + i * RH}" width="${BW}" height="${RH}" class="g-zebra"/>`; } });
  for (let d = new Date(min); d <= max; d = new Date(d.getFullYear(), d.getMonth() + 1, 1)) {
    const x = X(d), nxt = new Date(d.getFullYear(), d.getMonth() + 1, 1), w = dBetween(d, nxt) * pxd;
    right += `<line x1="${x}" y1="${HH - 18}" x2="${x}" y2="${H}" class="g-grid"/>`;
    if (w >= 22) right += `<text x="${x + 4}" y="${HH - 9}" class="g-month">${MES[d.getMonth()]}</text>`;
    if (d.getMonth() === 0 || +d === +min) right += `<text x="${x + 4}" y="${HH - 25}" class="g-year">${d.getFullYear()}</text>`;
  }
  left += `<line x1="0" y1="${HH}" x2="${LW}" y2="${HH}" class="g-sep"/><text x="10" y="${HH - 9}" class="g-month">ELEMENTO DE LA EDT</text>`;
  right += `<line x1="0" y1="${HH}" x2="${BW}" y2="${HH}" class="g-sep"/>`;
  rows.forEach((t, i) => {
    const y = HH + i * RH, d = wbsDepth(t.wbs), indent = 10 + (d - 1) * (narrow ? 8 : 12);
    const codeW = String(t.wbs).length * 7 + 8;
    const maxChars = Math.max(5, Math.floor((LW - indent - codeW - 8) / 6.6));
    const label = String(t.name || '').length > maxChars ? String(t.name).slice(0, maxChars - 1) + '…' : String(t.name || '');
    const tip = `<title>${esc(t.wbs)} ${esc(t.name)}${t.owner ? ' · ' + esc(t.owner) : ''}</title>`;
    left += `<g class="g-row"${rowAttr(t)}>${tip}<rect x="0" y="${y}" width="${LW}" height="${RH}" class="g-hit"/><text x="${indent}" y="${y + 18}" class="g-code">${esc(t.wbs)}</text><text x="${indent + codeW}" y="${y + 18}" class="g-label${t.type === 'Entregable' ? ' sum' : ''}">${esc(label)}</text></g>`;
    let bar = '';
    if (t.type === 'Entregable') {
      const s = m.sum.get(t.id) || {};
      if (s.start && s.end) { const x1 = X(s.start), x2 = X(s.end) + pxd; bar = `<rect x="${x1}" y="${y + 11}" width="${Math.max(3, x2 - x1)}" height="6" rx="3" class="g-sum"/><text x="${x2 + 6}" y="${y + 18}" class="g-pct">${pct(s.progress)}</text>`; }
    } else {
      const s = parseD(t.start), e = parseD(t.end) || s, st = taskState(t, td);
      if (s) {
        if (t.type === 'Hito') { const cx = X(e || s) + pxd / 2, cy = y + RH / 2; bar = `<path d="M${cx} ${cy - 8}L${cx + 8} ${cy}L${cx} ${cy + 8}L${cx - 8} ${cy}Z" class="g-ms${st.k === 'done' ? ' done' : ''}"/>`; }
        else { const x1 = X(s), w = Math.max(3, (dBetween(s, e) + 1) * pxd), pw = w * clamp(num(t.progress), 0, 100) / 100; bar = `<rect x="${x1}" y="${y + 7}" width="${w}" height="14" rx="4" class="g-plan"/>${pw > 0 ? `<rect x="${x1}" y="${y + 7}" width="${pw}" height="14" rx="4" class="g-prog ${st.k}"/>` : ''}<text x="${x1 + w + 6}" y="${y + 18}" class="g-pct">${pct(num(t.progress))}</text>`; }
      }
    }
    right += `<g class="g-row"${rowAttr(t)}>${tip}<rect x="0" y="${y}" width="${BW}" height="${RH}" class="g-hit"/>${bar}</g>`;
  });
  let todayX = '';
  if (td >= min && td <= max) { const x = X(td) + pxd / 2; todayX = x.toFixed(0); right += `<line x1="${x}" y1="${HH - 4}" x2="${x}" y2="${H}" class="g-today"/><text x="${x + 4}" y="${HH - 30}" class="g-today-l">HOY</text>`; }
  return `<div class="gantt-wrap"><svg class="g-left" width="${LW}" height="${H}" viewBox="0 0 ${LW} ${H}" aria-hidden="true">${left}</svg><div class="g-scroll" data-today-x="${todayX}"><svg width="${BW}" height="${H}" viewBox="0 0 ${BW} ${H}" role="img" aria-label="Diagrama de Gantt de ${esc(p.code)}">${right}</svg></div></div>`;
}

function tabFinanzas(p, m) {
  const cv = m.EV - m.AC, sv = m.EV - m.PV, etc = m.EAC != null ? m.EAC - m.AC : null;
  const intro = m.costMode ? '' : `<div class="empty"><p>Aún no hay costos planificados en las actividades. Registra el <b>costo planificado</b> y el <b>costo real</b> de cada actividad (pestaña Cronograma → Editar) para activar el análisis de valor ganado. Mientras tanto, el SPI se calcula ponderando por duración.</p></div>`;
  const k = `<section class="kpis">
    ${kpi('Presupuesto BAC', money(m.budget), num(p.budget) ? 'Aprobado en el acta' : 'Suma de costos planificados', 'portafolio')}
    ${kpi('Valor planificado PV', money(m.PV), 'Lo que debió ejecutarse a hoy', 'cronograma')}
    ${kpi('Valor ganado EV', money(m.EV), 'Lo logrado, valorizado', 'curva')}
    ${kpi('Costo real AC', money(m.AC), 'Lo efectivamente gastado', 'acuerdo')}
    ${kpi('Estimación EAC', m.EAC != null ? money(m.EAC) : '—', m.VAC != null ? `VAC ${money(m.VAC)}` : 'BAC ÷ CPI', 'riesgo', m.VAC != null ? pill(m.VAC >= 0 ? 'ok' : 'crit', m.VAC >= 0 ? 'Dentro del presupuesto' : 'Sobrecosto') : '')}
  </section>`;
  const gl = `<dl class="gl"><dt>CV = EV − AC</dt><dd>${m.costMode ? `<b class="num ${cv >= 0 ? 'tone-ok' : 'tone-crit'}">${money(cv)}</b> · ${cv >= 0 ? 'dentro del presupuesto' : 'sobrecosto'}` : '—'}</dd><dt>SV = EV − PV</dt><dd>${m.costMode ? `<b class="num ${sv >= 0 ? 'tone-ok' : 'tone-crit'}">${money(sv)}</b> · ${sv >= 0 ? 'adelantado' : 'atrasado'} en valor` : '—'}</dd><dt>CPI = EV / AC</dt><dd><b class="num tone-${idxTone(m.CPI)}">${ix(m.CPI)}</b> · cada S/ 1 gastado produce S/ ${ix(m.CPI)} de valor</dd><dt>SPI = EV / PV</dt><dd><b class="num tone-${idxTone(m.SPI)}">${ix(m.SPI)}</b> · ritmo de avance frente al plan</dd><dt>ETC = EAC − AC</dt><dd>${etc != null ? money(etc) : '—'} · lo que falta gastar</dd><dt>TCPI</dt><dd>${ix(m.TCPI)} · eficiencia necesaria para terminar dentro del BAC</dd></dl>`;
  const groups = m.T.filter(t => t.type === 'Entregable' && wbsDepth(t.wbs) === 1);
  const td = today();
  const gRows = groups.map(g => {
    const kids = m.leaves.filter(l => isChildOf(l.wbs, g.wbs));
    let bac = 0, pv = 0, ev = 0, ac = 0;
    kids.forEach(t => { const s = parseD(t.start), e = parseD(t.end) || s; bac += num(t.plannedCost); pv += num(t.plannedCost) * plannedFrac(s, e, td); ev += num(t.plannedCost) * clamp(num(t.progress), 0, 100) / 100; ac += num(t.actualCost); });
    return { g, bac, pv, ev, ac };
  });
  const tbl = m.costMode && gRows.length ? `<div class="tbl"><table><thead><tr><th>Entregable</th><th class="r">BAC</th><th class="r">PV</th><th class="r">EV</th><th class="r">AC</th><th class="r">CPI</th><th class="r">SPI</th></tr></thead><tbody>${gRows.map(r => `<tr><td><span class="mono">${esc(r.g.wbs)}</span> ${esc(r.g.name)}</td><td class="r">${money(r.bac)}</td><td class="r">${money(r.pv)}</td><td class="r">${money(r.ev)}</td><td class="r">${money(r.ac)}</td><td class="r tone-${idxTone(r.ac ? r.ev / r.ac : null)}">${ix(r.ac ? r.ev / r.ac : null)}</td><td class="r tone-${idxTone(r.pv ? r.ev / r.pv : null)}">${ix(r.pv ? r.ev / r.pv : null)}</td></tr>`).join('')}</tbody></table></div>` : '';
  const maxV = Math.max(m.budget, m.PV, m.EV, m.AC, 1);
  const bars = m.costMode ? `<div class="hbars">${[['Presupuesto (BAC)', m.budget, ''], ['Planificado a hoy (PV)', m.PV, ''], ['Valor ganado (EV)', m.EV, 'ok'], ['Costo real (AC)', m.AC, 'acc']].map(([l, v, c]) => `<div class="hbar"><span class="lab">${l}</span><div class="trk"><span class="${c}" style="width:${(v / maxV * 100).toFixed(1)}%"></span></div><span class="num">${money(v)}</span></div>`).join('')}</div>` : '';
  return intro + k + `<div class="split">${panel('Indicadores de valor ganado', 'Fórmulas de la gestión del valor ganado (EVM) aplicadas a la fecha de corte.', gl)}${panel('Comparación de montos', '', bars || '<p class="note">Se mostrará al registrar costos.</p>')}</div>` + (tbl ? panel('Valor ganado por entregable', '', tbl) : '');
}

function tabInteresados(p) {
  const SH = of('stakeholders', p.id).slice().sort((a, b) => (num(b.power) * num(b.interest)) - (num(a.power) * num(a.interest)));
  const q = (pw, it) => SH.filter(s => (num(s.power) >= 3) === pw && (num(s.interest) >= 3) === it);
  const box = (cls, title, list) => `<div class="qbox ${cls}"><h4>${title}</h4><div class="chips">${list.length ? list.map(s => `<span class="chip" title="${esc(s.role || '')}">${esc(s.name)}</span>`).join('') : '<span class="note">—</span>'}</div></div>`;
  const grid = `<div class="quad">${box('q4', 'Mantener satisfecho', q(true, false))}${box('q2', 'Gestionar de cerca', q(true, true))}${box('q3', 'Monitorear', q(false, false))}${box('q1', 'Mantener informado', q(false, true))}</div><div class="quad-axes"><span>↑ Más poder</span><span>Más interés →</span></div>`;
  const lvl = n => OPT.engagement.indexOf(n);
  const dots = s => { const c = lvl(s.current), d = lvl(s.desired); return `<div class="dots" role="img" aria-label="Compromiso ${esc(s.current || 'sin dato')}${s.desired ? ', deseado ' + esc(s.desired) : ''}">${OPT.engagement.map((_, i) => `<i class="${i <= c ? 'on' : i === d ? 'goal' : ''}"></i>`).join('')}</div>`; };
  const gaps = SH.filter(s => lvl(s.current) >= 0 && lvl(s.current) < lvl(s.desired)).length;
  const cards = SH.length ? `<div class="people">${SH.map(s => `<article class="person"><div class="avatar" aria-hidden="true">${esc(initials(s.name))}</div><h3>${esc(s.name)}</h3><p class="role">${esc([s.role, s.org].filter(Boolean).join(' · '))}</p>${dots(s)}<p class="role" style="font-size:12.5px">${esc(s.current || '—')}${lvl(s.current) < lvl(s.desired) ? ` → <b style="color:var(--teal-700)">${esc(s.desired)}</b>` : ''}</p><div class="sep"></div><div class="meta"><span>Poder <b>${num(s.power) || '—'}</b></span><span>Interés <b>${num(s.interest) || '—'}</b></span></div>${s.strategy ? `<p class="txt">${esc(s.strategy)}</p>` : ''}${canEdit() ? `<button class="icon-btn" data-act="edit" data-coll="stakeholders" data-id="${esc(s.id)}">Editar</button>` : ''}</article>`).join('')}</div>` : `<div class="empty"><p>Sin interesados registrados. Empieza por el patrocinador, los usuarios y quienes aprueban los entregables.</p>${addBtn('stakeholders')}</div>`;
  return `<div class="split">${panel('Matriz poder–interés', 'Indica cuánta atención necesita cada interesado.', SH.length ? grid : `<div class="empty"><p>Registra a los interesados para ubicarlos en la matriz.</p></div>`)}${panel('Brechas de compromiso', `${plural(gaps, 'interesado está', 'interesados están')} por debajo del compromiso que el proyecto necesita.`, SH.length ? `<ul class="alerts">${SH.filter(s => lvl(s.current) < lvl(s.desired)).slice(0, 8).map(s => `<li><span class="sev s1"></span><div><b>${esc(s.name)}</b>: de ${esc(s.current)} a ${esc(s.desired)}<div class="a-meta">${esc(s.strategy || 'Sin estrategia definida')}</div></div></li>`).join('') || '<li><span class="sev s0"></span><div>Sin brechas: todos tienen el compromiso deseado.</div></li>'}</ul>` : '')}</div>`
    + panel('Registro de interesados', 'Puntos llenos: compromiso actual (de Desconocedor a Líder). Anillo: compromiso deseado.', cards, addBtn('stakeholders'));
}

function tabRecursos(p, m) {
  const team = of('team', p.id).slice().sort((a, b) => num(b.dedication) - num(a.dedication));
  const td = today();
  const recent = of('logbook', p.id).filter(l => { const d = parseD(l.date); return d && dBetween(d, td) <= 30 && dBetween(d, td) >= 0; });
  const hrs = {}; recent.forEach(l => { const k = l.person || 'Sin nombre'; hrs[k] = (hrs[k] || 0) + num(l.hours); });
  const hList = Object.entries(hrs).sort((a, b) => b[1] - a[1]);
  const maxH = Math.max(1, ...hList.map(x => x[1]));
  const load = {}; m.leaves.forEach(t => { if (num(t.progress) < 100 && t.owner) load[t.owner] = (load[t.owner] || 0) + 1; });
  const hBars = hList.length ? `<div class="hbars">${hList.map(([n, h]) => `<div class="hbar"><span class="lab" title="${esc(n)}">${esc(n)}</span><div class="trk"><span style="width:${(h / maxH * 100).toFixed(1)}%"></span></div><span class="num">${h.toFixed(1)} h</span></div>`).join('')}</div>` : `<div class="empty"><p>Sin horas registradas en los últimos 30 días. El equipo las registra en la pestaña «Bitácora y lecciones».</p></div>`;
  const cards = team.length ? `<div class="people">${team.map(t => `<article class="person"><div class="avatar" aria-hidden="true">${esc(initials(t.name))}</div><h3>${esc(t.name)}</h3><p class="role">${esc(t.role || '')}</p><div class="sep"></div><div class="meta"><span>Dedicación <b>${num(t.dedication) ? num(t.dedication) + '%' : '—'}</b></span><span>Act. abiertas <b>${load[t.name] || 0}</b></span><span>Horas 30 d <b>${(hrs[t.name] || 0).toFixed(0)}</b></span></div>${t.skills ? `<p class="txt">${esc(t.skills)}</p>` : ''}${canEdit() ? `<button class="icon-btn" data-act="edit" data-coll="team" data-id="${esc(t.id)}">Editar</button>` : ''}</article>`).join('')}</div>` : `<div class="empty"><p>Sin integrantes. Agrega a las personas del equipo para asignarles actividades, riesgos y acuerdos.</p>${addBtn('team')}</div>`;
  return panel('Equipo del proyecto', 'Roles, dedicación, actividades abiertas a su cargo y horas registradas en la bitácora.', cards, addBtn('team'))
    + panel('Horas reales (últimos 30 días)', 'Suma de horas registradas en la bitácora por persona.', hBars);
}

function tabRiesgo(p, m) {
  const td = today();
  const threats = m.threats;
  const cells = []; for (let pr = 5; pr >= 1; pr--) { cells.push(`<div class="hax">${pr}</div>`); for (let im = 1; im <= 5; im++) { const sc = pr * im, list = threats.filter(r => num(r.probability) === pr && num(r.impact) === im); const cls = sc >= 15 ? 'hi' : sc >= 8 ? 'mid' : 'lo'; cells.push(`<div class="hcell ${cls}${list.length ? '' : ' zero'}" title="P${pr} × I${im} = ${sc}">${list.length || ''}${list.length ? `<small>${list.slice(0, 3).map(r => esc(r.code || '')).join(' ')}</small>` : ''}</div>`); } }
  const heat = `<div style="display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px;align-items:center"><div class="hax vert">Probabilidad</div><div><div class="heat">${cells.join('')}<div></div>${[1, 2, 3, 4, 5].map(i => `<div class="hax">${i}</div>`).join('')}</div><div class="heat-foot"><span>Impacto →</span><span>Alto ≥ 15 · Medio 8–14 · Bajo ≤ 7</span></div></div></div>`;
  const opps = m.openR.filter(r => r.kind === 'Oportunidad');
  const R = m.R.slice().sort((a, b) => { const ca = a.status === 'Cerrado' ? 1 : 0, cb = b.status === 'Cerrado' ? 1 : 0; if (ca !== cb) return ca - cb; return riskScore(b) - riskScore(a); });
  const sTone = { Abierto: 'warn', 'En tratamiento': 'data', Materializado: 'crit', Cerrado: 'ok' };
  const I = of('issues', p.id).slice().sort((a, b) => (a.status === 'Resuelto') - (b.status === 'Resuelto') || ['Alta', 'Media', 'Baja'].indexOf(a.priority) - ['Alta', 'Media', 'Baja'].indexOf(b.priority));
  const attention = threats.filter(r => riskScore(r) >= 15 || !r.response || (parseD(r.due) && parseD(r.due) < td)).sort((a, b) => riskScore(b) - riskScore(a));
  return `<div class="split">${panel('Mapa de calor de amenazas abiertas', `${plural(threats.length, 'amenaza abierta', 'amenazas abiertas')} · ${plural(opps.length, 'oportunidad', 'oportunidades')}. Cada celda muestra cuántos riesgos tienen esa probabilidad e impacto.`, heat)}
    ${panel('Riesgos que exigen atención', 'Puntaje alto, sin respuesta o con revisión vencida.', attention.length ? `<ul class="alerts">${attention.slice(0, 8).map(r => `<li><span class="sev ${riskScore(r) >= 15 ? 's2' : 's1'}"></span><div>${esc(r.title)}<div class="a-meta"><span class="mono">${esc(r.code || '')}</span><span>P×I ${riskScore(r)}</span><span>${esc(r.strategy || 'Sin estrategia')}</span>${r.owner ? `<span>${esc(r.owner)}</span>` : ''}</div></div></li>`).join('')}</ul>` : '<div class="empty"><p>Todas las amenazas tienen respuesta y están dentro de rango.</p></div>')}</div>`
    + panel('Registro de riesgos', 'Probabilidad × impacto en escala 1–5. Las oportunidades usan estrategias de explotar, mejorar o compartir.', regTable('risks', R, [
      { h: 'Código', v: r => `<span class="mono">${T_(r.code)}</span><span class="sub">${esc(r.kind || '')}</span>`, cls: 'nowrap' },
      { h: 'Riesgo', v: r => `${esc(r.title)}${r.trigger ? `<span class="sub">Señal: ${esc(r.trigger)}</span>` : ''}`, cls: 'wrap' },
      { h: 'P×I', v: r => { const sc = riskScore(r); return `<span class="pill ${r.kind === 'Oportunidad' ? 'data' : sc >= 15 ? 'crit' : sc >= 8 ? 'warn' : 'ok'}">${sc}</span><span class="sub">${num(r.probability)}×${num(r.impact)}</span>`; }, cls: 'nowrap' },
      { h: 'Respuesta', v: r => `${r.strategy ? `<b>${esc(r.strategy)}</b>: ` : ''}${wrapTxt(r.response)}`, cls: 'wrap' },
      { h: 'Dueño', v: r => T_(r.owner), cls: 'nowrap' },
      { h: 'Estado', v: r => `${pill(sTone[r.status] || '', r.status || '—')}${r.due ? `<span class="sub">Revisión ${fmtDs(r.due)}</span>` : ''}`, cls: 'nowrap' },
    ], { empty: 'Sin riesgos registrados. Identifícalos con lluvia de ideas, revisión de supuestos o lecciones de proyectos anteriores.' }), addBtn('risks'))
    + panel('Registro de incidentes', 'Problemas que ya ocurrieron y deben resolverse (a diferencia de los riesgos, que aún son inciertos).', regTable('issues', I, [
      { h: 'Código', v: i => `<span class="mono">${T_(i.code)}</span>`, cls: 'nowrap' },
      { h: 'Incidente', v: i => `${esc(i.title)}${i.description ? `<span class="sub">${esc(i.description)}</span>` : ''}`, cls: 'wrap' },
      { h: 'Prioridad', v: i => pill(i.priority === 'Alta' ? 'crit' : i.priority === 'Media' ? 'warn' : '', i.priority || '—'), cls: 'nowrap' },
      { h: 'Responsable', v: i => T_(i.owner), cls: 'nowrap' },
      { h: 'Objetivo', v: i => fmtDs(i.due), cls: 'nowrap num' },
      { h: 'Estado', v: i => pill(i.status === 'Resuelto' ? 'ok' : i.status === 'En curso' ? 'data' : 'warn', i.status || '—'), cls: 'nowrap' },

function mdLite(t) {

  for (const raw of lines) {

    if (inList) { html += '</ul>'; inList = false; }

// componentes del plan de gestión (lámina 1.4) y cómo el sistema comprueba cada uno
function planItems(p) {
  const n = c => (S.loaded.has(c) ? of(c, p.id) : []);
  const T = n('tasks'), R = n('requirements'), C = n('changes'), TM = n('team'), RK = n('risks'), SH = n('stakeholders');
  const has = v => !!String(v || '').trim();
  const cnt = (k, one, many) => `${k} ${k === 1 ? one : many}`;
  return [
    ['Propósito del plan', 'gobernanza', has(p.purpose), has(p.purpose) ? 'Registrado en el acta' : 'Falta el propósito en el acta'],
    ['Decisiones adoptadas en esta versión', 'gobernanza', C.some(c => has(c.decision)), C.some(c => has(c.decision)) ? cnt(C.filter(c => has(c.decision)).length, 'decisión registrada', 'decisiones registradas') : 'Sin decisiones en Control de cambios'],
    ['Enunciado del alcance', 'alcance', has(p.scopeIn), has(p.scopeIn) ? 'Alcance y exclusiones en el acta' : 'Falta «El alcance incluye»'],
    ['Estructura de desglose del trabajo (EDT / WBS)', 'alcance', T.some(t => t.type === 'Entregable'), T.length ? cnt(T.filter(t => t.type === 'Entregable').length, 'entregable', 'entregables') + ' · ' + cnt(T.length, 'elemento', 'elementos') : 'EDT vacía'],
    ['Matriz de trazabilidad de requisitos', 'alcance', R.length > 0, R.length ? cnt(R.length, 'requisito', 'requisitos') : 'Sin requisitos registrados'],
    ['Criterios de aceptación', 'alcance', R.some(r => has(r.criteria)), R.some(r => has(r.criteria)) ? cnt(R.filter(r => has(r.criteria)).length, 'requisito con criterio', 'requisitos con criterio') : 'Sin criterios de aceptación'],
    ['Roles y responsabilidades (matriz RACI)', 'recursos', TM.length > 0, TM.length ? cnt(TM.length, 'integrante con rol', 'integrantes con rol') : 'Equipo sin registrar'],
    ['Control de cambios', 'gobernanza', C.length > 0, C.length ? cnt(C.length, 'solicitud', 'solicitudes') : 'Sin solicitudes de cambio'],
    ['Gestión del cronograma', 'cronograma', T.some(t => t.start && t.end), T.some(t => t.start && t.end) ? 'Cronograma con fechas y línea base' : 'Cronograma sin fechas'],
    ['Gestión de la calidad', 'gobernanza', has(p.success), has(p.success) ? 'Criterios de éxito definidos' : 'Faltan criterios de éxito'],
    ['Gestión de riesgos', 'riesgo', RK.length > 0, RK.length ? cnt(RK.length, 'riesgo identificado', 'riesgos identificados') : 'Sin riesgos registrados'],
    ['Interesados y comunicaciones', 'interesados', SH.length > 0, SH.length ? cnt(SH.length, 'interesado', 'interesados') : 'Sin interesados registrados'],
    ['Documentos que integran este plan', null, !!driveUrl(p.drive), driveUrl(p.drive) ? 'Carpeta de Drive enlazada' : 'Sin carpeta de Drive'],
  ];
}

function slideProyectos() {
  const tools = [
    ['1.1', 'Diseñar flujo de trabajo', 'Sirve para organizar y asignar las tareas en secuencia.', 'cronograma', 'EDT y responsables en Cronograma'],
    ['1.2', 'Cronograma de actividades', 'Sirve para definir el proyecto en fases, etapas, actividades y tareas.', 'cronograma', 'Gantt en Cronograma'],
    ['1.3', 'Bitácora de trabajo', 'Sirve para registrar el avance diario de cada tarea.', 'bitacora', 'Bitácora y lecciones'],
    ['1.4', 'Plan de gestión del proyecto', 'Establece las directrices para definir, desarrollar, ejecutar y controlar el proyecto.', null, 'Los 13 componentes, abajo'],
    ['1.5', 'Página web del proyecto', 'Sirve para publicar todos los documentos del proyecto.', null, 'Es este sistema, con su carpeta de Drive'],

    <ol class="md-plan">${items.map(([t, tab, done, note], i) => `<li class="${done ? 'ok' : ''}"><span class="md-ck" aria-hidden="true">${done ? '✓' : i + 1}</span><div><b>${esc(t)}</b><small>${esc(note)}</small></div>${tab ? `<button class="linkish" data-act="go-project" data-id="${esc(cur.id)}" data-tab="${tab}">Ver en ${esc(tabLabel(tab))}</button>` : driveUrl(cur.drive) ? `<a class="linkish" href="${esc(driveUrl(cur.drive))}" target="_blank" rel="noopener noreferrer">Abrir carpeta ↗</a>` : ''}</li>`).join('')}</ol>`;
  }
  return `<div class="md-head" style="--mc:var(--m-proj)">${mdNum('1', 'big')}<div><h3>¿Qué busca la gestión de proyectos?</h3>${mdQuote(MAP_INFO.proj.q)}</div></div>

  ${panel('El contenido de un plan de gestión del proyecto (1.4)', 'Los 13 componentes de tu lámina. El sistema revisa en vivo cuáles ya tiene cada proyecto; elige uno.', plan)}`;

const semState = v => (v >= 90 ? { k: 'ok', t: 'Estado óptimo', r: '≥ 90' } : v >= 75 ? { k: 'warn', t: 'Estado aceptable', r: '75 a < 90' } : { k: 'crit', t: 'Estado crítico: hay que mejorar', r: '< 75' });

function slideProcesos() {
  const ph = Math.min(3, Math.max(0, UI.phaseSel | 0)), f = PHASES[ph];
  const v = Math.max(0, Math.min(100, Number(UI.semVal) || 0)), st = semState(v);
  const extra = ph === 2 ? `<div class="md-sem">
      <div class="md-sem-scale"><span class="crit">&lt; 75 Crítico</span><span class="warn">75 – 90 Aceptable</span><span class="ok">≥ 90 Óptimo</span></div>
      <label class="md-sem-in"><span>Prueba un indicador:</span><input type="range" min="0" max="100" step="1" value="${v}" data-change="sem" aria-label="Valor del indicador"><output class="num">${v}</output></label>
      <p class="md-sem-out">${pill(st.k, st.t)} <small>rango ${st.r}</small></p>
      <p class="note">Es la misma semaforización que usan los indicadores de calidad de la acreditación (3.2).</p>
    </div>` : '';
  const linked = linkedList(p => stepsOf(p).includes(f.k), p => esc(p.modeloRol || ''), 'Ningún proyecto trabaja esta fase todavía.');
  return `<div class="md-head" style="--mc:var(--m-proc)">${mdNum('2', 'big')}<div><h3>¿Qué busca la gestión por procesos?</h3>${mdQuote(MAP_INFO.proc.q)}</div></div>
  <div class="md-phases" role="tablist" aria-label="Fases">${PHASES.map((x, i) => `<button role="tab" aria-selected="${i === ph}" class="md-ph${i === ph ? ' on' : ''}${i < ph ? ' past' : ''}" data-act="phase" data-v="${i}">${mdNum(x.k)}<span><small>Fase ${i + 1}</small>${esc(x.t)}</span></button>`).join('')}</div>
  <div class="md-phase" style="--mc:var(--m-proc)">
    <div><p class="md-q">${esc(f.q)}</p>
      <div class="md-items">${f.items.map(([a, b]) => `<div><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join('')}</div>
      ${f.note ? `<p class="note" style="margin-top:12px">${esc(f.note)}</p>` : ''}${extra}</div>
    <aside><h4>Proyectos que trabajan la fase ${esc(f.k)}</h4>${linked}</aside>
  </div>
  <div class="md-nav-ph"><button class="btn sm" data-act="phase" data-v="${Math.max(0, ph - 1)}"${ph === 0 ? ' disabled' : ''}>← Fase anterior</button><button class="btn sm" data-act="phase" data-v="${Math.min(3, ph + 1)}"${ph === 3 ? ' disabled' : ''}>Fase siguiente →</button></div>`;
}

function slideRiesgo() {
  const P = S.loaded.has('projects') ? projectsSorted() : [];
  const ready = S.loaded.has('risks');
  const rows = P.map(p => { const R = ready ? of('risks', p.id) : []; const open = R.filter(r => r.status !== 'Cerrado'); const sc = r => num(r.probability) * num(r.impact); return { p, open, high: open.filter(r => sc(r) >= 15), mid: open.filter(r => sc(r) >= 8 && sc(r) < 15) }; });
  const top = rows.flatMap(x => x.high.map(r => ({ r, p: x.p }))).sort((a, b) => num(b.r.probability) * num(b.r.impact) - num(a.r.probability) * num(a.r.impact)).slice(0, 5);
  return `<div class="md-head" style="--mc:var(--m-risk)">${mdNum('R', 'big')}<div><h3>¿Qué busca la gestión del riesgo?</h3><p class="md-lead">Anticipar lo que puede impedir que un proyecto, un proceso o una acreditación cumpla su objetivo, y preparar la respuesta antes de que ocurra.</p>${mdSynth}</div></div>

/* geometría de las aristas: curvas de Bézier entre lados de las tarjetas */
const WB_NRM = { l: [-1, 0], r: [1, 0], t: [0, -1], b: [0, 1] };
const wbPt = ([x, y, w, h], s, t) => (s === 'l' ? [x, y + h * t] : s === 'r' ? [x + w, y + h * t] : s === 't' ? [x + w * t, y] : [x + w * t, y + h]);
function wbRect(id, M) { if (wbIsFrame(id)) { const f = M.F.find(x => x.id === id); return f && [f.x, f.y, f.w, f.h]; } const n = M.N.find(x => x.id === id); return n && [n.x, n.y, n.w, n.h]; }
function wbPath(a, b, anc, lt) {
  let s1, s2, p1, p2, L;
  if (anc) { s1 = anc[0]; s2 = anc[2]; p1 = wbPt(a, s1, anc[1]); p2 = wbPt(b, s2, anc[3]); L = Math.max(40, Math.hypot(p2[0] - p1[0], p2[1] - p1[1]) * 0.45); }
  else {
    const dx = b[0] + b[2] / 2 - (a[0] + a[2] / 2), dy = b[1] + b[3] / 2 - (a[1] + a[3] / 2);
    const horiz = Math.abs(dx) / (a[2] + b[2]) > Math.abs(dy) / (a[3] + b[3]);
    s1 = horiz ? (dx > 0 ? 'r' : 'l') : (dy > 0 ? 'b' : 't'); s2 = { l: 'r', r: 'l', t: 'b', b: 't' }[s1];
    p1 = wbPt(a, s1, 0.5); p2 = wbPt(b, s2, 0.5); L = Math.max(40, Math.abs(horiz ? p2[0] - p1[0] : p2[1] - p1[1]) * 0.5);
  }
  const n1 = WB_NRM[s1], n2 = WB_NRM[s2];
  const c1 = [p1[0] + n1[0] * L, p1[1] + n1[1] * L], c2 = [p2[0] + n2[0] * L, p2[1] + n2[1] * L];
  const t = lt == null ? 0.5 : lt, u = 1 - t, B = i => u * u * u * p1[i] + 3 * u * u * t * c1[i] + 3 * u * t * t * c2[i] + t * t * t * p2[i];
  const r = v => Math.round(v * 10) / 10;
  return { d: `M${r(p1[0])} ${r(p1[1])}C${r(c1[0])} ${r(c1[1])} ${r(c2[0])} ${r(c2[1])} ${r(p2[0])} ${r(p2[1])}`, mx: r(B(0)), my: r(B(1)) };
}

/* cámara */
const wbVp = () => document.getElementById('wb-vp');
let wbSize = null, wbIntroT = 0;
function wbApply(anim) {
  const w = document.getElementById('wb-world'), vp = wbVp(); if (!w || !vp) return;
  const c = UI.wb, mo = !!anim && !matchMedia('(prefers-reduced-motion: reduce)').matches;
  w.classList.toggle('anim', mo); vp.classList.toggle('anim', mo);
  w.style.transform = `translate(${c.x}px,${c.y}px) scale(${c.k})`;
  vp.classList.toggle('far', c.k < 0.45);
  let g = 32 * c.k; while (g < 16) g *= 2;
  vp.style.backgroundSize = `${g}px ${g}px`; vp.style.backgroundPosition = `${c.x}px ${c.y}px`;
  const zl = document.getElementById('wb-zl'); if (zl) zl.textContent = Math.round(c.k * 100) + '%';
  const r = vp.getBoundingClientRect(), mv = vp.querySelector('.wb-mm-vp'); wbSize = [r.width, r.height];
  if (mv) { mv.setAttribute('x', -c.x / c.k); mv.setAttribute('y', -c.y / c.k); mv.setAttribute('width', r.width / c.k); mv.setAttribute('height', r.height / c.k); }
}
// mantiene el mismo punto del lienzo al centro cuando cambia el tamaño del visor
function wbReflow() {
  const vp = wbVp(); if (!vp || !wbSize) return;
  const r = vp.getBoundingClientRect(); UI.wb.x += (r.width - wbSize[0]) / 2; UI.wb.y += (r.height - wbSize[1]) / 2; wbApply(false);
}
function wbFitRect([x, y, w, h], anim, pad) {
  const vp = wbVp(); if (!vp) return;
  const r = vp.getBoundingClientRect(); const p = pad == null ? 0.92 : pad;
  const k = Math.max(0.08, Math.min(1.6, Math.min(r.width / w, r.height / h) * p));
  UI.wb.k = k; UI.wb.x = r.width / 2 - (x + w / 2) * k; UI.wb.y = r.height / 2 - (y + h / 2) * k;
  wbApply(anim);
}
function wbZoomAt(f, mx, my, anim) {
  const c = UI.wb, k2 = Math.max(0.08, Math.min(2.2, c.k * f));
  c.x = mx - (mx - c.x) * k2 / c.k; c.y = my - (my - c.y) * k2 / c.k; c.k = k2; wbApply(anim);
}
function wbSpot(fid, sel) {

  const conn = new Set(); if (sel) { conn.add(sel); M.E.forEach(([a, b]) => { if (a === sel) conn.add(b); if (b === sel) conn.add(a); }); }
  const own = sel && (M.N.find(n => n.id === sel) || {}).f;
  w.querySelectorAll('.wb-el').forEach(el => { const id = el.dataset.el; const dim = (fid && el.dataset.f !== fid && id !== fid) || (sel && !conn.has(id) && id !== own); el.classList.toggle('dim', !!dim); el.classList.toggle('sel', id === sel); });

}

function dirPeople() {
  const people = membersActive().map(m => ({ key: 'm:' + m.id, m, name: m.name, role: m.role || '', email: m.email || '', assign: [] }));
  const byKey = new Map(people.map(x => [x.key, x]));

    const p = projectById(t.pid); if (!p) return;

async function ofAgentRun(mid, k, ask) {

  UI.of.ag = { mid, k, title: a.t, text: '', busy: true, error: '', saved: false, ask: k === 'custom' ? ask : '' };
  ofPanelPaint(); const s = OF.av.get(mid); if (s) ofTagText(s);
  try {
    const res = await sample(ofAgentPrompt(m, a), { signal: ctl.signal, cache: false, onText: ({ text }) => { if (UI.of.ag && UI.of.ag.mid === mid && ofAgentCtl === ctl) { UI.of.ag.text = text; ofAgentPaint(); } } });
    if (UI.of.ag && ofAgentCtl === ctl) { UI.of.ag.text = (res && res.text) || UI.of.ag.text; UI.of.ag.busy = false; }
  } catch (e) {
    const code = e && e.code, g = ofAgentCtl === ctl ? UI.of.ag : null;

    if (code === 'not_granted') { sample = null; toast('Los agentes de IA no están disponibles para tu cuenta en esta página.', 'warn'); }
    else if (code === 'rate_limited') { if (g) g.error = 'Se alcanzó el límite de consultas. Inténtalo de nuevo en unos minutos.'; }
    else if (code !== 'cancelled' && g) g.error = 'El agente no pudo terminar. Inténtalo de nuevo.';
  }
  if (ofAgentCtl === ctl) ofAgentCtl = null;
  ofPanelPaint();
}
